<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c0b"><title>My offline tickets</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0b;color:#f7f4ec;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}header{padding:24px 20px;border-bottom:1px solid #343530}header b{font-size:14px}header p{margin:7px 0 0;color:#9b9c94;font-size:11px;line-height:1.5}main{padding:24px 20px 70px}.night{margin:0 auto 22px;max-width:480px}.night>header{padding:0 0 18px;border:0}.night h1{margin:5px 0;font-size:29px;letter-spacing:-.05em}.night small,.night p{color:#a7a89f;font-size:10px}.ticket{margin-top:10px;padding:18px;background:#fffdf8;color:#181914}.ticket span{font-size:9px;text-transform:uppercase}.ticket h2{margin:7px 0 14px;font-size:18px}.ticket img{width:100%;display:block}.ticket code{display:block;margin-top:13px;text-align:center;font-size:12px;font-weight:700}.empty{min-height:65vh;display:grid;place-content:center;text-align:center}.empty h1{font-size:34px}.empty p{max-width:320px;color:#aaa;line-height:1.6}</style></head><body><header><b>BeCore Tickets · Offline door pass</b><p>This copy lives on your device. Last online status wins; transferred or refunded tickets can still be refused at the gate.</p></header><main id="tickets"></main><script>
const root=document.getElementById('tickets');let nights=[];try{nights=JSON.parse(localStorage.getItem('bct:offline-tickets:v1')||'[]')}catch{}
const esc=(v)=>String(v||'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
if(!nights.length){root.innerHTML='<div class="empty"><h1>No ticket saved yet.</h1><p>Open your Ticket inside My Nights once while online. We will quietly prepare the offline copy.</p></div>'}else root.innerHTML=nights.map((night)=>`<section class="night"><header><small>Saved ${new Date(night.savedAt).toLocaleString()}</small><h1>${esc(night.title)}</h1><p>${esc(night.fullDate)} · ${esc(night.time)}<br>${esc(night.venue)}, ${esc(night.area)}</p></header>${(night.tickets||[]).map((ticket)=>`<article class="ticket"><span>Ready to scan offline</span><h2>${esc(String(ticket.ticketType).replaceAll('-',' '))}</h2><img src="${ticket.qrImage}" alt="Offline ticket QR"><code>${esc(ticket.gateCode)}</code></article>`).join('')}</section>`).join('');
</script></body></html>
