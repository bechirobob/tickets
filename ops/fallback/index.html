<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#201726">
  <meta name="referrer" content="no-referrer">
  <title>Back shortly · BeCore Tickets</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body { margin: 0; min-height: 100svh; background: #201726; color: #f3f0e8; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    .page { width: min(100% - 48px, 880px); margin: auto; min-height: 100svh; display: flex; flex-direction: column; }
    header { padding: max(28px, env(safe-area-inset-top)) 0 24px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; }
    .brand img { width: 41px; height: 44px; object-fit: contain; }
    .brand b { display: block; font-size: 23px; line-height: .96; letter-spacing: -.055em; }
    .brand small { display: block; margin-top: 5px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 48px 0 64px; max-width: 520px; }
    .eyebrow { margin: 0 0 18px; color: #d7f45b; font-size: 14px; font-weight: 650; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.08; letter-spacing: -.045em; font-weight: 700; text-wrap: balance; }
    .message { max-width: 390px; margin: 22px 0 28px; color: #ccc5d0; font-size: 17px; line-height: 1.6; }
    .retry { display: inline-flex; min-height: 48px; align-items: center; padding: 12px 21px; border-radius: 12px; background: #d7f45b; color: #201726; text-decoration: none; font-size: 16px; font-weight: 700; }
    a:focus-visible { outline: 3px solid #fffdfa; outline-offset: 5px; }
    .retry:hover { background: #e3fc89; }
    footer { padding: 20px 0 max(28px, env(safe-area-inset-bottom)); font-size: 14px; color: #ccc5d0; }
    footer a { display: inline-flex; min-height: 44px; align-items: center; color: inherit; text-underline-offset: 4px; }
    @media (max-width: 360px) { .page { width: calc(100% - 36px); } }
  </style>
</head>
<body>
  <div class="page">
    <header><div class="brand" aria-label="BeCore Tickets"><img src="data:image/webp;base64,__BRAND_IMAGE__" alt="" width="41" height="44"><div aria-hidden="true"><b>BeCore</b><small>Tickets</small></div></div></header>
    <main>
      <p class="eyebrow">A brief intermission.</p>
      <h1>We’ll be back shortly.</h1>
      <p class="message">BeCore Tickets is temporarily unavailable. Give us a little time, then check back.</p>
      <a class="retry" href="https://tickets.becoreops.com/">Try again</a>
    </main>
    <footer><a href="mailto:tickets@becoreops.com">Need a hand? Get in touch.</a></footer>
  </div>
</body>
</html>
