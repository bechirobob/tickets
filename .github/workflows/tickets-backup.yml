name: Tickets encrypted production backup
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: backup-storage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify encrypted backup transport before host access
        run: python3 -m unittest discover -s .github/backup -p 'test_*.py' -v
      - name: Require private backup destination before host access
        env:
          GH_TOKEN: ${{ secrets.BACKUP_STORE_TOKEN }}
          BACKUP_STORE_SHA: ${{ vars.BACKUP_STORE_SHA }}
          BACKUP_STORE_ID: ${{ vars.BACKUP_STORE_ID }}
        run: |
          python3 - <<'PYGUARD'
          import os,re,sys
          sys.path.insert(0,'.github/backup')
          from backup_release import GitHub,STORAGE_REPOSITORY,private_repository,require
          require(re.fullmatch(r'[a-f0-9]{40}',os.environ['BACKUP_STORE_SHA']), 'Pinned store SHA required.')
          require(re.fullmatch(r'[1-9][0-9]{0,19}',os.environ['BACKUP_STORE_ID']), 'Pinned store ID required.')
          api=GitHub(STORAGE_REPOSITORY)
          private_repository(api,STORAGE_REPOSITORY,int(os.environ['BACKUP_STORE_ID']))
          commit=api.api('git/commits/'+os.environ['BACKUP_STORE_SHA'])
          require(commit.get('sha')==os.environ['BACKUP_STORE_SHA'], 'Backup store commit mismatch.')
          PYGUARD
      - name: Require dedicated Tickets connection
        env:
          CLIENT_ID: TQyYk1uNME11CNTRL-kEeSvbtg8X11CNTRL
          AUDIENCE: api.tailscale.com/TQyYk1uNME11CNTRL-kEeSvbtg8X11CNTRL
        run: |
          test -n "$CLIENT_ID" && test -n "$AUDIENCE" || { echo "Configure TICKETS_TS_CLIENT_ID and TICKETS_TS_AUDIENCE repository variables."; exit 1; }
      - name: Connect to Hermes
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kEeSvbtg8X11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kEeSvbtg8X11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Check whether Tickets is the live writer
        id: writer
        shell: bash
        run: |
          set -euo pipefail
          active="$(tailscale ssh root@hermes 'python3 -' <<'PY'
          import json,urllib.request,subprocess
          state=subprocess.run(['systemctl','show','becore-tickets.service','--property=ActiveState','--value'],capture_output=True,text=True,check=True).stdout.strip()
          if state == 'inactive':
            print('false')
          elif state == 'active':
            req=urllib.request.Request('http://127.0.0.1:3119/healthz',headers={'Host':'tickets.becoreops.com'})
            with urllib.request.urlopen(req,timeout=5) as response: health=json.load(response)
            assert health.get('active') is True and health.get('runtime')=='vps', 'Tickets service is running but is not a healthy active writer.'
            print('true')
          else:
            raise RuntimeError('Tickets service is not safely inactive or healthy: '+state)
          PY
          )"
          [[ "$active" == true || "$active" == false ]]
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - name: Create encrypted backup and test complete restore
        if: steps.writer.outputs.active == 'true'
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          result="$(tailscale ssh root@hermes "bash -s -- '$GITHUB_EVENT_NAME' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" <<'SH'
          set -euo pipefail
          exec 9>/run/lock/becore-tickets-deploy.lock
          flock -n 9
          release="$(systemctl show becore-tickets.service --property=WorkingDirectory --value)"
          test -f "$release/operations/backup.mjs"
          # Recovery runs preserve encrypted bytes before the existing keep-seven
          # engine can prune. The scheduled retention policy is unchanged.
          if [[ "$1" != schedule ]]; then
            python3 - "$2" <<'PYPRESERVE' >&2
          import hashlib,json,os,pathlib,re,shutil,sys
          root=pathlib.Path('/var/backups/becore-tickets')
          files=sorted((p for p in root.iterdir() if re.fullmatch(r'tickets-[0-9TZ.:-]+\.tar\.gz\.enc',p.name)),reverse=True)
          assert re.fullmatch(r'[1-9][0-9]*-[1-9][0-9]*',sys.argv[1])
          for source in files: assert source.is_file() and not source.is_symlink()
          records=[]
          if len(files)>=7:
            target=root/'recovery-preserved'/sys.argv[1]
            target.mkdir(parents=True,mode=0o700,exist_ok=False)
            target.parent.chmod(0o700)
            # Preserve all existing copies so clock skew cannot alter the prune set.
            for source in files:
              destination=target/source.name
              with source.open('rb') as src,destination.open('xb') as dst:
                shutil.copyfileobj(src,dst);dst.flush();os.fsync(dst.fileno())
              destination.chmod(0o600)
              original=hashlib.sha256(source.read_bytes()).hexdigest()
              assert hashlib.sha256(destination.read_bytes()).hexdigest()==original
              records.append({'original':str(source),'recovery':str(destination),'sha256':original,'bytes':source.stat().st_size})
            mapping=target/'restore-mapping.json'
            with mapping.open('x') as handle:
              json.dump(records,handle,sort_keys=True);handle.flush();os.fsync(handle.fileno())
            mapping.chmod(0o600)
            assert json.loads(mapping.read_text())==records
          print('BECORE_BACKUP_PRESERVATION '+json.dumps({'copies':len(records),'bytes':sum(r['bytes'] for r in records),'mapping':str(mapping) if records else None}))
          PYPRESERVE
          fi
          result="$("$release/bin/node" "$release/operations/backup.mjs")"
          name="$(printf '%s' "$result" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["ok"]; print(x["filename"])')"
          target="/var/backups/becore-tickets/restore-check-$RANDOM"
          trap 'rm -rf -- "$target"' EXIT
          "$release/bin/node" "$release/operations/restore-backup.mjs" "/var/backups/becore-tickets/$name" /etc/becore-tickets/backup.key "$target" >/dev/null
          printf '%s\n' "$result"
          SH
          )"
          name="$(printf '%s' "$result" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["ok"] and x["restoredAndAuthenticated"]; print(x["filename"])')"
          [[ "$name" =~ ^tickets-[0-9TZ.:-]+\.tar\.gz\.enc$ ]]
          tailscale ssh root@hermes "cat '/var/backups/becore-tickets/$name'" > "$RUNNER_TEMP/$name"
          test -s "$RUNNER_TEMP/$name"
          chmod 600 "$RUNNER_TEMP/$name"
          echo "file=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Publish and download-verify encrypted private release
        if: steps.writer.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_STORE_TOKEN }}
          BACKUP_STORE_SHA: ${{ vars.BACKUP_STORE_SHA }}
          BACKUP_STORE_ID: ${{ vars.BACKUP_STORE_ID }}
          BACKUP_PROJECT: tickets
          BACKUP_PATH: ${{ steps.backup.outputs.file }}
        run: python3 .github/backup/backup_release.py
      - name: Record durable verified off-host receipt
        if: steps.writer.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(base64 -w0 "$RUNNER_TEMP/offhost-release-receipt.json")"
          [[ "$receipt" =~ ^[A-Za-z0-9+/=]+$ ]]
          tailscale ssh root@hermes "python3 - '$receipt'" <<'PYRECEIPT'
          import base64,hashlib,json,os,pathlib,re,sys,tempfile
          raw=base64.b64decode(sys.argv[1],validate=True)
          proof=json.loads(raw)
          assert proof['schema']=='becore-encrypted-backup-release/v2'
          assert proof['storageRepository']=='bechirobob/becore-backups'
          assert proof['repository']=='bechirobob/tickets'
          assert proof['encrypted'] is True and proof['restoreTested'] is True and proof['downloadVerified'] is True
          assert re.fullmatch(r'tickets-[0-9TZ.:-]+\.tar\.gz\.enc',proof['filename'])
          source=pathlib.Path('/var/backups/becore-tickets')/proof['filename']
          digest=hashlib.sha256()
          with source.open('rb') as handle:
            for block in iter(lambda:handle.read(1024*1024),b''): digest.update(block)
          assert digest.hexdigest()==proof['sha256'] and source.stat().st_size==proof['size']
          path=pathlib.Path('/var/backups/becore-tickets/offhost.json')
          with tempfile.NamedTemporaryFile(dir=path.parent,prefix='.offhost-receipt-',delete=False) as handle:
            handle.write(raw);handle.flush();os.fsync(handle.fileno())
            temporary=handle.name
          os.chmod(temporary,0o600)
          os.replace(temporary,path)
          assert json.loads(path.read_bytes())==proof
          print('BECORE_BACKUP_DURABLE_RECEIPT '+json.dumps(proof,sort_keys=True))
          PYRECEIPT
