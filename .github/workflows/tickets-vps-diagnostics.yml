name: Verify cleaned Tickets booking state and public health
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Verify empty booking state, remove orphan confirmation receipt and check live routes
        run: |
          tailscale ssh root@hermes "python3 -" <<'PY'
          import sqlite3,json,datetime,uuid,urllib.request,urllib.error,os,subprocess
          db=sqlite3.connect('/var/lib/becore-tickets/tickets.sqlite',timeout=20)
          with db:
              # Legacy confirmation receipts can outlive their deleted order; they carry no useful live task.
              count=db.execute('DELETE FROM confirmation_deliveries WHERE NOT EXISTS (SELECT 1 FROM orders WHERE orders.id=confirmation_deliveries.order_id)').rowcount
              db.execute("INSERT INTO operational_audit_events(id,actor_role,action,target_type,outcome,detail,created_at) VALUES(?,?,?,?,?,?,?)",(str(uuid.uuid4()),'system','booking_cleanup_orphan_check','booking_history','success',json.dumps({'removedOrphanConfirmations':count,'cleanupRun':'36599462727'}),datetime.datetime.now(datetime.timezone.utc).isoformat()))
          report={'remaining':{t:db.execute('SELECT COUNT(*) FROM '+t).fetchone()[0] for t in ['orders','tickets','event_registrations','confirmation_deliveries']},'removedOrphanConfirmations':count,'databaseQuickCheck':db.execute('PRAGMA quick_check').fetchone()[0],'foreignKeyViolations':len(db.execute('PRAGMA foreign_key_check').fetchall()),'publicChecks':[]}
          for path in ['/healthz','/','/events','/my-nights','/scan','/api/public/events']:
              req=urllib.request.Request('https://tickets.becoreops.com'+path,headers={'User-Agent':'Mozilla/5.0 BeCoreCleanupVerification'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  body=response.read();assert response.status==200
                  item={'path':path,'status':response.status}
                  if path=='/healthz':
                      h=json.loads(body);assert h['active'] and h['revision']=='181bfc6801a4fc4c993dc0220af99bb3509e433d'
                  report['publicChecks'].append(item)
          report['previewState']=subprocess.check_output(['systemctl','show','becore-tickets-preview.service','--property=ActiveState','--property=UnitFileState'],text=True).strip()
          report['liveState']=subprocess.check_output(['systemctl','show','becore-tickets.service','--property=ActiveState','--property=MemoryCurrent','--property=NRestarts'],text=True).strip()
          fs=os.statvfs('/');report['diskAvailableBytes']=fs.f_bavail*fs.f_frsize
          print(json.dumps(report))
          
          PY
