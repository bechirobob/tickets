name: Verify and repair Tickets private credential startup
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Verify frozen-copy startup with private credential copy before installing scoped unit configuration
        run: |
          tailscale ssh root@hermes "PROBE_RUN='$GITHUB_RUN_ID' python3 -" <<'PY'
          import json,subprocess,urllib.request,urllib.error,pathlib
          for port in [3119,3118]:
           try:
            req=urllib.request.Request('http://127.0.0.1:'+str(port)+'/healthz',headers={'Host':'tickets.becoreops.com'})
            try:r=urllib.request.urlopen(req,timeout=5)
            except urllib.error.HTTPError as e:r=e
            data=r.read()
            try:v=json.loads(data);v={k:v.get(k) for k in ['service','revision','runtime','active']}
            except ValueError:v={'json':False,'bytes':len(data)}
            print(json.dumps({'port':port,'status':r.status,'health':v}))
           except Exception as e:print(json.dumps({'port':port,'errorType':type(e).__name__}))
          p=subprocess.run(['ss','-ltnp','sport = :3119'],capture_output=True,text=True,check=True)
          print(json.dumps({'ticketsPortListener':p.stdout.strip()}))
          p=subprocess.run(['journalctl','--namespace=becore-tickets','-u','becore-tickets.service','--since','2026-09-29 13:25:00','-o','json','--no-pager'],capture_output=True,text=True,check=True)
          for line in p.stdout.splitlines():
           try:r=json.loads(line);m=r.get('MESSAGE','')
           except ValueError:continue
           if isinstance(m,str) and m.startswith('{'):
            try:j=json.loads(m)
            except ValueError:continue
            if j.get('service')=='becore-tickets':print(json.dumps({'startup':j}))
          PY
