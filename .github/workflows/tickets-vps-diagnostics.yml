name: Repair Tickets offline static route
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main-only operator context
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Restore canonical offline-pass route on active Tickets origin
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import json,pathlib,subprocess,fcntl,urllib.request,hashlib
          lock=open('/run/lock/becore-tickets-deploy.lock','a')
          fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
          root=pathlib.Path('/var/lib/becore-tickets-handover')
          record=json.loads((root/'live-transfer.json').read_text())
          assert record['phase']=='active' and record['revision']=='8a46eeaae8296ab588104ea2406f5287c08e5fb6'
          path=pathlib.Path('/etc/caddy/becore-tickets-origin.caddy')
          previous=path.read_text()
          assert previous.startswith('tickets.becoreops.com {\n')
          assert previous.count(' reverse_proxy 127.0.0.1:3119 {')==1
          assert '@blocked not remote_ip' in previous
          assert ' rewrite /offline-ticket /offline-ticket.html\n' not in previous
          backup=root/'origin-before-offline-route.caddy'
          assert not backup.exists()
          backup.write_text(previous);backup.chmod(0o600)
          candidate=previous.replace(' reverse_proxy 127.0.0.1:3119 {',' rewrite /offline-ticket /offline-ticket.html\n reverse_proxy 127.0.0.1:3119 {')
          try:
           path.write_text(candidate);path.chmod(0o644)
           subprocess.run(['caddy','validate','--config','/etc/caddy/Caddyfile'],capture_output=True,check=True)
           subprocess.run(['systemctl','reload','caddy'],capture_output=True,check=True)
           def request(route):
            req=urllib.request.Request('https://tickets.becoreops.com'+route,headers={'User-Agent':'Mozilla/5.0 (compatible; BeCoreTicketsHealth/1.0)','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=15) as response:
             assert response.status==200
             return response.read()
           canonical=request('/offline-ticket');literal=request('/offline-ticket.html')
           assert canonical==literal and b'Offline door pass' in canonical
           health=json.loads(request('/healthz'))
           assert health.get('runtime')=='vps' and health.get('active') is True and health.get('revision')==record['revision']
           print(json.dumps({'offlineCanonicalRouteVerified':True,'sameSavedPassDocument':True,'documentSha256':hashlib.sha256(canonical).hexdigest(),'runtime':'vps','active':True,'revision':record['revision'],'applicationRestarted':False}))
          except Exception:
           path.write_text(previous)
           subprocess.run(['systemctl','reload','caddy'],capture_output=True,check=True)
           raise RuntimeError('Tickets route verification failed; original origin configuration restored.') from None
          PY
