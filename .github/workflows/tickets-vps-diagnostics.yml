name: Inventory owner-requested Tickets cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Inventory booking dependencies and removable build artifacts
        run: |
          tailscale ssh root@hermes "python3 -" <<'PY'
          import sqlite3,pathlib,subprocess,json,os
          def q(s): return '"'+s.replace('"','""')+'"'
          db=sqlite3.connect('file:/var/lib/becore-tickets/tickets.sqlite?mode=ro',uri=True);db.row_factory=sqlite3.Row
          tables={}
          for (name,) in db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"):
              count=db.execute('SELECT COUNT(*) FROM '+q(name)).fetchone()[0]
              if count: tables[name]={'count':count,'columns':[r[1] for r in db.execute('PRAGMA table_info('+q(name)+')')]}
          report={'tables':tables,'foreignKeys':[]}
          for (name,) in db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"):
              for row in db.execute('PRAGMA foreign_key_list('+q(name)+')'): report['foreignKeys'].append({'table':name,'parent':row[2],'from':row[3],'to':row[4]})
          report['rooms']=[]
          for p in pathlib.Path('/var/lib/becore-tickets/rooms').glob('*.sqlite'):
              rdb=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True)
              report['rooms'].append({'file':p.name,'tables':{n:rdb.execute('SELECT COUNT(*) FROM '+q(n)).fetchone()[0] for (n,) in rdb.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")}})
          report['serviceReleasePaths']={}
          for unit in ['becore-tickets.service','becore-tickets-preview.service']:
              report['serviceReleasePaths'][unit]=subprocess.run(['systemctl','show',unit,'--property=WorkingDirectory','--property=ActiveState'],capture_output=True,text=True).stdout.strip()
          root=pathlib.Path('/srv/becore-tickets')
          report['pointers']={n:str((root/n).resolve()) for n in ['current','previous'] if (root/n).is_symlink()}
          report['releases']=[{'name':p.name,'modified':p.stat().st_mtime,'sizeKiB':int(subprocess.check_output(['du','-sk',str(p)],text=True).split()[0])} for p in (root/'releases').iterdir() if p.is_dir() and not p.is_symlink()]
          report['temporary']=[{'name':p.name,'sizeKiB':int(subprocess.check_output(['du','-sk',str(p)],text=True).split()[0])} for p in pathlib.Path('/var/tmp').glob('tickets-*') if not p.is_symlink()]
          print(json.dumps(report))
          
          PY
