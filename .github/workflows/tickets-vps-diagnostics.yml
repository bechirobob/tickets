name: Remove three explicitly approved Tickets folders
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Remove exactly three approved obsolete folders
        if: github.event_name == 'push' && github.run_attempt == 1 && github.event.head_commit.message == 'Remove three approved Tickets folders 20261001'
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          """One-shot exact three-folder cleanup approved 2026-10-01 19:16 UTC."""
          import os, sys, stat, re, json, time, fcntl, shutil, subprocess, hashlib, urllib.request
          from pathlib import Path
          sys.excepthook = lambda *args: print('Cleanup stopped; detailed private paths suppressed', file=sys.stderr)
          HOME=Path('/srv/becore-tickets'); RELEASES=HOME/'releases'
          ACTIVE='7b9db84ddff94a8b54324241dc855d3ab9ac8a8f'
          PREVIOUS='2c3ce7a9456fbff2ce2054a8a40960f5d9e5e004'
          THIRD='2266b65a282772375da97ccc5ed9942e489a2b7d'
          APPROVED=['a34bd37d8fad68e200239f497c3ae4a2074d45b6','7a090331436541a964752f3d5cfdfffbbc1de823']
          TARGETS=[RELEASES/x for x in APPROVED]+[Path('/var/tmp/tickets-code-release-36804472437-1')]
          EXPECTED=[(2268946,24997,769717088,838791168,20),(2508802,24997,769730893,838881280,20),(259251,3,228622988,228634624,0)]
          END=time.monotonic()+180
          
          def guard():
              if time.monotonic()>END: raise RuntimeError('Time bound exceeded')
          def output(argv):
              guard(); return subprocess.check_output(argv,text=True,stderr=subprocess.DEVNULL,timeout=15)
          def small_json(path):
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  if not stat.S_ISREG(os.fstat(fd).st_mode): raise RuntimeError('Metadata shape')
                  data=os.read(fd,1048577)
                  if len(data)>1048576: raise RuntimeError('Metadata size')
                  return json.loads(data)
              finally: os.close(fd)
          def plain(path):
              s=path.lstat()
              if not stat.S_ISDIR(s.st_mode) or s.st_uid!=0: raise RuntimeError('Directory identity')
              return s
          
          def identity():
              for p in [HOME,RELEASES,Path('/var/tmp')]: plain(p)
              for name,sha in [('current',ACTIVE),('previous',PREVIOUS)]:
                  p=HOME/name
                  if not p.is_symlink() or p.resolve(strict=True)!=RELEASES/sha: raise RuntimeError('Protected pointer drift')
              recent=sorted([p for p in RELEASES.iterdir() if re.fullmatch('[a-f0-9]{40}',p.name) and p.is_dir() and not p.is_symlink()],key=lambda p:p.stat().st_mtime,reverse=True)[:3]
              if [p.name for p in recent]!=[ACTIVE,PREVIOUS,THIRD]: raise RuntimeError('Newest three drift')
              props=dict(x.split('=',1) for x in output(['systemctl','show','becore-tickets.service','--property=ActiveState,WorkingDirectory']).splitlines() if '=' in x)
              if props!={'ActiveState':'active','WorkingDirectory':str(RELEASES/ACTIVE)}: raise RuntimeError('Service drift')
              return {'active':ACTIVE,'previous':PREVIOUS,'third':THIRD}
          def health():
              result={}
              for endpoint in ['health','version']:
                  with urllib.request.urlopen('https://tickets.becoreops.com/api/'+endpoint,timeout=15) as r:
                      if r.status!=200: raise RuntimeError('Health failed')
                      data=json.loads(r.read(1048576)); result[endpoint]=data
              if result['version'].get('revision')!=ACTIVE or result['version'].get('service')!='becore-tickets': raise RuntimeError('Live revision drift')
              return {'health_status':200,'version_status':200,'revision':ACTIVE}
          def tree(path):
              root=plain(path); count=logical=allocated=links=0; rows=[]; stack=[path]
              with open('/proc/self/mountinfo') as mounts:
                  for line in mounts:
                      mount=line.split()[4]
                      mount=re.sub(r'\\([0-7]{3})',lambda m:chr(int(m.group(1),8)),mount)
                      if mount==str(path) or mount.startswith(str(path)+'/'): raise RuntimeError('Mounted target subtree')
              while stack:
                  guard(); current=stack.pop()
                  with os.scandir(current) as entries:
                      for entry in entries:
                          s=entry.stat(follow_symlinks=False)
                          if s.st_dev!=root.st_dev or s.st_uid!=0: raise RuntimeError('Ownership or mount drift')
                          rel=os.path.relpath(entry.path,path)
                          row=[rel,s.st_ino,s.st_mode,s.st_size,s.st_mtime_ns,s.st_ctime_ns,s.st_nlink]
                          if stat.S_ISDIR(s.st_mode): stack.append(Path(entry.path))
                          elif stat.S_ISREG(s.st_mode): count+=1; logical+=s.st_size; allocated+=s.st_blocks*512
                          elif stat.S_ISLNK(s.st_mode): links+=1; row.append(os.readlink(entry.path))
                          else: raise RuntimeError('Unexpected special file')
                          rows.append(row)
                          if len(rows)>100000: raise RuntimeError('Entry bound')
              digest=hashlib.sha256(json.dumps(sorted(rows),separators=(',',':')).encode()).hexdigest()
              return (root.st_ino,count,logical,allocated,links),digest
          
          def dependencies():
              journal=small_json(Path('/var/lib/becore-tickets-handover/live-transfer.json'))
              last=journal.get('lastCodeRelease',{})
              fields=[journal.get('revision'),journal.get('activeRevision'),last.get('revision'),last.get('previous')]
              if any(x in APPROVED for x in fields): raise RuntimeError('Journal reference')
              snapshots={}
              for p in Path('/var/lib/becore-tickets-handover').iterdir():
                  if not re.fullmatch('code-release-[1-9][0-9]*-[1-9][0-9]*',p.name): continue
                  plain(p); result=small_json(p/'result.json'); pointers=small_json(p/'pointers.before.json')
                  if not isinstance(result,dict) or not isinstance(pointers,dict): raise RuntimeError('Snapshot shape')
                  if result.get('dataMigration') and (any(x in APPROVED for x in [result.get('source'),result.get('previous')]) or any(str(v) in [str(t) for t in TARGETS] for v in pointers.values())): raise RuntimeError('Migration dependency')
                  snapshots[p.name]=hashlib.sha256(json.dumps([result,pointers],sort_keys=True).encode()).hexdigest()
              units=[x.split()[0] for x in output(['systemctl','list-units','--type=service','--all','--no-legend','--plain','--no-pager']).splitlines() if x.strip()]
              values=output(['systemctl','show','--property=WorkingDirectory','--value','--',*units]).splitlines()
              def match(value): return any(value==str(t) or value.startswith(str(t)+'/') for t in TARGETS)
              if any(match(v) for v in values): raise RuntimeError('Service dependency')
              races=0
              for p in Path('/proc').iterdir():
                  if not p.name.isdigit(): continue
                  guard()
                  try: descriptors=list((p/'fd').iterdir())
                  except FileNotFoundError: races+=1; continue
                  for ref in [p/'cwd',p/'exe',*descriptors]:
                      try:
                          if match(os.readlink(ref)): raise RuntimeError('Open process reference')
                      except FileNotFoundError: races+=1
                  try:
                      with open(p/'maps') as stream: data=stream.read(4194305)
                      if len(data)>4194304: raise RuntimeError('Process bound')
                      if any(str(t)+'/' in data for t in TARGETS): raise RuntimeError('Process mapping')
                  except FileNotFoundError: races+=1
              return snapshots,races
          
          if os.geteuid()!=0 or not shutil.rmtree.avoids_symlink_attacks: raise RuntimeError('Execution contract')
          fd=os.open('/run/lock/becore-tickets-deploy.lock',os.O_RDONLY|os.O_NOFOLLOW)
          if not stat.S_ISREG(os.fstat(fd).st_mode): raise RuntimeError('Lock shape')
          fcntl.flock(fd,fcntl.LOCK_EX|fcntl.LOCK_NB)
          protected=identity(); health_before=health()
          initial=[tree(p) for p in TARGETS]
          if [x[0] for x in initial]!=EXPECTED: raise RuntimeError('Approved content metadata changed')
          for sha in APPROVED:
              manifest=small_json(RELEASES/sha/'release.json')
              if manifest.get('revision')!=sha or manifest.get('dirty') is not False: raise RuntimeError('Manifest mismatch')
          expected_stage={'runtime.tar.gz':(270198,228551403),'code-release.py':(270231,69829),'provenance.json':(270225,1756)}
          if set(os.listdir(TARGETS[2]))!=set(expected_stage): raise RuntimeError('Stage contents changed')
          for name,pair in expected_stage.items():
              s=(TARGETS[2]/name).lstat()
              if (s.st_ino,s.st_size)!=pair or stat.S_IMODE(s.st_mode)!=0o600 or s.st_nlink!=1: raise RuntimeError('Stage file changed')
          snapshots,races=dependencies()
          if identity()!=protected or [tree(p) for p in TARGETS]!=initial: raise RuntimeError('Pre-delete drift')
          before=shutil.disk_usage(HOME).free
          print(json.dumps({'phase':'validated','exact_targets':[str(p) for p in TARGETS],'free_bytes_before':before,'protected':protected,'process_transient_missing_entries':races}),flush=True)
          for index,p in enumerate(TARGETS):
              guard()
              if identity()!=protected or tree(p)!=initial[index]: raise RuntimeError('Immediate pre-delete drift')
              parent_fd=os.open(p.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
              try:
                  target_stat=os.stat(p.name,dir_fd=parent_fd,follow_symlinks=False)
                  if not stat.S_ISDIR(target_stat.st_mode) or target_stat.st_ino!=EXPECTED[index][0] or target_stat.st_uid!=0: raise RuntimeError('Anchored target identity drift')
                  shutil.rmtree(p.name,dir_fd=parent_fd)
              finally: os.close(parent_fd)
              if p.exists() or p.is_symlink(): raise RuntimeError('Target remains')
              print(json.dumps({'phase':'removed','path':str(p)}),flush=True)
          os.sync()
          if identity()!=protected: raise RuntimeError('Post-delete identity drift')
          after=shutil.disk_usage(HOME).free
          health_after=health()
          # Historical metadata is preserved byte-for-byte semantically; never rewritten.
          for name,digest in snapshots.items():
              p=Path('/var/lib/becore-tickets-handover')/name
              actual=hashlib.sha256(json.dumps([small_json(p/'result.json'),small_json(p/'pointers.before.json')],sort_keys=True).encode()).hexdigest()
              if actual!=digest: raise RuntimeError('Snapshot metadata drift')
          print(json.dumps({'phase':'complete','removed_paths':[str(p) for p in TARGETS],'free_bytes_before':before,'free_bytes_after':after,'observed_free_bytes_increase':after-before,'protected':protected,'health_before':health_before,'health_after':health_after,'historical_snapshot_metadata_preserved':True,'snapshot_prunes':0}),flush=True)
          PY
