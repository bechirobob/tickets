name: Verify approved Tickets storage cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Remove exact owner-approved failed-release upload batch once
        if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'Approved cleanup 20260930 two failed Tickets uploads')
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          """Delete only the six owner-approved failed-release staging files, with drift guards."""
          import datetime
          import fcntl
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import urllib.request
          
          HOME = pathlib.Path('/srv/becore-tickets')
          ACTIVE = '51f414132da8c41e6d6583fdfa76e709ae7516e8'
          PREVIOUS = '8a25812f1a0fc81e4ff4f956542097b4465e050f'
          ARCHIVE_DIGEST = '00addc9b1daa764bd64b582beb54617e7ba2d93f52d24afe53b4a2b44aceaf9f'
          APPROVED = {
              '/var/tmp/tickets-code-release-36730822498-1': {'inode': 254719, 'operatorBlob': '9de9be40366b1c3660dc9622d8ba3119ad06f2eb', 'files': {'code-release.py': (270231, 35685), 'provenance.json': (270225, 1622), 'runtime.tar.gz': (270198, 228439754)}},
              '/var/tmp/tickets-code-release-36734407816-1': {'inode': 270232, 'operatorBlob': '8b57c088157bdd808f4b4556f04cd4144bde72f8', 'files': {'code-release.py': (270237, 36635), 'provenance.json': (270236, 1622), 'runtime.tar.gz': (270234, 228439754)}},
          }
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def health():
              request = urllib.request.Request('https://tickets.becoreops.com/healthz', headers={'User-Agent': 'Mozilla/5.0 BeCoreApprovedStorageCleanup'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.loads(response.read(65536))
                  require(response.status == 200 and value.get('active') is True and value.get('revision') == ACTIVE, 'Live health or revision changed')
              return {'status': 200, 'revision': ACTIVE, 'active': True}
          
          
          def verify_runtime():
              for pointer, revision in [('current', ACTIVE), ('previous', PREVIOUS)]:
                  link = HOME / pointer
                  require(link.is_symlink() and str(link.resolve(strict=True)) == str(HOME / 'releases' / revision), 'Protected release pointer changed')
              props = subprocess.check_output(['systemctl', 'show', 'becore-tickets.service', '--property=ActiveState,WorkingDirectory', '--no-pager'], text=True)
              values = dict(line.split('=', 1) for line in props.splitlines() if '=' in line)
              require(values.get('ActiveState') == 'active' and values.get('WorkingDirectory') == str(HOME / 'releases' / ACTIVE), 'Active service identity changed')
              return health()
          
          
          def references():
              found = []
              errors = []
              approved_inodes = {(2049, item['inode']) for item in APPROVED.values()}
              approved_inodes.update((2049, inode) for item in APPROVED.values() for inode, size in item['files'].values())
              for proc in pathlib.Path('/proc').iterdir():
                  if not proc.name.isdigit():
                      continue
                  targets = []
                  try:
                      pointers = [proc / name for name in ['cwd', 'root', 'exe']] + list((proc / 'fd').iterdir())
                      for pointer in pointers:
                          try:
                              targets.append(os.readlink(pointer))
                              info = os.stat(pointer)
                              if (info.st_dev, info.st_ino) in approved_inodes:
                                  found.append({'pid': int(proc.name), 'kind': 'inode-reference'})
                          except FileNotFoundError:
                              pass
                      for line in (proc / 'maps').read_text().splitlines():
                          fields = line.split(None, 5)
                          if len(fields) >= 5:
                              major, minor = fields[3].split(':')
                              device = os.makedev(int(major, 16), int(minor, 16))
                              if (device, int(fields[4])) in approved_inodes:
                                  found.append({'pid': int(proc.name), 'kind': 'mapped-inode-reference'})
                          if len(fields) == 6:
                              targets.append(fields[5])
                      for line in (proc / 'mountinfo').read_text().splitlines():
                          fields = line.split()
                          # Both filesystem root and mount target expose bind references.
                          mount_root = fields[3].replace('\\040', ' ')
                          targets.extend([mount_root, fields[4].replace('\\040', ' ')])
                          if mount_root != '/' and any(path.startswith(mount_root.rstrip('/') + '/') for path in APPROVED):
                              found.append({'pid': int(proc.name), 'kind': 'ancestor-bind-mount'})
                  except FileNotFoundError:
                      continue
                  except PermissionError:
                      errors.append(int(proc.name))
                  for path in APPROVED:
                      if any(value == path or value.startswith(path + '/') for value in targets):
                          found.append({'path': path, 'pid': int(proc.name)})
              require(not errors, 'Could not inspect every process namespace')
              require(not found, 'Approved staging acquired a process or mount reference')
          
          
          def validate(path, expected):
              p = pathlib.Path(path)
              info = p.lstat()
              require(stat.S_ISDIR(info.st_mode) and not p.is_symlink() and info.st_uid == 0 and stat.S_IMODE(info.st_mode) == 0o700 and info.st_dev == 2049 and info.st_ino == expected['inode'], 'Staging directory metadata changed')
              require({child.name for child in p.iterdir()} == set(expected['files']), 'Staging directory contents changed')
              allocated = info.st_blocks * 512
              for name, (inode, size) in expected['files'].items():
                  child = p / name
                  cs = child.lstat()
                  require(stat.S_ISREG(cs.st_mode) and cs.st_uid == 0 and stat.S_IMODE(cs.st_mode) == 0o600 and cs.st_nlink == 1 and cs.st_dev == info.st_dev and cs.st_ino == inode and cs.st_size == size, 'Approved file metadata changed')
                  allocated += cs.st_blocks * 512
              with (p / 'runtime.tar.gz').open('rb') as stream:
                  require(hashlib.file_digest(stream, 'sha256').hexdigest() == ARCHIVE_DIGEST, 'Approved archive content changed')
              operator = (p / 'code-release.py').read_bytes()
              require(hashlib.sha1(b'blob ' + str(len(operator)).encode() + b'\0' + operator).hexdigest() == expected['operatorBlob'], 'Approved operator content changed')
              proof = json.loads((p / 'provenance.json').read_text())
              require(proof.get('source') == PREVIOUS and proof.get('archiveSha256') == ARCHIVE_DIGEST and str(proof.get('runtimeRun')) == '36729977021' and str(proof.get('candidateRun')) == '36727098470', 'Approved provenance changed')
              return allocated
          
          
          require(os.geteuid() == 0, 'Existing Tickets root operator required')
          require(datetime.datetime.now(datetime.timezone.utc) < datetime.datetime(2026, 9, 30, 22, 0, tzinfo=datetime.timezone.utc), 'One-time cleanup window expired')
          lock_fd = os.open('/run/lock/becore-tickets-deploy.lock', os.O_RDWR | os.O_NOFOLLOW)
          with os.fdopen(lock_fd, 'a') as lock:
              require(stat.S_ISREG(os.fstat(lock.fileno()).st_mode), 'Deployment lock must be regular')
              fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              before_health = verify_runtime()
              before = os.statvfs('/')
              allocated = sum(validate(path, expected) for path, expected in APPROVED.items())
              references()
              # Validate the complete approved batch before removing the first file.
              for path, expected in APPROVED.items():
                  validate(path, expected)
              removed = []
              for path, expected in APPROVED.items():
                  fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  try:
                      opened = os.fstat(fd)
                      require(stat.S_ISDIR(opened.st_mode) and opened.st_ino == expected['inode'] and opened.st_dev == 2049 and opened.st_uid == 0 and stat.S_IMODE(opened.st_mode) == 0o700, 'Directory changed at removal')
                      for name, (inode, size) in expected['files'].items():
                          current = os.stat(name, dir_fd=fd, follow_symlinks=False)
                          require(stat.S_ISREG(current.st_mode) and current.st_ino == inode and current.st_size == size and current.st_nlink == 1 and current.st_dev == opened.st_dev and current.st_uid == 0 and stat.S_IMODE(current.st_mode) == 0o600, 'File changed at removal')
                          os.unlink(name, dir_fd=fd)
                          removed.append(path + '/' + name)
                          print(json.dumps({'removedApprovedFile': path + '/' + name}), flush=True)
                      os.fsync(fd)
                  finally:
                      os.close(fd)
                  require(os.lstat(path).st_ino == expected['inode'], 'Directory replaced after file removal')
                  os.rmdir(path)
              require(all(not os.path.lexists(path) for path in APPROVED), 'Approved stage remains')
              after = os.statvfs('/')
              after_health = verify_runtime()
              print(json.dumps({'approvedFoldersRemoved': list(APPROVED), 'removedFileCount': len(removed), 'allocatedBytesRemoved': allocated,
                                'beforeAvailableBytes': before.f_bavail * before.f_frsize, 'afterAvailableBytes': after.f_bavail * after.f_frsize,
                                'freeSpaceDeltaBytes': after.f_bavail * after.f_frsize - before.f_bavail * before.f_frsize,
                                'beforeHealth': before_health, 'afterHealth': after_health, 'protectedPrevious': PREVIOUS}, sort_keys=True))
          PY
      - name: Classify home and Docker storage without changes
        if: always()
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          """Read-only storage classification. No user-file contents or Docker environments."""
          import datetime
          import json
          import os
          import pathlib
          import subprocess
          
          
          def run(args, timeout=45):
              try:
                  p = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
                  return {"returncode": p.returncode, "stdout": p.stdout.strip(), "stderr": p.stderr.strip()[:300]}
              except (OSError, subprocess.TimeoutExpired) as error:
                  return {"error": type(error).__name__}
          
          
          def emit(section, data):
              print(json.dumps({"readOnly": True, "section": section, "data": data}, sort_keys=True), flush=True)
          
          
          emit("capacity", {"capturedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            "disk": run(["df", "-B1", "/"]), "inodes": run(["df", "-i", "/"])})
          for name in ["/home/ubuntu", "/home/ubuntu/.cache", "/home/ubuntu/.npm", "/home/ubuntu/.pnpm-store",
                       "/home/ubuntu/.local/share/pnpm", "/home/ubuntu/.local/share/Trash", "/root/.cache", "/root/.npm"]:
              path = pathlib.Path(name)
              if path.is_dir() and not path.is_symlink():
                  emit("directory_usage", {"path": name, "usage": run(["du", "-x", "-B1", "--max-depth=1", name])})
          
          # Docker-provided accounting is classification only: reclaimable does not mean
          # authorized to remove. Preserve all volumes and stopped containers by default.
          for section, args in [
              ("docker_summary", ["docker", "system", "df"]),
              ("docker_containers", ["docker", "ps", "-a", "--no-trunc", "--format", "{{json .ID}} {{json .Image}} {{json .Names}} {{json .State}} {{json .Status}}"]),
              ("docker_images", ["docker", "image", "ls", "--no-trunc", "--digests", "--format", "{{json .ID}} {{json .Repository}} {{json .Tag}} {{json .Size}} {{json .CreatedAt}}"]),
              ("docker_dangling_images", ["docker", "image", "ls", "--filter", "dangling=true", "--no-trunc", "--format", "{{json .ID}} {{json .Size}} {{json .CreatedAt}}"]),
              ("docker_volumes_metadata", ["docker", "volume", "ls", "--format", "{{json .Name}} {{json .Driver}} {{json .Scope}}"]),
          ]:
              emit(section, run(args))
          
          # Count current file-descriptor/cwd/executable/mapping references to known cache
          # roots without reading any private file contents or process arguments.
          roots = ["/home/ubuntu/.cache", "/home/ubuntu/.npm", "/home/ubuntu/.pnpm-store", "/home/ubuntu/.local/share/pnpm", "/home/ubuntu/.local/share/Trash", "/root/.cache", "/root/.npm"]
          refs = {root: set() for root in roots}
          errors = 0
          for proc in pathlib.Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              pointers = [proc / name for name in ["cwd", "root", "exe"]]
              try:
                  pointers.extend((proc / "fd").iterdir())
              except FileNotFoundError:
                  continue
              except PermissionError:
                  errors += 1
              targets = []
              for pointer in pointers:
                  try:
                      targets.append(os.readlink(pointer))
                  except FileNotFoundError:
                      pass
                  except PermissionError:
                      errors += 1
              try:
                  for line in (proc / "maps").read_text().splitlines():
                      parts = line.split(None, 5)
                      if len(parts) == 6 and parts[5].startswith("/"):
                          targets.append(parts[5])
              except FileNotFoundError:
                  pass
              except PermissionError:
                  errors += 1
              for root in roots:
                  if any(target == root or target.startswith(root + "/") for target in targets):
                      refs[root].add(int(proc.name))
          emit("known_cache_process_references", {"pidsByPath": {key: sorted(value) for key, value in refs.items()},
                                                "permissionErrors": errors,
                                                "coverage": "Current processes only. An empty result does not prove data is disposable or outside future service dependencies."})
          emit("service_metadata", run(["systemctl", "show", "becore-tickets.service", "bubblewash-local.service", "caddy.service", "--no-pager", "--property=Id,ActiveState,SubState,WorkingDirectory,MainPID,NRestarts"]))
          emit("complete", {"readOnlyClassificationCompleted": True})
          PY
