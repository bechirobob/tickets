name: Inspect Tickets production startup
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main-only operator context
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read only Tickets startup classifications and file metadata
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import json, pathlib, subprocess, re, stat
          unit='becore-tickets.service'
          p=subprocess.run(['systemctl','show',unit,'--property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,User,Group,WorkingDirectory','--no-pager'],capture_output=True,text=True,check=True)
          print(json.dumps({'service':dict(line.split('=',1) for line in p.stdout.splitlines() if '=' in line)}))
          patterns=['Runtime configuration must be a private regular file','Invalid private runtime configuration','Private route readiness check failed','Private route readiness check timed out','ENOENT','EACCES','SQLITE','no such table','no such column','Source writer is paused','ERR_MODULE_NOT_FOUND','Failed to set up credentials','Failed at step CREDENTIALS','Failed at step EXEC','permission denied','Permission denied','address already in use','EADDRINUSE','Missing credentials','Invalid release identity','ERR_SQLITE_ERROR']
          for namespace in [None,'becore-tickets']:
           args=['journalctl','-u',unit,'--since','2026-09-29 12:53:00','--until','2026-09-29 12:57:00','-o','json','--no-pager']
           if namespace:args+=['--namespace='+namespace]
           p=subprocess.run(args,capture_output=True,text=True,check=True)
           found=[]
           for line in p.stdout.splitlines():
            try:row=json.loads(line)
            except ValueError:continue
            message=row.get('MESSAGE','')
            if not isinstance(message,str):continue
            hits=[x for x in patterns if x in message]
            frames=re.findall(r'file:///srv/becore-tickets/releases/[a-f0-9]{40}/[^\\s:]+:\\d+:\\d+',message)
            if hits or frames:found.append({'time':row.get('__REALTIME_TIMESTAMP'),'categories':hits,'frames':frames})
           print(json.dumps({'namespace':namespace,'startupEvidence':found,'journalRows':len(p.stdout.splitlines())}))
          config=pathlib.Path('/etc/becore-tickets/runtime.json');metadata=config.lstat();values=json.loads(config.read_text())
          print(json.dumps({'configRegular':stat.S_ISREG(metadata.st_mode),'configMode':oct(stat.S_IMODE(metadata.st_mode)),'allConfigValuesStrings':all(isinstance(v,str) for v in values.values()),'productionEnvironment':values.get('ENVIRONMENT')=='production','staffDecoyPresent':bool(values.get('STAFF_LOGIN_DECOY_SECRET'))}))
          PY
      - name: Inspect systemd credential metadata without printing its contents
        run: |
          tailscale ssh root@hermes "systemd-run --wait --pipe --collect --unit=becore-tickets-credential-inspect --property=User=becore-tickets --property=LoadCredential=runtime.json:/etc/becore-tickets/runtime.json /usr/bin/python3 -c 'import os,pathlib,stat,json; d=pathlib.Path(os.environ[\"CREDENTIALS_DIRECTORY\"]); p=d/\"runtime.json\"; s=p.lstat(); t=d.lstat(); print(json.dumps({\"fileMode\":oct(stat.S_IMODE(s.st_mode)),\"regular\":stat.S_ISREG(s.st_mode),\"fileUid\":s.st_uid,\"fileGid\":s.st_gid,\"processUid\":os.getuid(),\"directoryMode\":oct(stat.S_IMODE(t.st_mode)),\"directoryUid\":t.st_uid,\"directoryGid\":t.st_gid}))'"
