name: Reconcile historical Tickets alerts without payment mutations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Inspect host resources and Tickets state without mutations
        run: |
          tailscale ssh root@hermes "python3 -" <<'PY'
          import sqlite3,json,datetime,urllib.request,urllib.error,urllib.parse,re
          db=sqlite3.connect('file:/var/lib/becore-tickets/tickets.sqlite?mode=ro',uri=True);db.row_factory=sqlite3.Row;db.execute('PRAGMA query_only=ON')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          report={'paymentHistory':[dict(r) for r in db.execute('SELECT status,payment_provider,payment_environment,COUNT(*) AS count,SUM(total_amount_minor) AS totalMinor FROM orders GROUP BY status,payment_provider,payment_environment')],'expiredFlashes':db.execute("SELECT COUNT(*) FROM room_flashes WHERE status!='deleted' AND expires_at<=?",(now,)).fetchone()[0],'announcementRecipients':[dict(r) for r in db.execute('SELECT status,COUNT(*) AS count FROM event_announcement_recipients GROUP BY status')]}
          report['seevHistory']=[]
          for row in db.execute("SELECT o.status,o.created_at,o.provider_reference,o.total_amount_minor,o.currency,o.payment_environment,s.last_error,s.checked_at FROM orders o JOIN seev_checkout_sessions s ON s.order_id=o.id WHERE o.payment_provider='seevplus'"):
              x={'status':row['status'],'createdAt':row['created_at'],'environment':row['payment_environment'],'hasProviderReference':bool(row['provider_reference']),'lastError':row['last_error'],'lastChecked':row['checked_at']}
              ref=row['provider_reference']
              if ref and re.fullmatch(r'PAY-[A-Za-z0-9-]{1,160}',ref):
                  try:
                      request=urllib.request.Request('https://api.seevplus.com/api/v1/developer/payments/'+urllib.parse.quote(ref,safe=''),headers={'Accept':'application/json','User-Agent':'BeCoreTicketsReadOnlyAudit/1.0'})
                      with urllib.request.urlopen(request,timeout=20) as response: payload=json.load(response)
                      data=payload.get('data') or {}
                      x['providerReadOnlyCheck']={'success':payload.get('success'),'status':data.get('status'),'referenceMatches':data.get('reference')==ref,'amountMatches':data.get('amount')==row['total_amount_minor'],'currencyMatches':data.get('currency')==row['currency'],'environmentMatches':data.get('env',row['payment_environment'])==row['payment_environment']}
                  except urllib.error.HTTPError as e: x['providerReadOnlyCheck']={'httpStatus':e.code}
                  except Exception as e: x['providerReadOnlyCheck']={'errorType':type(e).__name__}
              report['seevHistory'].append(x)
          print(json.dumps(report))
          
          PY
