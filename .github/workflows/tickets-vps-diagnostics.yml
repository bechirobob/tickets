name: Verify and repair Tickets private credential startup
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Verify frozen-copy startup with private credential copy before installing scoped unit configuration
        run: |
          tailscale ssh root@hermes "PROBE_RUN='$GITHUB_RUN_ID' python3 -" <<'PY'
          import subprocess,json
          p=subprocess.run(['journalctl','-u','becore-tickets-startup-probe.service','--since','2026-09-29 13:08:00','-o','json','--no-pager'],capture_output=True,text=True,check=True)
          patterns=['install:','/usr/bin/install','Failed','failed','status=','ExecStartPre','credential','Permission','No such','Read-only']
          for line in p.stdout.splitlines():
           try:r=json.loads(line)
           except ValueError:continue
           m=r.get('MESSAGE','')
           if isinstance(m,str) and any(k in m for k in patterns):print(json.dumps({'time':r.get('__REALTIME_TIMESTAMP'),'setupMessage':m[:1200]}))
          PY
