name: Restore event after successful owner scanner test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Restore original event state and verify
        run: |
          tailscale ssh root@hermes "python3 -" <<'PY'
          import subprocess,sqlite3,json,pathlib
          root=pathlib.Path('/var/lib/becore-tickets-handover/entry-test-36595703020')
          subprocess.run(['/usr/bin/python3',str(root/'restore.py')],check=True)
          old=json.loads((root/'state.json').read_text())['previous']
          db=sqlite3.connect('file:/var/lib/becore-tickets/tickets.sqlite?mode=ro',uri=True)
          row=db.execute('SELECT schedule_status,event_state FROM curated_event_records WHERE slug=?',(old['slug'],)).fetchone()
          assert row==(old['schedule_status'],old['event_state']), 'Event changed separately; inspect before overwriting'
          subprocess.run(['systemctl','stop','becore-tickets-entry-test-36595703020.timer'],check=True)
          print(json.dumps({'event':old['slug'],'schedule':row[0],'state':row[1],'restored':True,'checkinsPreserved':True}))
          PY
