name: Verify live integrations and align Tickets release pointers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tickets-vps-diagnostics.yml']
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Inspect remaining alerts and align release retention with active service
        run: |
          tailscale ssh root@hermes "python3 -" <<'PY'
          import sqlite3,json,pathlib,subprocess,datetime,time,os,urllib.request,urllib.error,fcntl,re
          def cmd(args): return subprocess.check_output(args,text=True,timeout=30).strip()
          def scrub(x):
              s=re.sub(r'[\w.+-]+@[\w.-]+','[email]',str(x or ''))
              s=re.sub(r'https?://\S+','[url]',s)
              s=re.sub(r'[A-Za-z0-9_/-]{40,}','[long-value]',s)
              return s[:500]
          report={}
          db=sqlite3.connect('file:/var/lib/becore-tickets/tickets.sqlite?mode=ro',uri=True)
          db.row_factory=sqlite3.Row;db.execute('PRAGMA query_only=ON')
          report['openAlerts']=[{k:scrub(v) if k in ['message','detail'] else v for k,v in dict(row).items()} for row in db.execute("SELECT id,source,severity,message,detail,created_at FROM system_alerts WHERE status='open' ORDER BY created_at DESC")]
          report['failedEmailFollowup']=[dict(r) for r in db.execute("SELECT f.kind,f.created_at,EXISTS(SELECT 1 FROM delivery_events d WHERE d.recipient=f.recipient AND d.kind=f.kind AND d.status='delivered' AND d.created_at>f.created_at) AS laterSameKindDelivered FROM delivery_events f WHERE f.status='failed'")]
          pid=cmd(['systemctl','show','becore-tickets.service','--property=MainPID','--value'])
          processenv=dict(x.split('=',1) for x in pathlib.Path('/proc/'+pid+'/environ').read_text().split('\0') if '=' in x)
          config=json.loads(pathlib.Path(processenv.get('TICKETS_CONFIG','/etc/becore-tickets/runtime.json')).read_text())
          report['integrationReadiness']={'seevEnabled':config.get('SEEV_ENABLED'),'seevEnvironment':config.get('SEEV_ENVIRONMENT'),'seevCheckoutConfigured':bool(config.get('SEEV_CHECKOUT_API_KEY')),'seevWebhookConfigured':bool(config.get('SEEV_WEBHOOK_SECRET')),'paystackConfigured':bool(config.get('PAYSTACK_SECRET_KEY')),'paystackLiveKey':config.get('PAYSTACK_SECRET_KEY','').startswith('sk_live_'),'resendConfigured':bool(config.get('RESEND_API_KEY'))}
          def swap():
              v=dict(line.split() for line in pathlib.Path('/proc/vmstat').read_text().splitlines())
              return {k:int(v[k]) for k in ['pswpin','pswpout']}
          first=swap();time.sleep(2);second=swap()
          report['swapPagesOverTwoSeconds']={k:second[k]-first[k] for k in first}
          report['memoryPressure']=pathlib.Path('/proc/pressure/memory').read_text().strip()
          root=pathlib.Path('/srv/becore-tickets')
          release=pathlib.Path(cmd(['systemctl','show','becore-tickets.service','--property=WorkingDirectory','--value']))
          assert release==root/'releases/181bfc6801a4fc4c993dc0220af99bb3509e433d'
          lock=open('/run/lock/becore-tickets-deploy.lock','a');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
          old=root/'releases/8a46eeaae8296ab588104ea2406f5287c08e5fb6'
          assert old.is_dir() and (root/'current').is_symlink() and (root/'current').resolve()==old
          for name,target in [('previous',old),('current',release)]:
              pointer=root/name
              assert not pointer.exists() or pointer.is_symlink()
              temp=root/(name+'.audit.tmp')
              assert not temp.exists() and not temp.is_symlink()
              temp.symlink_to(target);os.replace(temp,pointer)
          report['releasePointers']={n:str((root/n).resolve()) for n in ['current','previous']}
          report['retainedReleaseCount']=len([p for p in (root/'releases').iterdir() if p.is_dir()])
          report['publicChecks']=[]
          for path,expected in [('/healthz',200),('/',200),('/events',200),('/my-nights',200),('/scan',200),('/api/public/events',200),('/api/admin/events',401),('/api/admin/check-in?eventSlug=sun-chasers-labadi',401)]:
              start=time.monotonic()
              request=urllib.request.Request('https://tickets.becoreops.com'+path,headers={'User-Agent':'Mozilla/5.0 BeCoreHealthCheck'})
              try: response=urllib.request.urlopen(request,timeout=20)
              except urllib.error.HTTPError as e: response=e
              with response:
                  body=response.read()
                  status=response.status
                  check={'path':path,'status':status,'expected':expected,'milliseconds':round((time.monotonic()-start)*1000)}
                  if path=='/':
                      check['securityHeaders']={k:bool(response.headers.get(k)) for k in ['Content-Security-Policy','Strict-Transport-Security','X-Content-Type-Options','Permissions-Policy']}
                  if path=='/healthz': check['health']=json.loads(body)
                  report['publicChecks'].append(check)
          print(json.dumps(report))
          
          PY
