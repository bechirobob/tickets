name: Verify approved historical delivery cleanup read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/tickets-vps-diagnostics.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Verify approved historical delivery cleanup 20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Verify exact removal and public health without changing records
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PYVERIFY'
          """Read-only verification of the exact owner-approved four-record removal."""
          import fcntl,hashlib,json,os,pwd,sqlite3,stat,subprocess,sys,time,urllib.request
          from pathlib import Path
          ACTIVE='473bbf40afe1a77a722c8399f91c4dd95f3e40ce';RUN='36937809865'
          TARGET_HASHES=['2368e1c63e3dcccea923fd66947dc070a85d8bd1902ad7b7cadaf87025c3a262', '57bca64a209b041e9dbd2b15120bdf2ec931f9b4abec88a4d2c9287d95007238', '99567a0617c2b5c06dfa9100d31bbd585a0121cf6c1dcff064dedc300e18af15', 'd3d0825042e43f9f455a938a053bc77d81969027ddf364e47120ee3b483774df']
          def read_json(path,owner):
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  s=os.fstat(fd);assert stat.S_ISREG(s.st_mode) and s.st_uid==owner and stat.S_IMODE(s.st_mode)==0o600 and s.st_size<65536
                  return json.loads(os.read(fd,65536))
              finally:os.close(fd)
          def main():
              assert os.geteuid()==0
              lock=os.open('/run/lock/becore-tickets-deploy.lock',os.O_RDONLY|os.O_NOFOLLOW);fcntl.flock(lock,fcntl.LOCK_SH|fcntl.LOCK_NB)
              props=dict(line.split('=',1) for line in subprocess.check_output(['systemctl','show','becore-tickets.service','--property=ActiveState,WorkingDirectory'],text=True,stderr=subprocess.DEVNULL,timeout=10).splitlines())
              assert props=={'ActiveState':'active','WorkingDirectory':'/srv/becore-tickets/releases/'+ACTIVE}
              account=pwd.getpwnam('becore-tickets')
              result=read_json(Path('/var/lib/becore-tickets-handover')/('approved-delivery-removal-'+RUN)/'database/result.json',account.pw_uid)
              assert result['phase']=='verified' and result['deleted_records']==4 and result['target_id_hashes']==TARGET_HASHES
              assert result['other_delivery_rows_unchanged'] and result['other_table_counts_unchanged'] and result['resends']==0
              db=sqlite3.connect('file:/var/lib/becore-tickets/tickets.sqlite?mode=ro',uri=True,timeout=5)
              end=time.monotonic()+20;db.set_progress_handler(lambda:int(time.monotonic()>end),1000)
              try:
                  db.execute('PRAGMA query_only=ON');db.execute('BEGIN')
                  ids=db.execute('SELECT id FROM delivery_events ORDER BY id LIMIT 1001').fetchall();assert len(ids)<=1000
                  assert not any(hashlib.sha256(row[0].encode()).hexdigest() in TARGET_HASHES for row in ids)
                  assert db.execute('PRAGMA quick_check').fetchall()==[('ok',)] and db.execute('PRAGMA foreign_key_check').fetchall()==[]
                  counts={s:db.execute('SELECT count(*) FROM delivery_events WHERE status=?',(s,)).fetchone()[0] for s in ('failed','delivered','queued','sent','suppressed','bounced','complained','delayed')}
                  counts['total']=len(ids)
                  assert db.total_changes==0
              finally:db.close()
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*_):raise RuntimeError('Unexpected health redirect')
              req=urllib.request.Request('https://tickets.becoreops.com/healthz',headers={'Cache-Control':'no-cache','User-Agent':'BeCoreTicketsReadOnlyVerification/1.0'})
              with urllib.request.build_opener(NoRedirect()).open(req,timeout=15) as response:
                  health=json.loads(response.read(65536));assert response.status==200 and health.get('revision')==ACTIVE and health.get('active') is True
              print(json.dumps({'read_only':True,'deleted_target_hashes_absent':True,'verified_deleted_records':4,'remaining_delivery_counts':counts,'other_history_unchanged_at_transaction':True,'quick_check_ok':True,'foreign_key_violations':0,'public_health_status':200,'active_revision':ACTIVE,'resends':0,'new_deletions':0},sort_keys=True))
          if __name__=='__main__':
              try:main()
              except Exception:print('Read-only cleanup verification stopped; private details suppressed.',file=sys.stderr);sys.exit(1)
          PYVERIFY
