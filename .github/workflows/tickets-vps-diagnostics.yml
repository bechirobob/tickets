name: Verify and repair Tickets private credential startup
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Verify frozen-copy startup with private credential copy before installing scoped unit configuration
        run: |
          tailscale ssh root@hermes "PROBE_RUN='$GITHUB_RUN_ID' python3 -" <<'PY'
          import subprocess,json,pathlib,stat,shlex
          unit='becore-tickets.service'
          result=subprocess.run(['systemctl','show',unit,'--property=ActiveState,SubState,Result,ExecMainStatus,Environment,ExecStartPre,RuntimeDirectory,ReadWritePaths','--no-pager'],capture_output=True,text=True,check=True)
          for line in result.stdout.splitlines():
           if line.startswith('Environment='):
            fields=[x for x in shlex.split(line.split('=',1)[1]) if x.split('=',1)[0] in ['TICKETS_CONFIG','TICKETS_STATE','TICKETS_ACTIVE','TICKETS_HOST','TICKETS_PORT']]
            print(json.dumps({'effectiveEnvironment':fields}))
           else:print(json.dumps({'unitProperty':line}))
          p=pathlib.Path('/etc/systemd/system/becore-tickets.service.d/private-configuration.conf')
          print(json.dumps({'dropinExists':p.exists(),'dropinLines':len(p.read_text().splitlines()) if p.exists() else 0}))
          patterns=['install:','/usr/bin/install','Runtime configuration','Invalid private','Private route','Error:','EACCES','ENOENT','SQLITE','Failed','failed','No such','Read-only']
          for namespace in [None,'becore-tickets']:
           cmd=['journalctl','-u',unit,'--since','2026-09-29 13:25:00','-o','json','--no-pager']
           if namespace:cmd+=['--namespace='+namespace]
           result=subprocess.run(cmd,capture_output=True,text=True,check=True)
           for line in result.stdout.splitlines():
            try:r=json.loads(line)
            except ValueError:continue
            m=r.get('MESSAGE','')
            if isinstance(m,str) and any(k in m for k in patterns) and len(m)<1500:print(json.dumps({'namespace':namespace,'time':r.get('__REALTIME_TIMESTAMP'),'startupMessage':m}))
          r=json.loads(pathlib.Path('/var/lib/becore-tickets-handover/live-transfer.json').read_text())
          print(json.dumps({k:r.get(k) for k in ['phase','transferId','revision','stage','capturedAt']}))
          PY
