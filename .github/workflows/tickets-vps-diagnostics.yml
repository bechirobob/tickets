name: Fingerprint four approved historical delivery failures read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/tickets-vps-diagnostics.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'Fingerprint four approved historical delivery failures 20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read exact opaque target fingerprints without personal content
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PYREAD'
          """Read-only exact target fingerprinting for the four user-approved historical failures."""
          import datetime,fcntl,hashlib,json,os,sqlite3,stat,subprocess,sys,time
          from pathlib import Path
          ACTIVE='473bbf40afe1a77a722c8399f91c4dd95f3e40ce'
          REASON='Transactional email is not configured.'
          def digest(value):
              raw=json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()
              assert len(raw)<1048576
              return hashlib.sha256(raw).hexdigest()
          def check(row):
              assert isinstance(row['id'],str) and 0<len(row['id'])<=512
              assert row['status']=='failed' and row['kind']=='operational_alert' and row['failure_reason']==REASON
              assert row['attempt_count']==1 and row['next_attempt_at'] is None
              assert row['order_id'] is None and row['recovery_grant_id'] is None
              assert row['created_at']==row['updated_at'] and row['created_at']<='2026-09-15T22:25:41.010Z'
              assert row['created_at']>='2026-08-13T07:15:35.880Z'
              datetime.datetime.fromisoformat(row['created_at'].replace('Z','+00:00'))
          def main():
              assert os.geteuid()==0
              lock=os.open('/run/lock/becore-tickets-deploy.lock',os.O_RDONLY|os.O_NOFOLLOW);fcntl.flock(lock,fcntl.LOCK_SH|fcntl.LOCK_NB)
              props=dict(line.split('=',1) for line in subprocess.check_output(['systemctl','show','becore-tickets.service','--property=ActiveState,WorkingDirectory'],text=True,stderr=subprocess.DEVNULL,timeout=10).splitlines())
              assert props=={'ActiveState':'active','WorkingDirectory':'/srv/becore-tickets/releases/'+ACTIVE}
              path=Path('/var/lib/becore-tickets/tickets.sqlite');s=path.lstat();assert stat.S_ISREG(s.st_mode) and stat.S_IMODE(s.st_mode)==0o600 and s.st_nlink==1
              db=sqlite3.connect(path.as_uri()+'?mode=ro',uri=True,timeout=5);db.row_factory=sqlite3.Row
              end=time.monotonic()+20;db.set_progress_handler(lambda:int(time.monotonic()>end),1000)
              try:
                  db.execute('PRAGMA query_only=ON');db.execute('BEGIN')
                  rows=[dict(r) for r in db.execute("SELECT * FROM delivery_events WHERE status='failed' ORDER BY id LIMIT 5")]
                  assert len(rows)==4
                  targets=[]
                  for row in rows:
                      check(row)
                      targets.append({'id_sha256':hashlib.sha256(row['id'].encode()).hexdigest(),'row_sha256':digest(row),'created_at':row['created_at'],'updated_at':row['updated_at'],'attempt_count':row['attempt_count']})
                  assert min(r['created_at'] for r in rows)=='2026-08-13T07:15:35.880Z' and max(r['created_at'] for r in rows)=='2026-09-15T22:25:41.010Z'
                  assert db.total_changes==0
                  print(json.dumps({'read_only':True,'active_revision':ACTIVE,'target_count':4,'target_fingerprints':targets,'recipient_values_exported':False,'payloads_exported':False,'deletions':0},sort_keys=True))
              finally:db.close()
          if __name__=='__main__':
              try:main()
              except Exception:print('Target fingerprinting stopped; private details suppressed.',file=sys.stderr);sys.exit(1)
          PYREAD
