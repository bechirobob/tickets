name: Exact live WebKit navigation verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/diag/host-navigation-live-webkit-20261102'
    runs-on: ubuntu-latest
    # Each job installs only its selected engine. Keep enough headroom for
    # WebKit system dependencies and evidence upload on a slow mirror.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: mobile-webkit
            engine: webkit
    steps:
      # Candidate verification tests the full PR tree against its isolated build.
      # This separate audit must use the tests belonging to the actual live build.
      - name: Resolve and verify the active production revision
        id: deployed
        env:
          ACTIVATED_SHA: '32b5956549cb3eff04e2abbcfda177bccb07b0f8'
          ACTIVATION_REQUIRED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bechirobob/tickets
          mkdir -p "$RUNNER_TEMP/production-browser-audit"
          cat > "$RUNNER_TEMP/production-browser-audit/verify-deployment.sh" <<'SH'
          set -euo pipefail
          phase="${1:?Missing verification phase}"
          [[ "$phase" =~ ^(resolved|before|after)$ ]]
          metadata="$RUNNER_TEMP/production-browser-audit"
          status="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 20 --max-filesize 65536 \
            -H 'Cache-Control: no-cache' -H 'Accept: application/json' \
            --write-out '%{http_code}' --output "$metadata/health-$phase.json" https://tickets.becoreops.com/healthz)"
          test "$status" = 200
          status="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 20 --max-filesize 65536 \
            -H 'Cache-Control: no-cache' -H 'Accept: application/json' \
            --write-out '%{http_code}' --output "$metadata/version-$phase.json" https://tickets.becoreops.com/api/version)"
          test "$status" = 200
          PHASE="$phase" python3 - <<'PYVERIFY'
          import datetime, json, os, pathlib, re
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "production-browser-audit"
          phase = os.environ["PHASE"]
          health = json.loads((directory / f"health-{phase}.json").read_text())
          version = json.loads((directory / f"version-{phase}.json").read_text())
          if not isinstance(health, dict) or not isinstance(version, dict):
              raise SystemExit("Production identity responses must be objects")
          revision = version.get("revision")
          if version.get("service") != "becore-tickets" or health.get("service") != "becore-tickets":
              raise SystemExit("Production service identity does not match Tickets")
          if health.get("runtime") != "vps" or health.get("active") is not True:
              raise SystemExit("Production must be served by the active Tickets VPS")
          if not isinstance(revision, str) or re.fullmatch(r"[a-f0-9]{40}", revision) is None:
              raise SystemExit("Production revision must be an exact full commit SHA")
          if health.get("revision") != revision:
              raise SystemExit("Health and application revisions do not match")
          activated = os.environ.get("ACTIVATED_SHA", "")
          if (os.environ.get("ACTIVATION_REQUIRED") == "true" or activated) and (re.fullmatch(r"[a-f0-9]{40}", activated) is None or revision != activated):
              raise SystemExit("Production does not match the exact activated source")
          expected = os.environ.get("DEPLOYED_SHA")
          if phase != "resolved" and (not expected or revision != expected):
              raise SystemExit("Production changed during the audit; rerun against the new revision")
          evidence = {"service": "becore-tickets", "runtime": "vps", "active": True,
                      "revision": revision, "phase": phase,
                      "verifiedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (directory / f"baseline-{phase}.json").write_text(json.dumps(evidence, indent=2) + "\n")
          if phase == "resolved":
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"revision={revision}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Production browser audit ({phase}): becore-tickets / active VPS / {revision}\n\n")
          PYVERIFY
          SH
          bash "$RUNNER_TEMP/production-browser-audit/verify-deployment.sh" resolved
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bechirobob/tickets
          ref: ${{ steps.deployed.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify deployed source belongs to this repository main history
        id: source
        shell: bash
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REPOSITORY" = bechirobob/tickets
          origin="$(git remote get-url origin)"
          [[ "$origin" = https://github.com/bechirobob/tickets || "$origin" = https://github.com/bechirobob/tickets.git ]]
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          git merge-base --is-ancestor "$DEPLOYED_SHA" refs/remotes/origin/main
          printf '%s\n' "$DEPLOYED_SHA" > "$RUNNER_TEMP/production-browser-audit/checked-out-revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/production-browser-audit/checked-out-tree.txt"
      - name: Apply only the reviewed test synchronization overlay
        shell: bash
        run: |
          set -euo pipefail
          base=32b5956549cb3eff04e2abbcfda177bccb07b0f8
          correction=479aba1b23625b21ee93de3fc6d063ad748764fe
          file=tests/e2e/host-brand-identity.spec.ts
          test "$(git rev-parse HEAD)" = "$base"
          test "$(git diff --name-only "$base" "$correction")" = "$file"
          git merge-base --is-ancestor "$base" "$correction"
          git show "$correction:$file" > "$file"
          test "$(git hash-object "$file")" = "$(git rev-parse "$correction:$file")"
          test "$(git diff --name-only)" = "$file"
          git diff --check
          git diff > "$RUNNER_TEMP/production-browser-audit/test-overlay.patch"
          printf '{"liveSource":"%s","testCorrection":"%s","file":"%s","testBlob":"%s","productionModified":false}\n' "$base" "$correction" "$file" "$(git hash-object "$file")" > "$RUNNER_TEMP/production-browser-audit/test-overlay.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Install real-browser engines
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Confirm production still matches the audited source
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.revision }}
        run: bash "$RUNNER_TEMP/production-browser-audit/verify-deployment.sh" before
      - name: Verify complete host journey including destination render and downstream assertions
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: focused-results.json
        run: npm run test:e2e:production -- tests/e2e/host-brand-identity.spec.ts --project mobile-webkit --workers=1 --retries=0 --trace=on --reporter=line,json --output=focused-test-results
      - name: Verify full production WebKit suite without retries
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: full-webkit-results.json
        run: npm run test:e2e:production -- --project mobile-webkit --workers=1 --retries=0 --reporter=line,json
      - name: Confirm production stayed on the audited source
        if: ${{ always() && steps.source.outcome == 'success' }}
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.revision }}
        run: bash "$RUNNER_TEMP/production-browser-audit/verify-deployment.sh" after
      - name: Package bounded original verification evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PYPACK'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path.cwd(); selected={}
          for folder in ('focused-test-results','test-results'):
              for p in sorted((root/folder).rglob('*')):
                  if not p.is_file() or p.is_symlink():continue
                  if folder=='focused-test-results' or 'host-brand-identity' in str(p) or p.name in ('trace.zip','error-context.md','test-failed-1.png'):
                      selected[str(p.relative_to(root))]=p.read_bytes()
          for name in ('focused-results.json','full-webkit-results.json'):
              if (root/name).is_file():selected[name]=(root/name).read_bytes()
          metadata=pathlib.Path(os.environ['RUNNER_TEMP'])/'production-browser-audit'
          for p in sorted(metadata.glob('*')):
              if p.is_file() and p.suffix in ('.json','.txt','.patch'):selected['identity/'+p.name]=p.read_bytes()
          assert selected
          budget=20*1024*1024;groups=[];group={};size=0;index=[]
          for name,data in selected.items():
              assert len(data)<=budget, 'Single evidence file exceeds bounded part'
              if group and size+len(data)>budget:groups.append(group);group={};size=0
              group[name]=data;size+=len(data)
          if group:groups.append(group)
          assert len(groups)<=8
          for i,g in enumerate(groups,1):
              index.extend({'path':n,'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest(),'part':i} for n,d in g.items())
          manifest=json.dumps({'liveSource':'32b5956549cb3eff04e2abbcfda177bccb07b0f8','testCorrection':'479aba1b23625b21ee93de3fc6d063ad748764fe','workflowSource':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'files':index},sort_keys=True,indent=2).encode()
          for i,g in enumerate(groups,1):
              directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'bounded-host-audit'/f'part-{i:02}';directory.mkdir(parents=True)
              archive=directory/'evidence.zip'
              with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_STORED) as z:
                  z.writestr('EVIDENCE-INDEX.json',manifest)
                  for name,data in g.items():z.writestr(name,data)
              assert archive.stat().st_size < 24*1024*1024-65536
              (directory/'SHA256SUMS').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  evidence.zip\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'parts={len(groups)}\n')
          print(json.dumps({'parts':len(groups),'files':len(index),'indexSha256':hashlib.sha256(manifest).hexdigest()}))
          PYPACK
      - if: always() && steps.evidence.outputs.parts >= 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-01
          path: ${{ runner.temp }}/bounded-host-audit/part-01/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-02
          path: ${{ runner.temp }}/bounded-host-audit/part-02/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-03
          path: ${{ runner.temp }}/bounded-host-audit/part-03/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-04
          path: ${{ runner.temp }}/bounded-host-audit/part-04/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-05
          path: ${{ runner.temp }}/bounded-host-audit/part-05/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-06
          path: ${{ runner.temp }}/bounded-host-audit/part-06/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 7
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-07
          path: ${{ runner.temp }}/bounded-host-audit/part-07/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.evidence.outputs.parts >= 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-webkit-navigation-${{ github.run_id }}-part-08
          path: ${{ runner.temp }}/bounded-host-audit/part-08/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
