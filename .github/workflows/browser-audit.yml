name: Production browser audit

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install real-browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Audit production in desktop Chrome, mobile Chrome and mobile WebKit
        run: npm run test:e2e:production
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-audit-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
