name: Yorke Way signup previews

on:
  pull_request:
    branches: [main]
    paths:
      - app/the-yorke-way/**
      - lib/yorkeway-early-access.ts
      - lib/customer-email.ts
      - public/hosts/the-yorke-way*
      - scripts/yorkeway-previews.mjs
      - .github/workflows/yorkeway-previews.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorkeway-previews-${{ github.ref }}
  cancel-in-progress: true

# Visual review only. No credentials, real contacts, email sends or deployment.
jobs:
  preview:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001 --shm-size=1g
    timeout-minutes: 15
    env:
      PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify prepared rendering browser
        run: node scripts/verify-browser-environment.mjs chromium
      - name: Render synthetic page and welcome email without provider traffic
        run: node scripts/yorkeway-previews.mjs
      - name: Retain visual review screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yorkeway-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            outputs/yorkeway-previews/*.png
            outputs/yorkeway-previews/report.json
            outputs/yorkeway-previews/preview-error.txt
          if-no-files-found: error
          retention-days: 3
