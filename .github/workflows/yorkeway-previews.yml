name: Yorke Way signup previews

on:
  pull_request:
    branches: [main]
    paths:
      - app/the-yorke-way/**
      - lib/yorkeway-early-access.ts
      - lib/customer-email.ts
      - public/hosts/the-yorke-way*
      - scripts/yorkeway-previews.mjs
      - .github/workflows/yorkeway-previews.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorkeway-previews-${{ github.ref }}
  cancel-in-progress: true

# Visual review only. No credentials, real contacts, email sends or deployment.
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Install isolated rendering browser
        # Standard Ubuntu runner already supplies Chromium runtime libraries.
        # Avoid optional international-font apt downloads in this English-only preview.
        run: npx playwright install chromium --only-shell
      - name: Render synthetic page and welcome email without provider traffic
        run: node scripts/yorkeway-previews.mjs
      - name: Retain visual review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yorkeway-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            outputs/yorkeway-previews/*.png
            outputs/yorkeway-previews/report.json
            outputs/yorkeway-previews/preview-error.txt
          if-no-files-found: error
          retention-days: 3
