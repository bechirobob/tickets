name: Release verified Tickets VPS code

# Explicit activation only. Changing this file never deploys or runs diagnostics.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Verified application SHA on main with successful VPS and equivalent-tree browser CI
        required: true
        type: string
      runtime_run:
        description: Successful Verify Tickets VPS runtime run ID on main
        required: true
        type: string
      candidate_run:
        description: Successful three-browser Candidate verification run ID
        required: true
        type: string
      expected_active:
        description: Exact SHA currently serving active VPS traffic
        required: true
        type: string
      inspect_failed_release:
        description: Read only the hard-pinned failed release 36804472437-1 metadata; never deploy
        required: false
        default: false
        type: boolean
      recover_prepared:
        description: Optional exact failed run-attempt whose prepared empty candidate must be quarantined after byte-for-byte state checks
        required: false
        default: ''
        type: string
      enable_crypto:
        description: Enable requested USDC checkout after owner-confirmed merchant wallet setup (no payment test)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && !inputs.inspect_failed_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPERATOR_SHA: ${{ github.sha }}
      EXPECTED_ACTIVE: ${{ inputs.expected_active }}
      RUNTIME_RUN: ${{ inputs.runtime_run }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      RECOVER_PREPARED: ${{ inputs.recover_prepared }}
      ENABLE_CRYPTO: ${{ inputs.enable_crypto && 'true' || 'false' }}
    steps:
      - name: Require main and exact bounded release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_ACTIVE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUNTIME_RUN" =~ ^[1-9][0-9]*$ && "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$RECOVER_PREPARED" || "$RECOVER_PREPARED" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unmerged source before executing checkout code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_ACTIVE" "$SOURCE_SHA"
      - name: Stage reviewed main operator without changing the verified application tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPERATOR_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$OPERATOR_SHA"
          git merge-base --is-ancestor "$OPERATOR_SHA" origin/main
          python3 - <<'PYOP'
          import os,subprocess
          allowed={'.github/workflows/tickets-code-release.yml','.github/workflows/tickets-release-operator-checks.yml','ops/vps/code-release.py','ops/vps/test_code_release.py'}
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['OPERATOR_SHA']],text=True).splitlines()
          if not set(changed)<=allowed: raise SystemExit('Operator revision includes application changes; require fresh application CI/artifact.')
          PYOP
          operator="$RUNNER_TEMP/tickets-operator"
          mkdir -m 700 "$operator"
          git archive "$OPERATOR_SHA" ops/vps .github/workflows/tickets-code-release.yml | tar -x -C "$operator"
          printf 'Application artifact: %s\nReviewed operator: %s\n' "$SOURCE_SHA" "$OPERATOR_SHA"
      - name: Verify updater regression suite
        run: python3 -m unittest discover -s "$RUNNER_TEMP/tickets-operator/ops/vps" -p 'test_*.py'
      - name: Verify exact CI runs, source tree, ancestry and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/tickets-code-release"
          mkdir -m 700 "$metadata"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN" > "$metadata/runtime.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$metadata/candidate.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN/jobs?per_page=100" | jq -s '[.[].jobs[]]' > "$metadata/runtime-jobs.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs?per_page=100" | jq -s '[.[].jobs[]]' > "$metadata/candidate-jobs.json"
          candidate_sha=$(jq -r '.head_sha' "$metadata/candidate.json")
          [[ "$candidate_sha" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$candidate_sha"
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name "tickets-vps-$SOURCE_SHA" --dir "$metadata/artifact"
          python3 "$RUNNER_TEMP/tickets-operator/ops/vps/code-release.py" verify-ci \
            --source "$SOURCE_SHA" --expected "$EXPECTED_ACTIVE" --repository "$GITHUB_REPOSITORY" \
            --runtime-run "$RUNTIME_RUN" --candidate-run "$CANDIDATE_RUN" --metadata "$metadata" \
            --archive "$metadata/artifact/tickets-vps-runtime.tar.gz" --output "$metadata/provenance.json"
      - name: Connect existing dedicated Tickets identity
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Inspect loaded credential binding metadata without reading secret values
        run: |
          tailscale ssh root@hermes "systemctl show becore-tickets.service --no-pager --property=NeedDaemonReload --property=WorkingDirectory --property=ActiveState && busctl --system --timeout=10 --no-pager --json=short get-property org.freedesktop.systemd1 /org/freedesktop/systemd1/unit/becore_2dtickets_2eservice org.freedesktop.systemd1.Service LoadCredential"
      - name: Apply reversible Tickets-only code transaction
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/tickets-code-release"
          stage="/var/tmp/tickets-code-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          digest=$(sha256sum "$metadata/artifact/tickets-vps-runtime.tar.gz" | cut -d ' ' -f 1)
          proof_digest=$(sha256sum "$metadata/provenance.json" | cut -d ' ' -f 1)
          script_digest=$(sha256sum "$RUNNER_TEMP/tickets-operator/ops/vps/code-release.py" | cut -d ' ' -f 1)
          # Exclusive staging prevents blind retry over an earlier uncertain run.
          tailscale ssh root@hermes "umask 077; mkdir '$stage'"
          tailscale ssh root@hermes "umask 077; cat > '$stage/runtime.tar.gz'" < "$metadata/artifact/tickets-vps-runtime.tar.gz"
          tailscale ssh root@hermes "umask 077; cat > '$stage/provenance.json'" < "$metadata/provenance.json"
          tailscale ssh root@hermes "umask 077; cat > '$stage/code-release.py'" < "$RUNNER_TEMP/tickets-operator/ops/vps/code-release.py"
          tailscale ssh root@hermes "test \"\$(sha256sum '$stage/code-release.py' | cut -d ' ' -f 1)\" = '$script_digest' && python3 '$stage/code-release.py' apply --source '$SOURCE_SHA' --expected '$EXPECTED_ACTIVE' --run-id '$GITHUB_RUN_ID' --attempt '$GITHUB_RUN_ATTEMPT' --archive '$stage/runtime.tar.gz' --provenance '$stage/provenance.json' --archive-digest '$digest' --provenance-digest '$proof_digest' --enable-crypto '$ENABLE_CRYPTO' --recover-prepared '$RECOVER_PREPARED'"
          # Only this successful run's three staged files are removed. Private
          # rollback snapshots and prior releases remain untouched on the host.
          tailscale ssh root@hermes "rm -- '$stage/runtime.tar.gz' '$stage/provenance.json' '$stage/code-release.py' && rmdir -- '$stage'"

  inspect_failure:
    # This branch is mutually exclusive with release; no application checkout or apply.
    if: github.ref == 'refs/heads/main' && inputs.inspect_failed_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_ACTIVE: ${{ inputs.expected_active }}
      RUNTIME_RUN: ${{ inputs.runtime_run }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      RECOVER_PREPARED: ${{ inputs.recover_prepared }}
      ENABLE_CRYPTO: ${{ inputs.enable_crypto && 'true' || 'false' }}
    steps:
      - name: Require exact read-only diagnostic context and failed release pins
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$SOURCE_SHA" = ee95b9b43fb99dd0ca9431cf9be4d000cd65abbe
          test "$EXPECTED_ACTIVE" = 45ec44e35f8b0e5099a328ce219df2529374f9ee
          test "$RUNTIME_RUN" = 36804016094
          test "$CANDIDATE_RUN" = 36801064451
          test -z "$RECOVER_PREPARED"
          test "$ENABLE_CRYPTO" = false
      - name: Connect existing dedicated Tickets identity for read-only inspection
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read failed release metadata without customer rows or secret values
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes 'python3 -' <<'PYDIAG'
          """Read-only, non-secret metadata for the single failed Tickets release."""
          import fcntl
          import hashlib
          import json
          import os
          from pathlib import Path
          import pwd
          import re
          import sqlite3
          import time
          import stat
          import subprocess

          RUN = "36804472437-1"
          HOME = Path("/srv/becore-tickets")
          STATE = Path("/var/lib/becore-tickets")
          SNAPSHOT = Path("/var/lib/becore-tickets-handover") / ("code-release-" + RUN)
          SOURCE = "ee95b9b43fb99dd0ca9431cf9be4d000cd65abbe"
          BACKUP_SCHEMA_DIGEST = "9a6151e7e2ec13eded37237d0083002c4a0f0f09570ac74e5e0e92d9e484dc9f"
          # Exact sqlite_schema fingerprints generated locally from writerGuardStatements(['hosts']).
          KNOWN_HOST_GUARDS = {
              "_bct_guard_hosts_delete": "444b3676092af1ff98b1385bf801469f846cd7453f8b8fb4cda2b45bdc3c9a11",
              "_bct_guard_hosts_insert": "d1735171feb3d6a70de76224d2ad2c8417ce5a64e03e271a406fefba695c4571",
              "_bct_guard_hosts_update": "993741626e1e5f828e1dd1c681fed62e180645e837e0bcf95fa709bdbd7285ce",
          }
          CONTROL_SCHEMA_DIGEST = "612caa86b3f0bf636dab09beb9c9bdd8b3fa042cc7ed5917dce0fef9c849f591"
          SHA = re.compile(r"[a-f0-9]{40}\Z")
          DIGEST = re.compile(r"[a-f0-9]{64}\Z")
          SAFE_REASONS = {
              "Live database must remain a private service-owned regular file.",
              "Unsafe live database sidecar.",
              "Host verification migration differs from the exact reviewed source.",
              "The exact host correction must be the only migration in its release.",
              "Private database backup timed out.",
              "Insufficient free space for a private migration backup.",
              "Private migration backup failed integrity verification.",
              "Host correction requires the migration transaction.",
              "Host correction requires the existing ordinary hosts table.",
              "Host correction refuses hosts triggers.",
              "Host correction refuses hidden or generated columns.",
              "Host correction columns are missing.",
              "Exact existing Kofi Bills host identity is missing or ambiguous.",
              "Unexpected Kofi Bills verification baseline.",
              "Host correction did not change exactly one row.",
              "Host correction changed the host row count.",
              "Host correction timestamp is unexpected.",
              "Host correction changed unrelated host values or database schema.",
              "An existing database schema changed during additive migration.",
              "Additive migration failed foreign-key verification.",
              "SQLite or filesystem operation failed; inspect the preserved backup.",
          }
          SAFE_ERRORS = {"ReleaseError", "DatabaseError", "OperationalError", "IntegrityError",
                         "ProgrammingError", "PermissionError", "FileNotFoundError", "OSError",
                         "ValueError", "TypeError", "OverflowError", "MemoryError"}


          def metadata(path):
              try:
                  value = path.lstat()
              except FileNotFoundError:
                  return {"exists": False}
              kind = "regular" if stat.S_ISREG(value.st_mode) else "directory" if stat.S_ISDIR(value.st_mode) else "symlink" if stat.S_ISLNK(value.st_mode) else "other"
              return {"exists": True, "kind": kind, "mode": oct(stat.S_IMODE(value.st_mode)),
                      "uid": value.st_uid, "gid": value.st_gid, "bytes": value.st_size,
                      "links": value.st_nlink, "inode": value.st_ino, "device": value.st_dev}


          def read_private(path, uid, limit=65536, digest=False):
              # Never follow symlinks, read arbitrary paths, or output private file bytes.
              if any(parent.is_symlink() for parent in path.parents):
                  raise RuntimeError("Evidence ancestor is a symlink")
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  info = os.fstat(stream.fileno())
                  if not (stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_uid in (0, uid)
                          and stat.S_IMODE(info.st_mode) == 0o600 and info.st_size <= limit):
                      raise RuntimeError("Evidence metadata is unsafe or exceeds its bound")
                  if digest:
                      value = hashlib.sha256()
                      remaining = limit + 1
                      while remaining:
                          chunk = stream.read(min(1048576, remaining))
                          if not chunk:
                              break
                          value.update(chunk)
                          remaining -= len(chunk)
                      if remaining == 0:
                          raise RuntimeError("Evidence exceeded its read bound")
                      return value.hexdigest()
                  raw = stream.read(limit + 1)
                  if len(raw) > limit:
                      raise RuntimeError("Evidence exceeded its read bound")
                  value = json.loads(raw)
                  if not isinstance(value, dict):
                      raise RuntimeError("Evidence is not a JSON object")
                  return value


          def safe_fields(value):
              result = {}
              phase = value.get("phase")
              if phase in {"prepared", "backed-up", "verified", "activating", "rolled-back", "migration-failed", "failed"}:
                  result["phase"] = phase
              for key in ("runId", "attempt"):
                  if isinstance(value.get(key), str) and re.fullmatch(r"[1-9][0-9]*", value[key]):
                      result[key] = value[key]
              for key in ("source", "previous"):
                  if isinstance(value.get(key), str) and SHA.fullmatch(value[key]):
                      result[key] = value[key]
              for key in ("archiveSha256", "provenanceSha256", "backupSha256", "schemaSha256"):
                  if isinstance(value.get(key), str) and DIGEST.fullmatch(value[key]):
                      result[key] = value[key]
              for key in ("dataMigration", "cryptoEnabledRequested", "created", "tablesPreservedOnRollback"):
                  if isinstance(value.get(key), bool):
                      result[key] = value[key]
              if "errorType" in value:
                  result["errorType"] = value["errorType"] if value["errorType"] in SAFE_ERRORS else "unrecognized-redacted"
              if "reason" in value:
                  result["reason"] = value["reason"] if value["reason"] in SAFE_REASONS else "unrecognized-redacted"
              correction = value.get("publicHostCorrection")
              if isinstance(correction, dict):
                  result["hostCorrectionEvidencePresent"] = True
                  if isinstance(correction.get("changed"), bool):
                      result["hostCorrectionChanged"] = correction["changed"]
              return result


          def backup_schema_evidence(uid):
              backup = SNAPSHOT / "database/before.sqlite"
              if read_private(backup, uid, 512 * 1024 * 1024, digest=True) != BACKUP_SCHEMA_DIGEST:
                  raise RuntimeError("Exact failed-run backup fingerprint changed")
              if any(os.path.lexists(str(backup) + suffix) for suffix in ("-wal", "-shm", "-journal")):
                  raise RuntimeError("Immutable backup unexpectedly has sidecars")
              connection = sqlite3.connect(backup.as_uri() + "?mode=ro&immutable=1", uri=True, timeout=3)
              try:
                  def authorize(action, table, column, database, origin):
                      allowed = action == sqlite3.SQLITE_SELECT or (
                          action == sqlite3.SQLITE_READ and database == "main"
                          and table in ("sqlite_master", "hosts", "_bct_handover_state")) or (
                          action == sqlite3.SQLITE_FUNCTION and column == "count")
                      return sqlite3.SQLITE_OK if allowed else sqlite3.SQLITE_DENY
                  connection.set_authorizer(authorize)
                  deadline = time.monotonic() + 5
                  connection.set_progress_handler(lambda: int(time.monotonic() > deadline), 1000)
                  rows = connection.execute("SELECT name,sql FROM sqlite_schema WHERE type='trigger' AND tbl_name='hosts' ORDER BY name").fetchmany(17)
                  if len(rows) > 16 or any(not isinstance(sql, str) or len(sql.encode()) > 8192 for _, sql in rows):
                      raise RuntimeError("Host trigger schema exceeded its evidence bound")
                  triggers = []
                  for name, sql in rows:
                      digest = hashlib.sha256(sql.encode()).hexdigest()
                      expected = KNOWN_HOST_GUARDS.get(name)
                      triggers.append({"name": name if expected else "unrecognized-redacted", "sha256": digest,
                                       "expectedSha256": expected, "matchesKnownGuard": expected == digest})
                  matches = (len(rows) == len(KNOWN_HOST_GUARDS) and {name for name, _ in rows} == set(KNOWN_HOST_GUARDS)
                             and all(value["matchesKnownGuard"] for value in triggers))
                  control = connection.execute("SELECT sql FROM sqlite_schema WHERE type='table' AND name='_bct_handover_state'").fetchmany(2)
                  control_matches = (len(control) == 1 and isinstance(control[0][0], str)
                                     and hashlib.sha256(control[0][0].encode()).hexdigest() == CONTROL_SCHEMA_DIGEST)
                  frozen, control_count = None, None
                  if control_matches:
                      states = connection.execute("SELECT frozen FROM _bct_handover_state WHERE id=1 LIMIT 2").fetchall()
                      control_count = len(states)
                      if len(states) == 1 and states[0][0] in (0, 1):
                          frozen = states[0][0]
                  # Counts only: do not emit host row contents, identity values or personal data.
                  identity = ("host:kofi-bills", "kofi-bills")
                  candidates = connection.execute("SELECT COUNT(*) FROM hosts WHERE id=? OR slug=?", identity).fetchone()[0]
                  exact = connection.execute("SELECT COUNT(*) FROM hosts WHERE id=? AND slug=?", identity).fetchone()[0]
                  reviewed = connection.execute("SELECT COUNT(*) FROM hosts WHERE id=? AND slug=? AND verification_status='reviewed'", identity).fetchone()[0]
                  verified = connection.execute("SELECT COUNT(*) FROM hosts WHERE id=? AND slug=? AND verification_status='verified'", identity).fetchone()[0]
                  return {"backupSha256": BACKUP_SCHEMA_DIGEST, "hostsTriggerCount": len(rows), "triggers": triggers,
                          "allHostsTriggersMatchKnownGuards": matches, "controlSchemaMatches": control_matches,
                          "controlRowCount": control_count, "frozen": frozen,
                          "canonicalIdentityMatchCount": exact, "identityCandidateCount": candidates,
                          "reviewedBaselineCount": reviewed, "verifiedBaselineCount": verified,
                          "canonicalHostReady": candidates == exact == 1 and reviewed + verified == 1}
              finally:
                  connection.close()


          def inspect():
              uid = pwd.getpwnam("becore-tickets").pw_uid
              # Open the existing deployment lock read-only: no file creation or writes.
              fd = os.open("/run/lock/becore-tickets-deploy.lock", os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as lock:
                  if not stat.S_ISREG(os.fstat(lock.fileno()).st_mode):
                      raise RuntimeError("Deployment lock is not regular")
                  fcntl.flock(lock, fcntl.LOCK_SH | fcntl.LOCK_NB)
                  output = {"run": RUN, "serviceUid": uid, "files": {}, "evidence": {}, "pointers": {}}
                  for name in ("current", "previous"):
                      path = HOME / name
                      value = metadata(path)
                      if value.get("kind") == "symlink":
                          target = os.readlink(path)
                          if re.fullmatch(r"/srv/becore-tickets/releases/[a-f0-9]{40}", target):
                              value["target"] = target
                          else:
                              value["target"] = "unexpected-redacted"
                      output["pointers"][name] = value
                  roots = [("snapshot", SNAPSHOT), ("residual-staging", STATE / (".code-release-migration-" + RUN))]
                  for label, root in roots:
                      output["files"][label] = metadata(root)
                      folder = root / "database" if label == "snapshot" else root
                      for leaf in ("result.json", "failure.json", "before.sqlite"):
                          path = folder / leaf
                          key = label + "/database/" + leaf
                          value = metadata(path)
                          output["files"][key] = value
                          if value.get("exists"):
                              try:
                                  if leaf == "before.sqlite":
                                      output["evidence"][key] = {"sha256": read_private(path, uid, 512 * 1024 * 1024, digest=True)}
                                  else:
                                      output["evidence"][key] = safe_fields(read_private(path, uid))
                              except Exception as error:
                                  output["evidence"][key] = {"readErrorType": type(error).__name__}
                  path = SNAPSHOT / "result.json"
                  output["files"]["snapshot/result.json"] = metadata(path)
                  if output["files"]["snapshot/result.json"].get("exists"):
                      try:
                          output["evidence"]["snapshot/result.json"] = safe_fields(read_private(path, uid))
                      except Exception as error:
                          output["evidence"]["snapshot/result.json"] = {"readErrorType": type(error).__name__}
                  for label, path in [("live-state", STATE), ("live-database", STATE / "tickets.sqlite"),
                                      ("live-wal", STATE / "tickets.sqlite-wal"), ("live-shm", STATE / "tickets.sqlite-shm"),
                                      ("candidate", HOME / "releases" / SOURCE),
                                      ("upload-stage", Path("/var/tmp") / ("tickets-code-release-" + RUN))]:
                      output["files"][label] = metadata(path)
                  raw = subprocess.check_output(["systemctl", "show", "becore-tickets.service", "--no-pager",
                      "--property=ActiveState,SubState,WorkingDirectory,NeedDaemonReload"], text=True, timeout=15)
                  values = dict(line.split("=", 1) for line in raw.splitlines() if "=" in line)
                  output["service"] = {key: value for key, value in values.items()
                      if (key in {"ActiveState", "SubState", "NeedDaemonReload"} and re.fullmatch(r"[a-z-]{1,30}", value))
                      or (key == "WorkingDirectory" and re.fullmatch(r"/srv/becore-tickets/releases/[a-f0-9]{40}", value))}
                  try:
                      output["backupSchema"] = backup_schema_evidence(uid)
                  except Exception as error:
                      output["backupSchema"] = {"readErrorType": type(error).__name__}
                  print(json.dumps(output, sort_keys=True))


          if __name__ == "__main__":
              try:
                  inspect()
              except Exception as error:
                  print(json.dumps({"diagnosticStopped": type(error).__name__}))
                  raise SystemExit(1)
          PYDIAG

  retired_preview:
    name: Verify retired checkout preview (${{ matrix.browser }})
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, mobile-chromium, mobile-webkit]
    env:
      E2E_BASE_URL: https://tickets.becoreops.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify only the removed preview page and API
        run: npx playwright test tests/e2e/checkout-preview-retired.spec.ts --project ${{ matrix.browser }} --workers=1 --retries=0
      - name: Preserve preview retirement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkout-preview-retired-${{ github.run_id }}-${{ matrix.browser }}
          path: |
            test-results
            playwright-report
