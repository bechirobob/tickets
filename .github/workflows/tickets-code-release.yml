name: Release verified Tickets VPS code

# Explicit activation only. Changing this file never deploys or runs diagnostics.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Verified application SHA on main with successful VPS and equivalent-tree browser CI
        required: true
        type: string
      runtime_run:
        description: Successful Verify Tickets VPS runtime run ID on main
        required: true
        type: string
      candidate_run:
        description: Successful three-browser Candidate verification run ID
        required: true
        type: string
      expected_active:
        description: Exact SHA currently serving active VPS traffic
        required: true
        type: string
      recover_prepared:
        description: Optional exact failed run-attempt whose prepared empty candidate must be quarantined after byte-for-byte state checks
        required: false
        default: ''
        type: string
      enable_crypto:
        description: Enable requested USDC checkout after owner-confirmed merchant wallet setup (no payment test)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPERATOR_SHA: ${{ github.sha }}
      EXPECTED_ACTIVE: ${{ inputs.expected_active }}
      RUNTIME_RUN: ${{ inputs.runtime_run }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      RECOVER_PREPARED: ${{ inputs.recover_prepared }}
      ENABLE_CRYPTO: ${{ inputs.enable_crypto && 'true' || 'false' }}
    steps:
      - name: Require main and exact bounded release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_ACTIVE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUNTIME_RUN" =~ ^[1-9][0-9]*$ && "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$RECOVER_PREPARED" || "$RECOVER_PREPARED" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unmerged source before executing checkout code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_ACTIVE" "$SOURCE_SHA"
      - name: Stage reviewed main operator without changing the verified application tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPERATOR_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$OPERATOR_SHA"
          git merge-base --is-ancestor "$OPERATOR_SHA" origin/main
          python3 - <<'PYOP'
          import os,subprocess
          allowed={'.github/workflows/tickets-code-release.yml','.github/workflows/tickets-release-operator-checks.yml','ops/vps/code-release.py','ops/vps/test_code_release.py'}
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['OPERATOR_SHA']],text=True).splitlines()
          if not set(changed)<=allowed: raise SystemExit('Operator revision includes application changes; require fresh application CI/artifact.')
          PYOP
          operator="$RUNNER_TEMP/tickets-operator"
          mkdir -m 700 "$operator"
          git archive "$OPERATOR_SHA" ops/vps .github/workflows/tickets-code-release.yml | tar -x -C "$operator"
          printf 'Application artifact: %s\nReviewed operator: %s\n' "$SOURCE_SHA" "$OPERATOR_SHA"
      - name: Verify updater regression suite
        run: python3 -m unittest discover -s "$RUNNER_TEMP/tickets-operator/ops/vps" -p 'test_*.py'
      - name: Verify exact CI runs, source tree, ancestry and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/tickets-code-release"
          mkdir -m 700 "$metadata"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN" > "$metadata/runtime.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$metadata/candidate.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN/jobs?per_page=100" | jq -s '[.[].jobs[]]' > "$metadata/runtime-jobs.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs?per_page=100" | jq -s '[.[].jobs[]]' > "$metadata/candidate-jobs.json"
          candidate_sha=$(jq -r '.head_sha' "$metadata/candidate.json")
          [[ "$candidate_sha" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$candidate_sha"
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name "tickets-vps-$SOURCE_SHA" --dir "$metadata/artifact"
          python3 "$RUNNER_TEMP/tickets-operator/ops/vps/code-release.py" verify-ci \
            --source "$SOURCE_SHA" --expected "$EXPECTED_ACTIVE" --repository "$GITHUB_REPOSITORY" \
            --runtime-run "$RUNTIME_RUN" --candidate-run "$CANDIDATE_RUN" --metadata "$metadata" \
            --archive "$metadata/artifact/tickets-vps-runtime.tar.gz" --output "$metadata/provenance.json"
      - name: Connect existing dedicated Tickets identity
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Inspect loaded credential binding metadata without reading secret values
        run: |
          tailscale ssh root@hermes "systemctl show becore-tickets.service --no-pager --property=NeedDaemonReload --property=WorkingDirectory --property=ActiveState && busctl --system --timeout=10 --no-pager --json=short get-property org.freedesktop.systemd1 /org/freedesktop/systemd1/unit/becore_2dtickets_2eservice org.freedesktop.systemd1.Service LoadCredential"
      - name: Apply reversible Tickets-only code transaction
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/tickets-code-release"
          stage="/var/tmp/tickets-code-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          digest=$(sha256sum "$metadata/artifact/tickets-vps-runtime.tar.gz" | cut -d ' ' -f 1)
          proof_digest=$(sha256sum "$metadata/provenance.json" | cut -d ' ' -f 1)
          script_digest=$(sha256sum "$RUNNER_TEMP/tickets-operator/ops/vps/code-release.py" | cut -d ' ' -f 1)
          # Exclusive staging prevents blind retry over an earlier uncertain run.
          tailscale ssh root@hermes "umask 077; mkdir '$stage'"
          tailscale ssh root@hermes "umask 077; cat > '$stage/runtime.tar.gz'" < "$metadata/artifact/tickets-vps-runtime.tar.gz"
          tailscale ssh root@hermes "umask 077; cat > '$stage/provenance.json'" < "$metadata/provenance.json"
          tailscale ssh root@hermes "umask 077; cat > '$stage/code-release.py'" < "$RUNNER_TEMP/tickets-operator/ops/vps/code-release.py"
          tailscale ssh root@hermes "test \"\$(sha256sum '$stage/code-release.py' | cut -d ' ' -f 1)\" = '$script_digest' && python3 '$stage/code-release.py' apply --source '$SOURCE_SHA' --expected '$EXPECTED_ACTIVE' --run-id '$GITHUB_RUN_ID' --attempt '$GITHUB_RUN_ATTEMPT' --archive '$stage/runtime.tar.gz' --provenance '$stage/provenance.json' --archive-digest '$digest' --provenance-digest '$proof_digest' --enable-crypto '$ENABLE_CRYPTO' --recover-prepared '$RECOVER_PREPARED'"
          # Only this successful run's three staged files are removed. Private
          # rollback snapshots and prior releases remain untouched on the host.
          tailscale ssh root@hermes "rm -- '$stage/runtime.tar.gz' '$stage/provenance.json' '$stage/code-release.py' && rmdir -- '$stage'"

  preview:
    name: Verify live no-charge preview (${{ matrix.browser }})
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, mobile-chromium, mobile-webkit]
    env:
      E2E_BASE_URL: https://tickets.becoreops.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise only the deployed no-charge preview
        run: npx playwright test tests/e2e/checkout-preview.spec.ts --project ${{ matrix.browser }} --workers=1 --retries=0
      - name: Preserve live preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-checkout-preview-${{ github.run_id }}-${{ matrix.browser }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
