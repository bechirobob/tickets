name: Check Tickets drain before scheduled capture
on:
  push:
    branches: [ops/tickets-terminal-observer]
    paths: ['.github/workflows/tickets-drain-status.yml', 'ops/diagnostics/tickets-drain-status.mjs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Verify exact remaining inventory without changing source state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/diagnostics/tickets-drain-status.mjs
