name: Candidate verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BECORE_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx drizzle-kit check
      - name: Validate the deployable Worker without publishing
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run --outdir dist/worker-dry-run
      - name: Install browsers for event-page verification
        run: npx playwright install --with-deps chromium webkit
      - name: Prepare isolated event fixtures
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Verify event pages and compact notifications in one browser session
        run: npx playwright test tests/e2e/event-details.spec.ts tests/e2e/customer-feedback.spec.ts tests/e2e/public-journey.spec.ts tests/e2e/notifications.spec.ts tests/e2e/member-navigation.spec.ts tests/e2e/room-identity.spec.ts tests/e2e/owner-recovery.spec.ts --grep 'poster, event facts|copying a promoter|countdown changes|retired preview|full flyers|event colours|event lettering|sharing has|cancelled native|lean transfer budget|notification|My Nights recovers|the Room keeps|owner recovery'
      - name: Verify optional SeevPlus checkout on desktop and mobile
        run: |
          node scripts/prepare-seev-browser-fixture.mjs
          npx playwright test --config playwright.seev.config.ts
      - name: Preserve event-page renders and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-event-page-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /home/runner/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 14
