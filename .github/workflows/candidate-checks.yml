name: Candidate verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  BECORE_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Core gates plus all three full browser suites now run sequentially.
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact candidate source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          echo "sha=$BECORE_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify bounded audit exception
        run: python3 -m unittest discover -s tests -p 'test_checkbox_hotfix_audit.py' -v
      - name: Audit dependencies
        run: python3 scripts/audit-checkbox-hotfix.py
      - name: Lint application
        run: npm run lint
      - name: Check application types
        run: npm run typecheck
      # npm test includes the production build, deployment preparation, rendered
      # assertions and Worker unit suite. Every browser consumes those same bytes.
      - name: Verify unit tests and rendered production build
        run: npm test
      - name: Check database schema
        run: npx drizzle-kit check
      - name: Validate the deployable Worker without publishing
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run --outdir dist/worker-dry-run
      - name: Package verified browser build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8")); assert.equal(config.vars.RELEASE_SHA, process.env.BECORE_RELEASE_SHA);'
          mkdir -p "$RUNNER_TEMP/candidate-build"
          archive="$RUNNER_TEMP/candidate-build/browser-build.tar.gz"
          # A tarball preserves hidden Vite manifests as well as the exact bytes.
          tar -czf "$archive" dist/client dist/server
          chmod a-w "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Verify candidate evidence transport
        run: python3 -m unittest discover -s ops/vps -p 'test_candidate_evidence.py' -v
      - name: Install browsers for event-page verification
        id: browsers
        run: npx playwright install --with-deps chromium webkit
      # This job never transfers a build through Actions artifacts or caches.
      # Logs retain bounded synthetic-fixture PNG/JSON evidence for review only;
      # they are not a runtime package and never replace any failing test gate.
      - name: Verify and restore the exact candidate build (desktop-chromium)
        id: restore_desktop_chromium
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' }}
        shell: bash
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          BUILD_TREE: ${{ steps.source.outputs.tree }}
          BUILD_DIGEST: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[a-f0-9]{40}$ && "$BUILD_TREE" =~ ^[a-f0-9]{40}$ && "$BUILD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$BUILD_SHA" = "$BECORE_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$BUILD_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          archive="$RUNNER_TEMP/candidate-build/browser-build.tar.gz"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$BUILD_DIGEST"
          # Only disposable checkout state on GitHub-hosted runners is cleared.
          # Earlier selected evidence is already in the job log before this runs.
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PWD" = "$GITHUB_WORKSPACE"
          test -z "${E2E_BASE_URL:-}"
          rm -rf -- dist .wrangler test-results playwright-report
          tar -xzf "$archive"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8")); assert.equal(config.vars.RELEASE_SHA, process.env.BECORE_RELEASE_SHA);'
      - name: Prepare isolated event fixtures (desktop-chromium)
        id: fixtures_desktop_chromium
        if: ${{ !cancelled() && steps.restore_desktop_chromium.outcome == 'success' }}
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Capture natural Room entry before the full browser suite (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test tests/e2e/room-natural-entry.spec.ts --project desktop-chromium --workers=1 --retries=0 --output test-results/room-entry
      - name: Preserve natural Room entry evidence immediately (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: python3 ops/vps/candidate_evidence.py encode --root test-results/room-entry --stage room-entry --source-sha "$BECORE_RELEASE_SHA" --browser desktop-chromium
      - name: Verify every browser journey before release (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test --project desktop-chromium
      - name: Verify keyboard navigation focus without retries (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test tests/e2e/navigation-audit.spec.ts --project desktop-chromium --workers=1 --retries=0 --repeat-each=3 --output test-results/navigation-focus
      - name: Verify optional SeevPlus checkout on desktop and mobile (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: |
          node scripts/prepare-seev-browser-fixture.mjs
          npx playwright test --config playwright.seev.config.ts --project desktop-chromium --output test-results/seevplus
      - name: Verify opt-in USDC checkout without provider traffic (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: |
          node scripts/prepare-seev-browser-fixture.mjs crypto
          npx playwright test --config playwright.seev-crypto.config.ts --project desktop-chromium --output test-results/seevplus-crypto
      - name: Verify RSVP and interest registration on desktop and mobile (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: |
          node scripts/prepare-registration-browser-fixture.mjs
          npx playwright test --config playwright.registration.config.ts --project desktop-chromium --output test-results/registration
      - name: Verify owner Operations workflows on desktop and mobile (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: |
          node scripts/prepare-operations-browser-fixture.mjs
          npx playwright test --config playwright.operations.config.ts --project desktop-chromium --workers=1 --retries=0 --output test-results/operations
      - name: Preserve required Operations visual evidence immediately (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: python3 ops/vps/candidate_evidence.py encode --root test-results/operations --stage operations --source-sha "$BECORE_RELEASE_SHA" --browser desktop-chromium
      - name: Verify host report fixture recovery without retries (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test --config playwright.operations.config.ts --project desktop-chromium --grep 'host lands on their event' --workers=1 --retries=0 --repeat-each=3 --output test-results/host-overview
      - name: Verify and restore the exact candidate build (mobile-chromium)
        id: restore_mobile_chromium
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' }}
        shell: bash
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          BUILD_TREE: ${{ steps.source.outputs.tree }}
          BUILD_DIGEST: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[a-f0-9]{40}$ && "$BUILD_TREE" =~ ^[a-f0-9]{40}$ && "$BUILD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$BUILD_SHA" = "$BECORE_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$BUILD_TREE"
          git diff --exit-code
