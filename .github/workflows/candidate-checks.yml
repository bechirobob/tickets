name: Candidate verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, mobile-chromium, mobile-webkit]
    env:
      BECORE_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx drizzle-kit check
      - name: Validate the deployable Worker without publishing
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run --outdir dist/worker-dry-run
      - name: Install browsers for event-page verification
        run: npx playwright install --with-deps chromium webkit
      - name: Prepare isolated event fixtures
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Verify every browser journey before release
        run: npx playwright test --project ${{ matrix.browser }}
      - name: Verify optional SeevPlus checkout on desktop and mobile
        run: |
          node scripts/prepare-seev-browser-fixture.mjs
          npx playwright test --config playwright.seev.config.ts --project ${{ matrix.browser }} --output test-results/seevplus
      - name: Verify RSVP and interest registration on desktop and mobile
        run: |
          node scripts/prepare-registration-browser-fixture.mjs
          npx playwright test --config playwright.registration.config.ts --project ${{ matrix.browser }} --output test-results/registration
      - name: Verify owner Operations workflows on desktop and mobile
        run: |
          node scripts/prepare-operations-browser-fixture.mjs
          npx playwright test --config playwright.operations.config.ts --project ${{ matrix.browser }} --output test-results/operations
      - name: Preserve event-page renders and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-event-page-${{ github.run_id }}-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            /home/runner/.config/.wrangler/logs
          if-no-files-found: ignore
          retention-days: 14
