          archive="$RUNNER_TEMP/candidate-build/browser-build.tar.gz"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$BUILD_DIGEST"
          # Only disposable checkout state on GitHub-hosted runners is cleared.
          # Earlier selected evidence is already in the job log before this runs.
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$PWD" = "$GITHUB_WORKSPACE"
          test -z "${E2E_BASE_URL:-}"
          rm -rf -- dist .wrangler test-results playwright-report
          tar -xzf "$archive"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8")); assert.equal(config.vars.RELEASE_SHA, process.env.BECORE_RELEASE_SHA);'
      - name: Prepare isolated event fixtures (mobile-chromium)
        id: fixtures_mobile_chromium
