name: Extract exact artwork failure trace read-only
on:
  push:
    branches: [ops/extract-audit-artwork-trace-20261001]
    paths: [.github/workflows/extract-audit-artwork-trace-20261001.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/ops/extract-audit-artwork-trace-20261001' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify and split immutable original image evidence
        id: split
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,io,json,os,pathlib,re,stat,urllib.request,urllib.error,urllib.parse,zipfile,sys
          sys.excepthook=lambda kind,*args: print('Artifact split stopped: '+kind.__name__,file=sys.stderr)
          REPO='bechirobob/tickets'; ID=11194383689; RUN=36926635790
          SHA='b9ba236ef26c569a7171e497c11caaa88ef112ef'; DIGEST='acc7b6079a8e244f0419fcc7c604499520ed1d3785e6c58c2fdcb212b7740f08'
          MAX=64*1024*1024; PART=15*1024*1024
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with opener.open(req,timeout=30) as r:
                  data=r.read(MAX+1);assert len(data)<=MAX;return json.loads(data)
          a=get('actions/artifacts/'+str(ID));w=a['workflow_run']
          assert a['id']==ID and not a['expired'] and a['digest']=='sha256:'+DIGEST and 0<a['size_in_bytes']<=MAX
          assert w['id']==RUN and w['head_sha']==SHA
          run=get('actions/runs/'+str(RUN));assert run['repository']['full_name']==REPO and run['head_sha']==SHA and run['conclusion']=='failure'
          req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/actions/artifacts/'+str(ID)+'/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          try:
              opener.open(req,timeout=30);raise RuntimeError('Expected signed artifact redirect')
          except urllib.error.HTTPError as e:
              assert e.code==302;url=e.headers['Location']
          parsed=urllib.parse.urlsplit(url);assert parsed.scheme=='https' and parsed.hostname and not parsed.username and not parsed.password and parsed.port in (None,443)
          with opener.open(url,timeout=30) as r:
              raw=r.read(MAX+1);assert len(raw)<=MAX
          assert hashlib.sha256(raw).hexdigest()==DIGEST
          root=pathlib.Path('split-output');root.mkdir()
          parts=[];entries=[];part=None;size=0;total=0
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert len(z.infolist())<1000
              for info in sorted(z.infolist(),key=lambda x:x.filename):
                  p=pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(info.external_attr>>16)
                  if info.is_dir() or 'public-artwork-loading' not in info.filename or p.suffix.lower() not in ('.png','.json','.txt','.md','.zip'):continue
                  assert 0<=info.file_size<PART
                  total+=info.file_size;assert total<=256*1024*1024
                  if part is None or size+info.file_size>PART:
                      part=root/('part-'+str(len(parts)+1));part.mkdir();parts.append(part);size=0
                  data=z.read(info);assert len(data)==info.file_size
                  target=part.joinpath(*p.parts);target.parent.mkdir(parents=True,exist_ok=True);assert not target.exists();target.write_bytes(data);size+=len(data)
                  entries.append({'part':part.name,'path':info.filename,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert entries and len(parts)<=20
          manifest={'originalRepository':REPO,'originalArtifact':ID,'originalRun':RUN,'originalSource':SHA,'originalArchiveSha256':DIGEST,'entries':entries,'originalRunConclusion':run['conclusion'],'partialEvidence':True,'renderingRerun':False,'applicationChanged':False}
          for p in parts:(p/'split-provenance.json').write_text(json.dumps(manifest,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('parts='+json.dumps([p.name for p in parts])+'\n')
          print(json.dumps({'verifiedArtifact':ID,'parts':[p.name for p in parts],'files':len(entries),'uncompressedBytes':total,'source':SHA}))
          PYCODE
      - name: Preserve image part 1
        if: contains(fromJSON(steps.split.outputs.parts), 'part-1')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-artwork-trace-11194383689-part-1
          path: split-output/part-1
          if-no-files-found: error
