name: iPhone layout screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/capture-iphone-layouts.mjs
      - .github/workflows/iphone-layouts.yml

permissions:
  contents: read

concurrency:
  group: iphone-layouts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx playwright install --with-deps webkit
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
      - name: Capture every app screen and public browser destination
        env:
          LAYOUT_OUTPUT: ${{ runner.temp }}/becore-iphone-layouts
        run: node scripts/capture-iphone-layouts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: BeCore-Tickets-iPhone-layouts-${{ github.run_id }}
          path: ${{ runner.temp }}/becore-iphone-layouts
          if-no-files-found: error
          retention-days: 30
