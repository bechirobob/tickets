name: iPhone evidence repackaging (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: iphone-evidence-repack-41422336206
  cancel-in-progress: false

jobs:
  repack:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/maintenance/iphone-evidence-parts-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/maintenance
      - name: Verify the fixed original run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/repack_iphone_evidence.py metadata "$RUNNER_TEMP/original-provenance.json"
      - name: Download only the approved existing artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: bechirobob/tickets
          run-id: '41422336206'
          artifact-ids: '13129663703'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-iphone-evidence
          merge-multiple: true
      - name: Verify manifests and preserve every original file in bounded parts
        id: package
        run: python3 scripts/maintenance/repack_iphone_evidence.py package "$RUNNER_TEMP/original-iphone-evidence" "$RUNNER_TEMP/iphone-evidence-parts" "$RUNNER_TEMP/original-provenance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-41422336206-part-01
          path: ${{ runner.temp }}/iphone-evidence-parts/part-01/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: steps.package.outputs.parts >= 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-41422336206-part-02
          path: ${{ runner.temp }}/iphone-evidence-parts/part-02/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: steps.package.outputs.parts >= 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-41422336206-part-03
          path: ${{ runner.temp }}/iphone-evidence-parts/part-03/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - if: steps.package.outputs.parts >= 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-41422336206-part-04
          path: ${{ runner.temp }}/iphone-evidence-parts/part-04/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
