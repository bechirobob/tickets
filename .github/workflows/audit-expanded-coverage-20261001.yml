name: Verify exact-source expanded audit coverage
on:
  push:
    branches: [ops/audit-expanded-coverage-20261001]
    paths: [.github/workflows/audit-expanded-coverage-20261001.yml]
permissions:
  contents: read
  actions: read
jobs:
  expanded:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/ops/audit-expanded-coverage-20261001' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, mobile-chromium, mobile-webkit]
    env:
      BECORE_RELEASE_SHA: 53f5a0615b80f59d1e84a0098061fed4330fb107
      OVERLAY_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 53f5a0615b80f59d1e84a0098061fed4330fb107
          persist-credentials: false
      - name: Verify frozen application identity
        run: |
          test "$(git rev-parse HEAD)" = 53f5a0615b80f59d1e84a0098061fed4330fb107
          test "$(git rev-parse HEAD^{tree})" = 51004be28aeae024e286f50b8ddb8c76690db246
          git diff --exit-code
      - name: Restore immutable core build without rebuilding application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYRESTORE'
          import hashlib,io,json,os,pathlib,stat,sys,tarfile,urllib.request,urllib.error,urllib.parse,zipfile
          sys.excepthook=lambda kind,*args: print('Immutable build restoration stopped: '+kind.__name__,file=sys.stderr)
          REPO='bechirobob/tickets'; ID=11195102960; RUN=36929202481
          SHA='53f5a0615b80f59d1e84a0098061fed4330fb107'; TREE='51004be28aeae024e286f50b8ddb8c76690db246'
          DIGEST='450c0c6fe374b19d8969c69aa268d8b85e820aa9622ee10639f09dd08b18b18c'
          MAX=32*1024*1024
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with opener.open(req,timeout=20) as r:
                  raw=r.read(MAX+1);assert len(raw)<=MAX;return json.loads(raw)
          a=api('actions/artifacts/'+str(ID));w=a['workflow_run']
          assert a['id']==ID and not a['expired'] and a['digest']=='sha256:'+DIGEST
          assert w['id']==RUN and w['head_sha']==SHA
          print('Artifact metadata identity verified.')
          r=api('actions/runs/'+str(RUN));assert r['repository']['full_name']==REPO and r['head_sha']==SHA
          jobs=api('actions/runs/'+str(RUN)+'/jobs?per_page=100');assert jobs['total_count']==len(jobs['jobs'])
          core=[j for j in jobs['jobs'] if j['name']=='core'];assert len(core)==1 and core[0]['conclusion']=='success' and core[0]['head_sha']==SHA
          for step in ('Verify exact candidate source','Verify unit tests and rendered production build','Package verified browser build','Preserve verified browser build'):
              matching=[s for s in core[0]['steps'] if s['name']==step];assert len(matching)==1 and matching[0]['conclusion']=='success'
          print('Exact candidate core steps verified.')
          req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/actions/artifacts/'+str(ID)+'/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          try:opener.open(req,timeout=20);raise RuntimeError('Expected signed download')
          except urllib.error.HTTPError as e:
              assert e.code==302;url=e.headers['Location']
          p=urllib.parse.urlsplit(url);assert p.scheme=='https' and p.hostname and p.port in (None,443) and not p.username and not p.password
          with opener.open(url,timeout=20) as response:
              raw=response.read(MAX+1);assert len(raw)<=MAX
          assert hashlib.sha256(raw).hexdigest()==DIGEST
          print('Immutable ZIP digest verified.')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              matches=[i for i in archive.infolist() if i.filename=='browser-build.tar.gz'];assert len(matches)==1 and matches[0].file_size<=MAX
              build=archive.read(matches[0]);assert len(build)<=MAX
          with tarfile.open(fileobj=io.BytesIO(build),mode='r:gz') as archive:
              entries=archive.getmembers();assert len(entries)<30000 and sum(x.size for x in entries)<256*1024*1024
              for item in entries:
                  p=pathlib.PurePosixPath(item.name)
                  assert not p.is_absolute() and '..' not in p.parts and len(p.parts)>=2 and p.parts[0]=='dist' and p.parts[1] in ('server','client')
                  assert item.isfile() or item.isdir()
              archive.extractall('.',filter='data')
          config=json.loads(pathlib.Path('dist/server/wrangler.json').read_text());assert config['vars']['RELEASE_SHA']==SHA
          pathlib.Path('overlay-evidence').mkdir()
          pathlib.Path('overlay-evidence/provenance.json').write_text(json.dumps({'applicationSource':SHA,'applicationTree':TREE,'candidateRun':RUN,'buildArtifact':ID,'buildArchiveZipSha256':DIGEST,'buildTarSha256':hashlib.sha256(build).hexdigest(),'coreConclusion':'success','applicationRebuilt':False,'productionDataTouched':False},indent=2))
          print('Verified and restored exact53f5 immutable candidate build; no application rebuild.')
          PYRESTORE
      - name: Apply independently identified test-only coverage overlay
        run: |
          python3 - <<'PYOVERLAY'
          import base64,hashlib,json,os,pathlib,subprocess
          raw=base64.b64decode('')
          expected='01b7e01c3a3c517d53c9cdd47455d8e9879041bb3e642d9b8ff6f2b4f3e7ebf5'
          assert hashlib.sha256(raw).hexdigest()==expected
          allowed={'playwright.audit-expanded.config.ts','tests/e2e/audit-expanded-overlay.spec.ts'}
          headers={line[6:] for line in raw.decode().splitlines() if line.startswith('+++ b/')}
          assert headers==allowed and all(not pathlib.Path(p).exists() for p in allowed)
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          manifest=pathlib.Path('overlay-evidence/provenance.json')
          value=json.loads(manifest.read_text());value.update(overlayPatchSha256=expected,overlayWorkflowSha=os.environ['OVERLAY_WORKFLOW_SHA'],overlayFiles={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(allowed)})
          manifest.write_text(json.dumps(value,indent=2))
          pathlib.Path('overlay-evidence/test-only.patch').write_bytes(raw)
          print('Only two new test/config files added; tracked application source unchanged.')
          PYOVERLAY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - name: Install requested engine
        run: npx playwright install --with-deps ${{ matrix.browser == 'mobile-webkit' && 'webkit' || 'chromium' }}
      - name: Prepare local-only synthetic owner and RSVP fixtures
        run: |
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
          node scripts/prepare-registration-browser-fixture.mjs
          node scripts/prepare-operations-browser-fixture.mjs
      - name: Verify every requested expanded state and natural keyboard activation
        run: npx playwright test --config playwright.audit-expanded.config.ts --project ${{ matrix.browser }} --workers=1 --retries=0 --output=test-results/expanded-overlay
      - name: Verify tracked application source remained frozen
        if: always()
        run: git diff --exit-code
      - name: Preserve source, test identity, every view, axe results and first failure trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-audit-${{ github.run_id }}-${{ matrix.browser }}
          path: |
            overlay-evidence
            test-results/expanded-overlay
            playwright-report
          if-no-files-found: error
          retention-days: 30
