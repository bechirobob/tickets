  aggregate:
    if: always()
    needs: [producer, retained_a, retained_b, retry_target]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require complete isolated transport results
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps({'release_authorized': False, 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'needs': results}, sort_keys=True))
          assert set(results) == {'producer', 'retained_a', 'retained_b', 'retry_target'}
          assert all(value['result'] == 'success' for value in results.values())
