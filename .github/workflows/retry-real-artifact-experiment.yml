    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
      BUILD_ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
      BUILD_ARCHIVE_DIGEST: ${{ needs.producer.outputs.archive_digest }}
      BUILD_MANIFEST_DIGEST: ${{ needs.producer.outputs.manifest_digest }}
      BUILD_PRODUCER_ATTEMPT: ${{ needs.producer.outputs.producer_attempt }}
    steps:
      - name: Check out exact experimental source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed implementation and isolated workflow-only successor
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          [[ "$EXPECTED_IMPLEMENTATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REPOSITORY" = bechirobob/tickets
          test "$GITHUB_REF" = refs/heads/experiment/real-artifact-retry-20261028
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_IMPLEMENTATION_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/retry-real-artifact-experiment.yml
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" "$EXPECTED_IMPLEMENTATION_SHA"
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          [[ "$GITHUB_RUN_ATTEMPT" = 1 || "$GITHUB_RUN_ATTEMPT" = 2 ]]
      - name: Set up identical Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      # Consumers run only reviewed Python transport code and Node --version,
      # not npm packages, browsers, fixtures or application acceptance tests.
      - name: Download original immutable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-build
          merge-multiple: true
      - name: Verify every artifact byte and original producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_PRODUCER_ATTEMPT" = 1
          if [[ "$GITHUB_RUN_ATTEMPT" = 1 ]]; then
            python3 ops/vps/candidate_build.py restore --directory "$RUNNER_TEMP/candidate-build" --browser desktop-chromium
          else
            test "$GITHUB_RUN_ATTEMPT" = 2
            python3 ops/vps/candidate_build.py restore-retry --directory "$RUNNER_TEMP/candidate-build" --browser desktop-chromium
          fi
      - name: Demonstrate tampered archive fails before any second restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, pathlib, sys, tempfile
          sys.path.insert(0, 'ops/vps')
          import candidate_build as build
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-build'
          current = build.identity()
          with tempfile.TemporaryDirectory(prefix='isolated-tamper-', dir=os.environ['RUNNER_TEMP']) as temporary:
              target = pathlib.Path(temporary)
              (target / build.MANIFEST).write_bytes((source / build.MANIFEST).read_bytes())
              (target / build.ARCHIVE).write_bytes((source / build.ARCHIVE).read_bytes() + b'tampered')
              producer = current if current['run_attempt'] == '1' else build.retry_producer_identity(current, '1')
              try:
                  build.validate(target, producer, os.environ['BUILD_ARCHIVE_DIGEST'], os.environ['BUILD_MANIFEST_DIGEST'])
              except build.BuildError as error:
                  assert str(error) == 'Producer build digest differs', str(error)
                  print('Expected tampered archive rejection; original artifact untouched; release_authorized=false')
              else:
                  raise AssertionError('Tampered artifact was not rejected')
          PYTHON
  retained_b:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
