  retry_target:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
      BUILD_ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
      BUILD_ARCHIVE_DIGEST: ${{ needs.producer.outputs.archive_digest }}
      BUILD_MANIFEST_DIGEST: ${{ needs.producer.outputs.manifest_digest }}
      BUILD_PRODUCER_ATTEMPT: ${{ needs.producer.outputs.producer_attempt }}
    steps:
      - name: Check out exact experimental source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
