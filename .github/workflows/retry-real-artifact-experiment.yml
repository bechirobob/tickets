      - name: Download original immutable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # Deliberate missing ID inside the actual pinned action, not a transport-error classifier.
          artifact-ids: ${{ github.run_attempt == 1 && '0' || needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-build
          merge-multiple: true
