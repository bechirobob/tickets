name: Inspect Tickets dual-hosting data readiness
on:
  push:
    branches: [ops/vps-data-inventory-20260928]
    paths: [.github/workflows/vps-data-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read migration inventory without exposing customer records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/af75a230de2eea882606db8d9acce473';
          async function api(path, body) {
            const response=await fetch(root+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            const result=await response.json();
            if(!response.ok||!result.success)throw Error('Read-only inventory failed: '+response.status);
            return result;
          }
          const settings=(await api('/workers/scripts/becore-tickets/settings')).result;
          const db=settings.bindings.find(b=>b.type==='d1'&&b.name==='DB');
          const rooms=settings.bindings.find(b=>b.type==='durable_object_namespace'&&b.name==='THE_ROOM');
          if(!db?.id||!rooms?.namespace_id)throw Error('Expected bindings missing.');
          const names=['orders','tickets','attendee_profiles','attendee_sessions','staff_accounts','staff_sessions','curated_event_records','gate_checkin_events'];
          const counts={};
          for(const table of names) {
            const result=(await api('/d1/database/'+db.id+'/query',{sql:'SELECT COUNT(*) AS n FROM '+table})).result;
            if(!result[0]?.success)throw Error('Count failed.');
            counts[table]=result[0].results[0].n;
          }
          let cursor='', objects=0, stored=0;
          for(let page=0;page<100;page++) {
            const result=await api('/workers/durable_objects/namespaces/'+rooms.namespace_id+'/objects?limit=1000'+(cursor?'&cursor='+encodeURIComponent(cursor):''));
            objects+=result.result.length;stored+=result.result.filter(o=>o.hasStoredData).length;
            const next=result.result_info?.cursor;
            if(!next||next===cursor||result.result.length===0)break;
            cursor=next;
            if(page===99)throw Error('Namespace inventory incomplete.');
          }
          console.log(JSON.stringify({readOnly:true,customerRowsExposed:false,counts,roomObjects:objects,roomsWithStoredData:stored,credentialValuesRead:false}));
          NODE
