name: Verify Bubble Wash Cloudflare Zone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bubblewash-zone-setup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubblewash-cloudflare-zone
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
    steps:
      - name: Verify the Bubble Wash zone and production routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from "node:fs/promises";

          const api = "https://api.cloudflare.com/client/v4";
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json",
          };
          const request = async (path, options = {}) => {
            const response = await fetch(`${api}${path}`, { ...options, headers });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(JSON.stringify(payload.errors ?? payload));
            }
            return payload;
          };

          const name = "bubblewash.co";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const listed = await request(`/zones?name=${encodeURIComponent(name)}&account.id=${accountId}`);
          const zone = listed.result?.find((candidate) => candidate.name === name);
          if (!zone?.id || !Array.isArray(zone.name_servers) || zone.name_servers.length !== 2) {
            throw new Error("Cloudflare did not return a usable Bubble Wash zone.");
          }
          if (zone.status !== "active") throw new Error(`Bubble Wash zone is ${zone.status}.`);

          await request(`/zones/${zone.id}/dns_records?per_page=1`);
          const routes = await request(`/zones/${zone.id}/workers/routes`);
          const expectedPatterns = ["bubblewash.co/*", "www.bubblewash.co/*"];
          const productionRoutes = expectedPatterns.map((pattern) =>
            (routes.result ?? []).find((route) => route.pattern === pattern && route.script === "bubble-wash"),
          );
          if (productionRoutes.some((route) => !route?.id)) {
            throw new Error(`Bubble Wash production routes are incomplete: ${JSON.stringify(routes.result ?? [])}`);
          }

          const result = {
            zone: zone.name,
            status: zone.status,
            nameservers: zone.name_servers,
            routes: productionRoutes.map((route) => ({ pattern: route.pattern, script: route.script })),
            checked_at: new Date().toISOString(),
          };
          await writeFile("bubblewash-zone.json", `${JSON.stringify(result, null, 2)}\n`);
          await appendFile(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Bubble Wash Cloudflare production topology",
              "",
              `Zone status: \`${result.status}\``,
              "",
              `Nameservers: \`${result.nameservers.join("`, `")}\``,
              "",
              `Worker routes: \`${result.routes.map((route) => route.pattern).join("`, `")}\``,
              "",
            ].join("\n"),
          );
          console.log(JSON.stringify(result));
          NODE

      - name: Verify Bubble Wash production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --max-time 20 https://bubblewash.co/api/health)"
          node -e 'const value=JSON.parse(process.argv[1]); if(value.ok!==true || value.deploymentPhase!=="production" || value.readiness!=="ready") process.exit(1)' "$response"

      - name: Preserve zone verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bubblewash-cloudflare-zone
          path: bubblewash-zone.json
          if-no-files-found: error
          retention-days: 35
