name: Verify dedicated Tickets VPS access
on:
  push:
    branches: [main]
    paths: [.github/workflows/tickets-vps-access.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Tickets-owned identity configuration
        env:
          CLIENT_ID: ${{ vars.TICKETS_TS_CLIENT_ID }}
          AUDIENCE: ${{ vars.TICKETS_TS_AUDIENCE }}
        run: |
          test -n "$CLIENT_ID" && test -n "$AUDIENCE" || { echo "Dedicated Tickets identity configuration is missing. No shared fallback will be used."; exit 1; }
      - name: Connect using the dedicated Tickets identity
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ vars.TICKETS_TS_CLIENT_ID }}
          audience: ${{ vars.TICKETS_TS_AUDIENCE }}
          tags: tag:tickets-ci
          ping: hermes
      - name: Verify Tickets service isolation without changes
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import pathlib,pwd,json,subprocess
          user=pwd.getpwnam('becore-tickets')
          assert user.pw_uid != 0
          for name in ['/srv/becore-tickets','/etc/becore-tickets','/var/lib/becore-tickets-preview']:
            p=pathlib.Path(name)
            assert p.is_dir() and not p.is_symlink()
          result=subprocess.run(['systemctl','show','becore-tickets-preview.service','--property=User,WorkingDirectory,ActiveState','--no-pager'],capture_output=True,text=True,check=True)
          values=dict(line.split('=',1) for line in result.stdout.splitlines() if '=' in line)
          assert values['User']=='becore-tickets'
          assert values['WorkingDirectory'].startswith('/srv/becore-tickets/')
          print(json.dumps({'dedicatedTicketsAccess':True,'runtimeUser':values['User'],'previewState':values['ActiveState']}))
          PY
