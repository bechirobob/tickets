name: Inspect PURO first-host email outcomes read-only

# Fixed live-revision, aggregate-only inspection. No deployment, provider calls or data writes.
on:
  push:
    branches: [main]
    paths: [.github/workflows/puro-first-host-delivery-readonly-20261024.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == '7727e460f85dd1b70df6fa5bcc1e15c2141152aa' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-file exact predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^1)" = '7727e460f85dd1b70df6fa5bcc1e15c2141152aa'
          test "$(git diff --name-only HEAD^1 HEAD)" = '.github/workflows/puro-first-host-delivery-readonly-20261024.yml'
      - name: Connect existing Tickets identity
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read exact active PURO delivery evidence without mutations
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes "python3 -" <<'PYREAD'
          import fcntl,json,os,pathlib,sqlite3,subprocess,time,urllib.request
          SLUG="puro-exceso-20261024"
          EXPECTED="8f43707d9f656b5638659acb9e25595e8903797a"
          def rows(db,sql,args=()):
              cur=db.execute(sql,args)
              return [dict(zip([c[0] for c in cur.description],r)) for r in cur]
          def diagnose(db):
              receipts=rows(db,"SELECT message_id,created_at,fanout_at,cancelled_at FROM room_host_first_posts WHERE event_slug=?",(SLUG,))
              assert len(receipts)<=1,"Ambiguous first-host receipt"
              if not receipts:return {"receiptCount":0}
              receipt=receipts[0];mid=receipt["message_id"]
              mail="FROM delivery_events d WHERE d.kind='room_host_post' AND json_extract(d.payload_json,'$.eventSlug')=? AND json_extract(d.payload_json,'$.messageId')=?"
              args=(SLUG,mid)
              status="CASE WHEN d.status IN ('queued','sending','sent','delivered','delayed','failed','bounced','complained','suppressed','uncertain') THEN d.status ELSE 'other' END"
              groups=rows(db,"SELECT "+status+" AS status,COUNT(*) AS count,SUM(d.provider_id IS NOT NULL) AS providerReceipts,MIN(d.created_at) AS firstCreated,MAX(d.updated_at) AS lastUpdated,MAX(d.provider_event_at) AS lastProviderEvent,MIN(d.attempt_count) AS minAttempts,MAX(d.attempt_count) AS maxAttempts "+mail+" GROUP BY 1",args)
              no_push=rows(db,"SELECT "+status+" AS status,COUNT(*) AS count "+mail+" AND NOT EXISTS (SELECT 1 FROM push_subscriptions s WHERE s.attendee_id=json_extract(d.payload_json,'$.attendeeId') AND s.revoked_at IS NULL AND s.host_updates=1) GROUP BY 1",args)
              reasons=rows(db,"SELECT CASE WHEN d.failure_reason IS NULL THEN 'none' WHEN d.failure_reason='Delivery outcome needs review; automatic resend is disabled.' THEN 'provider_outcome_uncertain' WHEN d.failure_reason='Delivery interrupted; review provider receipt before any resend.' THEN 'interrupted_outcome_uncertain' ELSE 'other_redacted' END AS reason,COUNT(*) AS count "+mail+" AND d.status IN ('failed','uncertain','bounced','complained','delayed') GROUP BY 1",args)
              inbox=db.execute("SELECT count(*) FROM attendee_notifications WHERE event_slug=? AND kind='host_first_post' AND source_id=?",args).fetchone()[0]
              push=rows(db,"SELECT CASE WHEN status IN ('pending','processing','complete') THEN status ELSE 'other' END AS status,COUNT(*) AS count,MIN(attempts) AS minAttempts,MAX(attempts) AS maxAttempts FROM room_announcement_deliveries WHERE event_slug=? AND json_extract(payload_json,'$.kind')='host_first_post' AND json_extract(payload_json,'$.sourceId')=? GROUP BY 1",args)
              missing=db.execute("SELECT count(*) FROM attendee_notifications n WHERE n.event_slug=? AND n.kind='host_first_post' AND n.source_id=? AND NOT EXISTS (SELECT 1 FROM delivery_events d WHERE d.kind='room_host_post' AND json_extract(d.payload_json,'$.messageId')=n.source_id AND json_extract(d.payload_json,'$.attendeeId')=n.attendee_id)",args).fetchone()[0]
              exclusions=rows(db,"""SELECT p.email_verified_at IS NULL AS unverifiedEmail,
                EXISTS(SELECT 1 FROM marketing_contacts m WHERE m.email=p.normalized_email AND m.unsubscribed=1) AS globalEmailOptOut,
                EXISTS(SELECT 1 FROM event_audience_contacts c WHERE c.event_slug=n.event_slug AND c.email=p.normalized_email AND c.unsubscribed_at IS NOT NULL AND c.unsubscribed_at>=COALESCE(c.consented_at,'')) AS eventEmailOptOut,
                EXISTS(SELECT 1 FROM delivery_events prior WHERE prior.recipient=p.normalized_email AND prior.status IN ('bounced','complained')) AS priorBadMailbox,
                EXISTS(SELECT 1 FROM push_subscriptions s WHERE s.attendee_id=n.attendee_id AND s.revoked_at IS NULL AND s.host_updates=1) AS currentPushSubscription,
                COUNT(*) AS count FROM attendee_notifications n JOIN attendee_profiles p ON p.id=n.attendee_id
                WHERE n.event_slug=? AND n.kind='host_first_post' AND n.source_id=? AND NOT EXISTS
                (SELECT 1 FROM delivery_events d WHERE d.kind='room_host_post' AND json_extract(d.payload_json,'$.messageId')=n.source_id AND json_extract(d.payload_json,'$.attendeeId')=n.attendee_id)
                GROUP BY 1,2,3,4,5""",args)
              booking=rows(db,"""WITH missing AS (
                SELECT n.attendee_id,n.event_slug,p.normalized_email FROM attendee_notifications n
                JOIN attendee_profiles p ON p.id=n.attendee_id AND p.status='active'
                WHERE n.event_slug=? AND n.kind='host_first_post' AND n.source_id=?
                AND NOT EXISTS(SELECT 1 FROM delivery_events d WHERE d.kind='room_host_post'
                  AND json_extract(d.payload_json,'$.messageId')=n.source_id AND json_extract(d.payload_json,'$.attendeeId')=n.attendee_id)
              ), contacts AS (
                SELECT m.attendee_id,m.event_slug,m.normalized_email,MAX(r.normalized_email) AS booking_email,MAX(r.id) AS registration_id,COUNT(DISTINCT r.id) AS booking_count
                FROM missing m LEFT JOIN ticket_assignments a ON a.attendee_id=m.attendee_id AND a.status='active'
                LEFT JOIN tickets t ON t.id=a.ticket_id AND t.event_slug=m.event_slug AND t.status IN ('issued','checked_in')
                LEFT JOIN orders o ON o.id=t.order_id AND o.status='paid' AND o.payment_provider='rsvp'
                LEFT JOIN event_registrations r ON r.order_id=o.id AND r.event_slug=m.event_slug AND r.attendee_id=m.attendee_id
                  AND r.kind='rsvp' AND r.status='confirmed' AND (r.device_claimed_at IS NOT NULL OR r.verified_at IS NOT NULL)
                  AND r.normalized_email=o.customer_email
                GROUP BY m.attendee_id,m.event_slug,m.normalized_email
              ) SELECT booking_count=1 AS linkedConfirmedRsvp,
                booking_email=normalized_email AS matchesProfileAddress,
                EXISTS(SELECT 1 FROM push_subscriptions s WHERE s.attendee_id=c.attendee_id AND s.revoked_at IS NULL AND s.host_updates=1) AS currentPushSubscription,
                EXISTS(SELECT 1 FROM delivery_events d WHERE d.recipient=c.booking_email AND d.status IN ('bounced','complained')) AS priorBadMailbox,
                EXISTS(SELECT 1 FROM marketing_contacts m WHERE m.email=c.booking_email AND m.unsubscribed=1) AS globalEmailOptOut,
                EXISTS(SELECT 1 FROM event_audience_contacts e WHERE e.event_slug=c.event_slug AND e.email=c.booking_email AND e.unsubscribed_at IS NOT NULL AND e.unsubscribed_at>=COALESCE(e.consented_at,'')) AS eventEmailOptOut,
                EXISTS(SELECT 1 FROM delivery_events d WHERE d.kind='registration_update' AND d.recipient=c.booking_email
                  AND json_extract(d.payload_json,'$.idempotencyKey') LIKE 'registration-update/'||c.registration_id||'/%' AND d.status='delivered') AS priorRsvpEmailDelivered,
                EXISTS(SELECT 1 FROM delivery_events d WHERE d.kind='registration_update' AND d.recipient=c.booking_email
                  AND json_extract(d.payload_json,'$.idempotencyKey') LIKE 'registration-update/'||c.registration_id||'/%' AND d.status IN ('sent','delivered')) AS priorRsvpEmailAccepted,
                COUNT(DISTINCT attendee_id) AS count FROM contacts c GROUP BY 1,2,3,4,5,6,7,8""",args)
              health=rows(db,"SELECT job_key,started_at,finished_at,last_success_at,last_failure_at,failure_count FROM background_job_health WHERE job_key IN ('scheduled:minute','scheduled:five-minute','delivery-loop')")
              return {"receiptCount":1,"createdAt":receipt['created_at'],"fanoutAt":receipt['fanout_at'],"cancelled":receipt['cancelled_at'] is not None,"inboxRecipients":inbox,"emailGroups":groups,"emailRecipientsWithoutCurrentPushSubscription":no_push,"emailFailureGroups":reasons,"inboxRecipientsWithoutEmailJob":missing,"currentEmailExclusionGroups":exclusions,"currentBookingContactGroups":booking,"exclusionsAreCurrentSnapshot":True,"pushJobGroups":push,"pushCompleteDoesNotProveDeviceDelivery":True,"currentSubscriptionDoesNotProvePushDelivery":True,"backgroundHealth":health}
          def main():
              lock=os.open('/run/lock/becore-tickets-deploy.lock',os.O_RDONLY|os.O_NOFOLLOW)
              fcntl.flock(lock,fcntl.LOCK_SH|fcntl.LOCK_NB)
              props=dict(line.split('=',1) for line in subprocess.check_output(['systemctl','show','becore-tickets.service','--property=ActiveState,WorkingDirectory'],text=True).splitlines())
              assert props=={'ActiveState':'active','WorkingDirectory':'/srv/becore-tickets/releases/'+EXPECTED}
              request=urllib.request.Request('http://127.0.0.1:3119/healthz',headers={'Host':'tickets.becoreops.com'})
              with urllib.request.urlopen(request,timeout=10) as response: health=json.load(response)
              assert health.get('revision')==EXPECTED and health.get('runtime')=='vps' and health.get('active') is True
              path=pathlib.Path('/var/lib/becore-tickets/tickets.sqlite')
              assert path.is_file() and not path.is_symlink()
              db=sqlite3.connect('file:'+str(path)+'?mode=ro',uri=True,timeout=5)
              deadline=time.monotonic()+15
              db.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
              db.execute('PRAGMA query_only=ON');db.execute('BEGIN')
              result=diagnose(db)
              assert db.total_changes==0
              db.rollback();db.close()
              print(json.dumps({'readOnly':True,'eventSlug':SLUG,'activeRevision':EXPECTED,'observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'resends':0,**result},sort_keys=True))
          if __name__=='__main__':main()
          PYREAD
