name: Complete scheduled invocation evidence
on:
  push:
    branches: [ops/tickets-terminal-observer]
    paths: ['ops/handover-terminal/**', 'tests/handover-terminal.test.mjs', '.github/workflows/tickets-terminal.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - run: node --test tests/handover-terminal.test.mjs
      - name: Install private terminal observer without changing application code or routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node ops/handover-terminal/install.mjs
          node ops/handover-terminal/reconcile.mjs
