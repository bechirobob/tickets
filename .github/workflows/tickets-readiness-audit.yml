name: Observe Tickets launch readiness read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/tickets-readiness-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test read-only observation contract
        run: python3 -m unittest discover -s ops/vps -p test_audit_readiness.py
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read fixed Tickets operational metadata and aggregate counts
        run: tailscale ssh root@hermes 'python3 -' < ops/vps/audit-readiness.py
      - name: Verify off-host backup recovery key metadata without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Existing Cloudflare connection is unavailable.');
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/af75a230de2eea882606db8d9acce473/workers/scripts/becore-tickets/secrets', {
            headers: { authorization: `Bearer ${token}` }, redirect: 'error', signal: AbortSignal.timeout(15000)
          });
          const data = await response.json();
          if (!response.ok || !data.success || !Array.isArray(data.result)) throw new Error('Backup escrow metadata could not be verified.');
          const present = data.result.some(item => item.name === 'VPS_BACKUP_RECOVERY_KEY' && item.type === 'secret_text');
          console.log(JSON.stringify({ readOnly: true, backupEscrowMetadataPresent: present, recoveryKeyValueRead: false, totalHostLossRestoreTested: false }));
          if (!present) process.exitCode = 1;
          JS
