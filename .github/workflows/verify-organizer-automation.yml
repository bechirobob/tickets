name: Verify organiser automation state
on:
  push:
    branches: [ops/verify-organizer-automation]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
    steps:
      - name: Read aggregate automation state
        run: |
          node --input-type=module <<'NODE'
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database';
          const listing=await fetch(root+'?name=becore-tickets-db',{headers});
          const listed=await listing.json(),db=listed.result?.find(d=>d.name==='becore-tickets-db');
          if(!listing.ok||!listed.success||!db)throw new Error('Database lookup failed');
          const queries={
            failures:"SELECT kind,attempt_count,next_attempt_at,CASE WHEN failure_reason LIKE '%configured%' THEN 'configuration' WHEN failure_reason LIKE '%quota%' THEN 'quota' ELSE 'other' END AS category,(json_extract(payload_json,'$.idempotencyKey') LIKE 'organizer-signup/the-weekend-braai/%') AS removed_event,COUNT(*) AS count FROM delivery_events WHERE status='failed' AND kind IN ('organizer_signup','organizer_invitation','organizer_report') GROUP BY kind,attempt_count,next_attempt_at,category,removed_event",
            marketing:"SELECT status,contact_count,reserved_count,checked_at,error FROM marketing_state WHERE id='resend'",
            audience:"SELECT COUNT(*) AS event_contacts,COUNT(DISTINCT email) AS unique_contacts,SUM(consented_at IS NOT NULL AND consented_at>COALESCE(unsubscribed_at,'')) AS opted_in FROM event_audience_contacts",
            sync:"SELECT COUNT(DISTINCT a.email) AS waiting FROM event_audience_contacts a LEFT JOIN marketing_contacts m ON m.email=a.email JOIN curated_event_records e ON e.slug=a.event_slug WHERE a.consented_at IS NOT NULL AND a.consented_at>COALESCE(a.unsubscribed_at,'') AND COALESCE(m.unsubscribed,0)=0 AND m.provider_id IS NULL AND e.removed_at IS NULL AND e.is_test_event=0",
            reservations:"SELECT COUNT(*) AS total,SUM(reserved=1 AND provider_id IS NULL) AS unresolved,SUM(provider_id IS NOT NULL) AS synced FROM marketing_contacts",
            campaigns:"SELECT status,COUNT(*) AS count FROM marketing_campaigns GROUP BY status",
            organisers:"SELECT status,must_change_password,COUNT(*) AS count FROM staff_accounts WHERE role='organizer' GROUP BY status,must_change_password",
            activation:"SELECT CASE WHEN used_at IS NOT NULL THEN 'used' WHEN expires_at<strftime('%Y-%m-%dT%H:%M:%fZ','now') THEN 'expired' ELSE 'pending' END AS state,COUNT(*) AS count FROM organizer_invitations GROUP BY state",
            pending_access:"SELECT status,COUNT(*) AS count FROM party_submissions WHERE organizer_access_pending=1 GROUP BY status",
            deliveries:"SELECT kind,status,COUNT(*) AS count,SUM(attempt_count>=3) AS exhausted,SUM(next_attempt_at IS NOT NULL) AS scheduled_retry FROM delivery_events WHERE kind IN ('organizer_invitation','organizer_report','organizer_signup','registration_access','registration_update') GROUP BY kind,status",
            reports:"SELECT kind,COUNT(*) AS count,MAX(created_at) AS latest FROM organizer_reports GROUP BY kind",
            rollout:"SELECT started_at FROM organizer_report_rollout",
            alerts:"SELECT source,severity,COUNT(*) AS count FROM system_alerts WHERE status<>'resolved' GROUP BY source,severity"
          };
          const result={asOf:new Date().toISOString()};
          for(const [name,sql] of Object.entries(queries)){
            const response=await fetch(root+'/'+db.uuid+'/query',{method:'POST',headers,body:JSON.stringify({sql}),signal:AbortSignal.timeout(20000)});
            const payload=await response.json();
            if(!response.ok||!payload.success||!payload.result?.[0]?.success)throw new Error('Aggregate query failed: '+name);
            result[name]=payload.result[0].results;
          }
          console.log(JSON.stringify(result,null,2));
          NODE
