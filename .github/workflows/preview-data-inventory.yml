name: Preview data inventory
on:
  push:
    branches: [feat/full-visual-audit]
    paths: ['scripts/inspect-preview-data.mjs', '.github/workflows/preview-data-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read production preview inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: node scripts/inspect-preview-data.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-data-inventory
          path: preview-data-inventory.json
          retention-days: 30
