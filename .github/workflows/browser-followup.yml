name: Focused production browser regressions

on:
  pull_request:
    branches: [main]
    paths:
      - tests/e2e/navigation-audit.spec.ts
      - tests/e2e/discovery-pass-access.spec.ts
      - tests/e2e/room-identity.spec.ts
      - .github/workflows/browser-followup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001 --shm-size=1g
    timeout-minutes: 12
    env:
      E2E_BASE_URL: https://tickets.becoreops.com
      TEST_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PRIVACY_FOLLOWUP: ${{ github.event.pull_request.head.ref == 'fix/privacy-audit-edge-comments-20261029' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/privacy-audit-edge-comments-20261029') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: node scripts/verify-browser-environment.mjs chromium webkit
      # These existing journeys use anonymous reads or intercepted fixture APIs.
      # No checkout, email, registration or customer-data writes reach production.
      - name: Repeat the three affected mobile journeys with retries disabled
        run: npx playwright test navigation-audit.spec.ts member-navigation.spec.ts public-journey.spec.ts --project mobile-chromium --grep 'navigation waits for its handlers|My Nights recovers from a service failure|My Nights exposes secure recovery' --workers=1 --retries=0 --repeat-each=5 --trace=retain-on-failure
      - name: Verify active-pass loading on desktop without retries
        run: npx playwright test discovery-pass-access.spec.ts --project desktop-chromium --grep 'an active night leads' --workers=1 --retries=0 --repeat-each=5 --trace=retain-on-failure --output=test-results-pass-access
      - name: Bind privacy follow-up to the activated application
        id: privacy_baseline
        if: env.PRIVACY_FOLLOWUP == 'true'
        run: |
          set -euo pipefail
          expected=6e0e718d9d183072968433eef42cdad090545213
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          git merge-base --is-ancestor "$expected" HEAD
          git merge-base --is-ancestor "$expected" refs/remotes/origin/main
          git diff --exit-code "$expected" HEAD -- . ':!tests/e2e/room-identity.spec.ts' ':!tests/browser-environment.test.mjs' ':!.github/workflows/browser-followup.yml'
          mkdir -p "$RUNNER_TEMP/privacy-followup"
          cat > "$RUNNER_TEMP/privacy-followup/verify.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          const expected = '6e0e718d9d183072968433eef42cdad090545213';
          const phase = process.argv[2];
          assert.ok(['before', 'after'].includes(phase));
          for (const path of ['/healthz', '/api/version']) {
            const response = await fetch(`https://tickets.becoreops.com${path}`, {
              headers: { 'Cache-Control': 'no-cache', Accept: 'application/json' },
              redirect: 'error', signal: AbortSignal.timeout(20000),
            });
            assert.equal(response.status, 200);
            const value = await response.json();
            assert.equal(value.service, 'becore-tickets');
            assert.equal(value.revision, expected);
            if (path === '/healthz') {
              assert.equal(value.runtime, 'vps');
              assert.equal(value.active, true);
            }
          }
          const evidence = { phase, productionRevision: expected, testRevision: process.env.TEST_SOURCE, verifiedAt: new Date().toISOString() };
          await writeFile(`${process.env.RUNNER_TEMP}/privacy-followup/${phase}.json`, JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          JS
          node "$RUNNER_TEMP/privacy-followup/verify.mjs" before
      - name: Verify unobfuscated support addresses and hydration in all three browsers
        if: env.PRIVACY_FOLLOWUP == 'true'
        run: npx playwright test room-identity.spec.ts --grep 'support email stays intact through hydration' --project desktop-chromium --project mobile-chromium --project mobile-webkit --workers=1 --retries=0 --output=test-results-privacy
      - name: Confirm the application stayed on the activated revision
        if: ${{ always() && steps.privacy_baseline.outcome == 'success' }}
        run: node "$RUNNER_TEMP/privacy-followup/verify.mjs" after
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && env.PRIVACY_FOLLOWUP == 'true' }}
        with:
          name: privacy-production-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/privacy-followup/*.json
            test-results-privacy
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: focused-production-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            test-results-pass-access
          retention-days: 14
