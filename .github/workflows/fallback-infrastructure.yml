name: Inspect Tickets fallback infrastructure
on:
  push:
    branches: [feat/vps-maintenance-fallback]
    paths:
      - .github/workflows/fallback-infrastructure.yml
      - scripts/inspect-fallback-infrastructure.mjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Inspect current routing permissions and connection presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: node scripts/inspect-fallback-infrastructure.mjs
