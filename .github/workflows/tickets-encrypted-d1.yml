name: Encrypted Tickets database restore rehearsal
on:
  push:
    branches: [ops/tickets-encrypted-handover-20260929]
    paths: [.github/workflows/tickets-encrypted-d1.yml, export-d1.mjs]
permissions:
  contents: read
concurrency:
  group: tickets-encrypted-handover
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Verify encryption and restore integrity with synthetic data
        run: node --test tests/handover-envelope.test.mjs tests/handover-data.test.mjs
      - name: Export and encrypt a non-cutover database snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node export-d1.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tickets-encrypted-d1
          path: handover-encrypted/database.json
          retention-days: 1
