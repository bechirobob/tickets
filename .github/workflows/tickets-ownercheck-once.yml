name: Add approved Tickets ownership TXT
on:
  push:
    branches: [ops/tickets-ownercheck-20261007]
    paths: [.github/workflows/tickets-ownercheck-once.yml]
permissions:
  contents: read
concurrency:
  group: tickets-ownercheck-20261007
  cancel-in-progress: false
jobs:
  add_exact_txt:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/ops/tickets-ownercheck-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the exact TXT at both authoritative nameservers
        shell: bash
        run: |
          set -euo pipefail
          for server in langston.ns.cloudflare.com raquel.ns.cloudflare.com; do
            answer="$(dig +time=5 +tries=1 +short TXT ownercheck.mail.becoreops.com @"$server")"
            printf '%s\n' "$answer"
            if ! printf '%s\n' "$answer" | grep -Fxq '"68449444"'; then
              echo "TXT not yet verified at $server; do not repeat the write."
              exit 1
            fi
            echo "Verified ownercheck.mail.becoreops.com TXT 68449444 at $server"
          done
