name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure Workers subdomain exists
        env:
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: |
          node --input-type=module <<'NODE'
          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json",
          };

          const current = await fetch(endpoint, { headers });
          if (current.ok) {
            console.log("Workers subdomain is already registered.");
            process.exit(0);
          }

          const created = await fetch(endpoint, {
            method: "PUT",
            headers,
            body: JSON.stringify({ subdomain: "becoreops" }),
          });
          const responseBody = await created.text();
          if (!created.ok) {
            console.error(responseBody);
            process.exit(1);
          }
          console.log("Workers subdomain registered.");
          NODE

      - name: Resolve D1 database binding
        env:
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database?name=becore-tickets-db`;
          const response = await fetch(endpoint, {
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            },
          });
          const payload = await response.json();
          const database = payload.result?.find(
            (candidate) => candidate.name === "becore-tickets-db",
          );
          if (!response.ok || !database?.uuid) {
            console.error(JSON.stringify(payload));
            process.exit(1);
          }

          const config = JSON.parse(await readFile("wrangler.jsonc", "utf8"));
          config.d1_databases[0].database_id = database.uuid;
          await writeFile("wrangler.jsonc", `${JSON.stringify(config, null, 2)}\n`);
          console.log("D1 database binding resolved.");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Ensure persistent Web Push identity
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { generateVAPIDKeys } from "web-push-neo";

          const listed = spawnSync("npx", ["wrangler", "secret", "list", "--format", "json"], {
            encoding: "utf8",
            env: process.env,
          });
          if (listed.status !== 0) {
            console.error(listed.stderr || "Could not inspect Worker secrets.");
            process.exit(1);
          }
          const names = new Set(JSON.parse(listed.stdout).map((item) => item.name));
          if (names.has("VAPID_PUBLIC_KEY") && names.has("VAPID_PRIVATE_KEY")) {
            console.log("Web Push identity already exists.");
            process.exit(0);
          }
          const keys = await generateVAPIDKeys();
          for (const [name, value] of [
            ["VAPID_PUBLIC_KEY", keys.publicKey],
            ["VAPID_PRIVATE_KEY", keys.privateKey],
          ]) {
            const written = spawnSync("npx", ["wrangler", "secret", "put", name], {
              input: `${value}\n`,
              encoding: "utf8",
              env: process.env,
            });
            if (written.status !== 0) {
              console.error(written.stderr || `Could not configure ${name}.`);
              process.exit(1);
            }
          }
          console.log("Web Push identity provisioned without exposing key material.");
          NODE

      - name: Verify generated Worker bindings
        run: npm run cf:types

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Lint source
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run complete test suite
        run: npm test

      - name: Build deployable application
        run: npm run build && node scripts/prepare-deploy.mjs

      - name: Validate Worker package
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run --outdir dist/worker-dry-run

      - name: Ensure persistent staff login privacy key
        run: node scripts/ensure-staff-login-secret.mjs

      - name: Accept Flash moderation model terms
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.2-11b-vision-instruct`;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ prompt: "agree", max_tokens: 1 }),
          });
          const payload = await response.json();
          if (!response.ok || payload.success !== true) {
            console.error(JSON.stringify({ status: response.status, errors: payload.errors ?? [] }));
            process.exit(1);
          }
          console.log("Flash moderation model terms confirmed.");
          NODE

      - name: Record D1 recovery bookmark
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB --json | tee d1-pre-migration-bookmark.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const record = JSON.parse(
            await readFile("d1-pre-migration-bookmark.json", "utf8"),
          );
          if (typeof record.bookmark !== "string" || record.bookmark.length === 0) {
            console.error("Cloudflare did not return a D1 recovery bookmark.");
            process.exit(1);
          }
          console.log("D1 recovery bookmark captured.");
          NODE

      - name: Preserve D1 recovery bookmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-pre-migration-bookmark-${{ github.sha }}
          path: d1-pre-migration-bookmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply database migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
