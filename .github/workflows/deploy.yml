name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure Workers subdomain exists
        env:
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: |
          node --input-type=module <<'NODE'
          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json",
          };

          const current = await fetch(endpoint, { headers });
          if (current.ok) {
            console.log("Workers subdomain is already registered.");
            process.exit(0);
          }

          const created = await fetch(endpoint, {
            method: "PUT",
            headers,
            body: JSON.stringify({ subdomain: "becoreops" }),
          });
          const responseBody = await created.text();
          if (!created.ok) {
            console.error(responseBody);
            process.exit(1);
          }
          console.log("Workers subdomain registered.");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Deploy Worker
        run: npm run deploy:built

      - name: Apply database migrations
        run: npm run db:migrate:remote
