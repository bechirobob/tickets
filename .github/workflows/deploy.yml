name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure Workers subdomain exists
        env:
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: |
          node --input-type=module <<'NODE'
          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json",
          };

          const current = await fetch(endpoint, { headers });
          if (current.ok) {
            console.log("Workers subdomain is already registered.");
            process.exit(0);
          }

          const created = await fetch(endpoint, {
            method: "PUT",
            headers,
            body: JSON.stringify({ subdomain: "becoreops" }),
          });
          const responseBody = await created.text();
          if (!created.ok) {
            console.error(responseBody);
            process.exit(1);
          }
          console.log("Workers subdomain registered.");
          NODE

      - name: Resolve D1 database binding
        env:
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database?name=becore-tickets-db`;
          const response = await fetch(endpoint, {
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            },
          });
          const payload = await response.json();
          const database = payload.result?.find(
            (candidate) => candidate.name === "becore-tickets-db",
          );
          if (!response.ok || !database?.uuid) {
            console.error(JSON.stringify(payload));
            process.exit(1);
          }

          const config = JSON.parse(await readFile("wrangler.jsonc", "utf8"));
          config.d1_databases[0].database_id = database.uuid;
          await writeFile("wrangler.jsonc", `${JSON.stringify(config, null, 2)}\n`);
          console.log("D1 database binding resolved.");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Worker bindings
        run: npm run cf:types

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint source
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run complete test suite
        run: npm test

      - name: Build deployable application
        run: npm run build && node scripts/prepare-deploy.mjs

      - name: Validate Worker package
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run --outdir dist/worker-dry-run

      - name: Provision production Turnstile widget
        env:
          TURNSTILE_WIDGET_NAME: BeCore Tickets Production
          TURNSTILE_HOSTNAME: tickets.becoreops.com
        run: |
          node --input-type=module <<'NODE'
          import { chmod, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const widgetName = process.env.TURNSTILE_WIDGET_NAME;
          const hostname = process.env.TURNSTILE_HOSTNAME;
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/challenges/widgets`;
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };

          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              const errors = (payload.errors ?? []).map(({ code, message }) => ({ code, message }));
              console.error(JSON.stringify({ status: response.status, errors }));
              process.exit(1);
            }
            return payload.result;
          }

          const widgets = await request(`${base}?per_page=1000&filter=${encodeURIComponent(`name:${widgetName}`)}`);
          const matches = widgets.filter((widget) => widget.name === widgetName);
          if (matches.length > 1) {
            console.error(`Multiple Turnstile widgets are named ${widgetName}; refusing to guess.`);
            process.exit(1);
          }

          let widget;
          if (matches.length === 0) {
            widget = await request(base, {
              method: "POST",
              body: JSON.stringify({
                name: widgetName,
                domains: [hostname],
                mode: "managed",
                clearance_level: "no_clearance",
              }),
            });
            console.log("Production Turnstile widget created.");
          } else {
            const current = matches[0];
            const needsUpdate =
              current.mode !== "managed" ||
              current.domains.length !== 1 ||
              current.domains[0] !== hostname;
            if (needsUpdate) {
              await request(`${base}/${current.sitekey}`, {
                method: "PUT",
                body: JSON.stringify({
                  name: widgetName,
                  domains: [hostname],
                  mode: "managed",
                  clearance_level: "no_clearance",
                }),
              });
            }
            widget = await request(`${base}/${current.sitekey}`);
            console.log(needsUpdate
              ? "Production Turnstile widget reused and corrected."
              : "Production Turnstile widget reused.");
          }

          if (!widget?.sitekey || !widget?.secret) {
            console.error("Cloudflare did not return a complete Turnstile credential pair.");
            process.exit(1);
          }

          const secretFile = join(process.env.RUNNER_TEMP, "becore-tickets-turnstile.json");
          await writeFile(secretFile, JSON.stringify({
            TURNSTILE_SITE_KEY: widget.sitekey,
            TURNSTILE_SECRET_KEY: widget.secret,
          }));
          await chmod(secretFile, 0o600);
          NODE

      - name: Accept Flash moderation model terms
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.2-11b-vision-instruct`;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ prompt: "agree", max_tokens: 1 }),
          });
          const payload = await response.json();
          if (!response.ok || payload.success !== true) {
            console.error(JSON.stringify({ status: response.status, errors: payload.errors ?? [] }));
            process.exit(1);
          }
          console.log("Flash moderation model terms confirmed.");
          NODE

      - name: Record D1 recovery bookmark
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB --json | tee d1-pre-migration-bookmark.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const record = JSON.parse(
            await readFile("d1-pre-migration-bookmark.json", "utf8"),
          );
          if (typeof record.bookmark !== "string" || record.bookmark.length === 0) {
            console.error("Cloudflare did not return a D1 recovery bookmark.");
            process.exit(1);
          }
          console.log("D1 recovery bookmark captured.");
          NODE

      - name: Preserve D1 recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-pre-migration-bookmark-${{ github.sha }}
          path: d1-pre-migration-bookmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply database migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: |
          TURNSTILE_FILE="$RUNNER_TEMP/becore-tickets-turnstile.json"
          trap 'rm -f "$TURNSTILE_FILE"' EXIT
          npx wrangler deploy --config dist/server/wrangler.json --secrets-file "$TURNSTILE_FILE"
