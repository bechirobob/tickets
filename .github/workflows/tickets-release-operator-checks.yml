name: Verify Tickets release operator
on:
  pull_request:
    branches: [main]
    paths:
      - ops/vps/code-release.py
      - ops/vps/test_code_release.py
      - ops/vps/runtime_release.py
      - ops/vps/test_runtime_release.py
      - ops/vps/test_runtime_packaging.py
      - ops/vps/candidate_evidence.py
      - ops/vps/test_candidate_evidence.py
      - .github/workflows/candidate-checks.yml
      - .github/workflows/vps-runtime.yml
      - .github/workflows/tickets-code-release.yml
      - .github/workflows/tickets-release-operator-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify release guards and rollback without host access
        run: |
          python3 -m unittest discover -s ops/vps -p 'test_*.py'
          python3 -m py_compile ops/vps/code-release.py ops/vps/test_code_release.py ops/vps/runtime_release.py ops/vps/candidate_evidence.py
          git diff --check
      - name: Verify the exact staged operator layout used for release
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/staged-operator"
          mkdir -m 700 "$staged"
          git archive HEAD ops/vps .github/workflows/tickets-code-release.yml .github/workflows/candidate-checks.yml .github/workflows/vps-runtime.yml .github/workflows/tickets-release-operator-checks.yml | tar -x -C "$staged"
          python3 -m unittest discover -s "$staged/ops/vps" -p 'test_*.py'
