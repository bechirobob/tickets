name: Seev production secrets

on:
  push:
    branches: [release/seev-live-checkout]
    paths: [.github/workflows/seev-production-secrets.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'bechirobob/tickets' && (github.ref_name == 'release/seev-live-checkout' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare API access and provision approved Seev secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEEV_CHECKOUT_API_KEY: ${{ secrets.SEEV_CHECKOUT_API_KEY }}
          SEEV_WEBHOOK_SECRET: ${{ secrets.SEEV_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/af75a230de2eea882606db8d9acce473/workers/scripts/becore-tickets/secrets';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('The existing Cloudflare Actions credential is unavailable.');
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          async function request(method, body) {
            const response = await fetch(endpoint, {
              method, headers, redirect: 'error', signal: AbortSignal.timeout(15000),
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (!response.ok) throw new Error(`Cloudflare secrets API ${method} failed with HTTP ${response.status}.`);
            const payload = await response.json();
            if (payload.success !== true) throw new Error(`Cloudflare secrets API ${method} did not succeed.`);
            return payload.result;
          }
          const names = new Set((await request('GET')).map(item => item.name));
          console.log('Cloudflare API connection verified for becore-tickets.');
          const required = ['SEEV_CHECKOUT_API_KEY', 'SEEV_WEBHOOK_SECRET'];
          for (const name of required) console.log(`${name}: Worker=${names.has(name) ? 'present' : 'absent'}, GitHub secret=${process.env[name] ? 'present' : 'absent'}`);
          if (required.some(name => !process.env[name])) {
            throw new Error('Provisioning requires both approved production Seev credentials in GitHub Actions secrets. No credentials were changed.');
          }
          for (const name of required) {
            const text = process.env[name];
            if (text !== text.trim() || /[\r\n]/u.test(text)) throw new Error(`${name} contains whitespace; no credentials were changed.`);
          }
          for (const name of required) {
            await request('PUT', { name, text: process.env[name], type: 'secret_text' });
            console.log(`${name} stored on becore-tickets without displaying its value.`);
          }
          const saved = new Set((await request('GET')).map(item => item.name));
          if (required.some(name => !saved.has(name))) throw new Error('Worker secret presence verification failed.');
          console.log('Both Seev Worker secrets are present. This does not establish provider validity or enable checkout.');
          NODE
      - name: Verify live Checkout API and webhook signing without paying
        env:
          SEEV_CHECKOUT_API_KEY: ${{ secrets.SEEV_CHECKOUT_API_KEY }}
          SEEV_WEBHOOK_SECRET: ${{ secrets.SEEV_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac, randomUUID } from 'node:crypto';
          const api = 'https://api.seevplus.com/api/v1/developer/payments';
          const response = await fetch(api, {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(20000),
            headers: {
              Authorization: `Bearer ${process.env.SEEV_CHECKOUT_API_KEY}`,
              'Content-Type': 'application/json',
              'Idempotency-Key': `bct-production-connection-${process.env.GITHUB_RUN_ID}`,
            },
            body: JSON.stringify({
              type: 'checkout', amount: 100, currency: 'GHS', channels: ['mobile_money'],
              recipient: { name: 'BeCore Tickets connection check', email: 'tickets@becoreops.com' },
              redirect_url: 'https://tickets.becoreops.com',
              meta: { purpose: 'connection_verification_only', source: 'becore-tickets' },
            }),
          });
          if (!response.ok) throw new Error(`Seev checkout initialization returned HTTP ${response.status}.`);
          const payload = await response.json();
          const data = payload.data;
          if (payload.success !== true || data?.env !== 'production' || data.amount !== 100 || data.currency !== 'GHS'
            || typeof data.reference !== 'string' || !/^PAY-[A-Za-z0-9-]+$/u.test(data.reference)
            || data.checkout_url !== `https://pay.seevplus.com/${data.reference}`) {
            throw new Error('Seev did not return a matching live checkout.');
          }
          const verified = await fetch(`${api}/${encodeURIComponent(data.reference)}`, { redirect: 'error', signal: AbortSignal.timeout(20000) });
          const verification = await verified.json();
          if (!verified.ok || verification.success !== true || verification.data?.reference !== data.reference
            || verification.data.amount !== 100 || verification.data.currency !== 'GHS'
            || (verification.data.env !== undefined && verification.data.env !== 'production')
            || verification.data.status !== 'pending') throw new Error('Live checkout status verification failed.');
          console.log('Live Checkout API: created and verified a pending GHS 1.00 hosted session. No payment was submitted.');

          // Unknown references return before writing an order or payment event.
          const webhook = 'https://tickets.becoreops.com/api/payments/seevplus/webhook';
          const id = `bct-connection-${randomUUID()}`;
          const raw = JSON.stringify({ id, event: 'payment.succeeded', env: 'production',
            data: { transaction: { reference: `PAY-${randomUUID()}`, env: 'production' } } });
          const timestamp = String(Math.floor(Date.now() / 1000));
          const signature = `v1=${createHmac('sha256', process.env.SEEV_WEBHOOK_SECRET).update(`${timestamp}.${raw}`).digest('hex')}`;
          const headers = { 'Content-Type': 'application/json', 'X-Seev-Event-ID': id,
            'X-Seev-Event-Type': 'payment.succeeded', 'X-Seev-Timestamp': timestamp };
          const invalid = await fetch(webhook, { method: 'POST', headers: { ...headers, 'X-Seev-Signature': `v1=${'0'.repeat(64)}` },
            body: raw, redirect: 'error', signal: AbortSignal.timeout(15000) });
          if (invalid.status !== 401) throw new Error(`Invalid webhook signature returned HTTP ${invalid.status}.`);
          const valid = await fetch(webhook, { method: 'POST', headers: { ...headers, 'X-Seev-Signature': signature },
            body: raw, redirect: 'error', signal: AbortSignal.timeout(15000) });
          if (valid.status !== 200) throw new Error(`Valid webhook signature returned HTTP ${valid.status}.`);
          console.log('Live webhook signing: valid signature accepted, invalid signature rejected; no order or ticket was created.');
          NODE
