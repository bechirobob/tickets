# Diagnostic only: these results are not release admission evidence.
name: Diagnose exact Tickets mobile WebKit My Nights
on:
  push:
    branches: [diagnose/tickets-webkit-my-nights-20261027]
permissions:
  contents: read
concurrency:
  group: diagnose-tickets-webkit-my-nights
  cancel-in-progress: false
env:
  BECORE_RELEASE_SHA: d551a5a34967c9eecd3479c67c383a5b31b74149
  BECORE_EXPECTED_SOURCE: d551a5a34967c9eecd3479c67c383a5b31b74149
  BECORE_TRUSTED_BASE: ab92219f25d10e133b77778e83e8a69e17d6e418
jobs:
  diagnostic:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/diagnose/tickets-webkit-my-nights-20261027'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001 --shm-size=1g
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python for existing verification scripts
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d551a5a34967c9eecd3479c67c383a5b31b74149
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source ancestry before executing checkout code
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          [[ "$BECORE_TRUSTED_BASE" =~ ^[a-f0-9]{40}$ && "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BECORE_EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$BECORE_RELEASE_SHA" = "$BECORE_EXPECTED_SOURCE"
          test "$BECORE_TRUSTED_BASE" != "$BECORE_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" "$BECORE_RELEASE_SHA"
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Stage trusted audit verifier
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          umask 077
          for entry in 'verify-audit-release-source.py:tickets-audit-source.py' 'audit-release-dependencies.py:tickets-approved-audit.py'; do
            source="scripts/${entry%%:*}"
            target="$RUNNER_TEMP/${entry#*:}"
            test "$(git ls-tree "$BECORE_TRUSTED_BASE" -- "$source" | cut -d ' ' -f 1)" = 100644
            git show "$BECORE_TRUSTED_BASE:$source" > "$target"
            test "$(git hash-object "$target")" = "$(git rev-parse "$BECORE_TRUSTED_BASE:$source")"
          done
      - name: Verify exact candidate source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          echo "sha=$BECORE_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Audit dependencies
        id: dependency_audit
        env:
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase preinstall
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify installed audited dependencies
        env:
          BECORE_PREINSTALL_RECEIPT_SHA256: ${{ steps.dependency_audit.outputs.audit_receipt_sha256 }}
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase postinstall

      - name: Verify prepared browsers for event-page verification
        run: node scripts/verify-browser-environment.mjs chromium webkit
      - name: Build the audited exact application without changing its source
        run: |
          npm run build
          node scripts/prepare-deploy.mjs
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
      - name: Prepare only isolated local synthetic fixtures
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Observe synthetic browser interaction without modifying application bytes
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          import json
          p = Path("tests/e2e/my-nights-studio.spec.ts")
          source = p.read_text()
          assert source.count("test.use(") == 1
          instrumentation = json.loads('"// Insert immediately before `test.use(...)`, only after the audited application build.\\n// Passive observations only: no application, assertion, timeout, retry, or interaction changes.\\nconst myNightsDiagnostic = new WeakMap<object, string[]>();\\ntest.beforeEach(async ({ page }) => {\\n  const entries: string[] = [];\\n  myNightsDiagnostic.set(page, entries);\\n  page.on(\\"console\\", message => {\\n    const text = message.text();\\n    if (text.startsWith(\\"__MY_NIGHTS_DIAG__\\") && entries.length < 1000) {\\n      entries.push(text.slice(\\"__MY_NIGHTS_DIAG__\\".length));\\n      console.log(text);\\n    }\\n  });\\n  await page.addInitScript(() => {\\n    let sequence = 0;\\n    const snapshot = (phase: string, event?: Event) => {\\n      if (sequence >= 250) return;\\n      const target = event?.target instanceof Element ? event.target.closest(\\"button, a, input\\") : null;\\n      const nav = document.querySelector(\'[aria-label=\\"My Nights views\\"]\');\\n      const historyKeys = Object.keys(history.state ?? {});\\n      const navigation = (window as unknown as Record<symbol, { cachedSearch?: string; suppressUrlNotifyCount?: number; navigationSnapshotActiveCount?: number }>)[Symbol.for(\\"vinext.clientNavigationState\\")];\\n      console.log(\\"__MY_NIGHTS_DIAG__\\" + JSON.stringify({\\n        sequence: sequence++, phase, time: performance.now(), url: location.href,\\n        readyState: document.readyState, historyLength: history.length, historyKeys,\\n        cachedSearch: navigation?.cachedSearch, suppressUrlNotifyCount: navigation?.suppressUrlNotifyCount, navigationSnapshotActiveCount: navigation?.navigationSnapshotActiveCount,\\n        coordinates: event instanceof MouseEvent ? { x: event.clientX, y: event.clientY } : undefined,\\n        eventType: event?.type, isTrusted: event?.isTrusted,\\n        pointerType: typeof PointerEvent !== \\"undefined\\" && event instanceof PointerEvent ? event.pointerType : undefined,\\n        target: target ? { tag: target.tagName, text: target.textContent?.slice(0, 160),\\n          current: target.getAttribute(\\"aria-current\\") } : null,\\n        selection: Array.from(nav?.querySelectorAll(\\"button\\") ?? []).map(button => ({\\n          text: button.textContent, current: button.getAttribute(\\"aria-current\\"),\\n          pressed: button.getAttribute(\\"aria-pressed\\"), disabled: button.hasAttribute(\\"disabled\\"),\\n        })),\\n        listings: Array.from(document.querySelectorAll(\\".night-listing\\")).map(element => element.textContent?.slice(0, 320)),\\n      }));\\n    };\\n    for (const kind of [\\"pointerdown\\", \\"pointerup\\", \\"click\\"]) {\\n      document.addEventListener(kind, event => {\\n        snapshot(\\"capture\\", event);\\n        queueMicrotask(() => snapshot(\\"after-event-microtask\\", event));\\n        requestAnimationFrame(() => snapshot(\\"after-event-frame\\", event));\\n      }, { capture: true, passive: true });\\n    }\\n    for (const kind of [\\"pageshow\\", \\"pagehide\\", \\"popstate\\", \\"hashchange\\"]) {\\n      window.addEventListener(kind, event => snapshot(\\"window-event\\", event), { passive: true });\\n    }\\n    document.addEventListener(\\"DOMContentLoaded\\", () => {\\n      snapshot(\\"DOMContentLoaded\\");\\n      new MutationObserver(records => {\\n        if (records.some(record => record.type === \\"childList\\" || record.attributeName === \\"aria-current\\")) {\\n          snapshot(\\"dom-selection-or-list-change\\");\\n        }\\n      }).observe(document.documentElement, { subtree: true, childList: true,\\n        attributes: true, attributeFilter: [\\"aria-current\\"] });\\n    }, { once: true });\\n  });\\n});\\ntest.afterEach(async ({ page }, info) => {\\n  await info.attach(\\"my-nights-passive-diagnostic\\", {\\n    body: Buffer.from(\\"[\\" + (myNightsDiagnostic.get(page) ?? []).join(\\",\\") + \\"]\\"),\\n    contentType: \\"application/json\\",\\n  });\\n  myNightsDiagnostic.delete(page);\\n});\\n"')
          p.write_text(source.replace("test.use(", instrumentation + "\n\ntest.use(", 1))
          PYDIAG
      - name: Repeat only the failing mobile WebKit synthetic journey
        run: npx playwright test tests/e2e/my-nights-studio.spec.ts --grep 'plans filter, search' --project mobile-webkit --workers=1 --retries=0 --repeat-each=3 --trace=on
      - name: Preserve only synthetic test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-my-nights-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 1
          overwrite: false
