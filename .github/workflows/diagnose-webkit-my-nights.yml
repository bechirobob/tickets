# Diagnostic only: these results are not release admission evidence.
name: Diagnose exact Tickets mobile WebKit My Nights
on:
  push:
    branches: [diagnose/tickets-webkit-my-nights-20261027]
permissions:
  contents: read
concurrency:
  group: diagnose-tickets-webkit-my-nights
  cancel-in-progress: false
env:
  BECORE_RELEASE_SHA: d551a5a34967c9eecd3479c67c383a5b31b74149
  BECORE_EXPECTED_SOURCE: d551a5a34967c9eecd3479c67c383a5b31b74149
  BECORE_TRUSTED_BASE: ab92219f25d10e133b77778e83e8a69e17d6e418
jobs:
  diagnostic:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/diagnose/tickets-webkit-my-nights-20261027'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001 --shm-size=1g
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python for existing verification scripts
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d551a5a34967c9eecd3479c67c383a5b31b74149
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source ancestry before executing checkout code
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          [[ "$BECORE_TRUSTED_BASE" =~ ^[a-f0-9]{40}$ && "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BECORE_EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$BECORE_RELEASE_SHA" = "$BECORE_EXPECTED_SOURCE"
          test "$BECORE_TRUSTED_BASE" != "$BECORE_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" "$BECORE_RELEASE_SHA"
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Stage trusted audit verifier
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          umask 077
          for entry in 'verify-audit-release-source.py:tickets-audit-source.py' 'audit-release-dependencies.py:tickets-approved-audit.py'; do
            source="scripts/${entry%%:*}"
            target="$RUNNER_TEMP/${entry#*:}"
            test "$(git ls-tree "$BECORE_TRUSTED_BASE" -- "$source" | cut -d ' ' -f 1)" = 100644
            git show "$BECORE_TRUSTED_BASE:$source" > "$target"
            test "$(git hash-object "$target")" = "$(git rev-parse "$BECORE_TRUSTED_BASE:$source")"
          done
      - name: Verify exact candidate source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          echo "sha=$BECORE_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Audit dependencies
        id: dependency_audit
        env:
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase preinstall
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify installed audited dependencies
        env:
          BECORE_PREINSTALL_RECEIPT_SHA256: ${{ steps.dependency_audit.outputs.audit_receipt_sha256 }}
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase postinstall

      - name: Verify prepared browsers for event-page verification
        run: node scripts/verify-browser-environment.mjs chromium webkit
      - name: Build the audited exact application without changing its source
        run: |
          npm run build
          node scripts/prepare-deploy.mjs
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
      - name: Prepare only isolated local synthetic fixtures
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Wait for actual opening animation readiness in the focused test
        run: |
          python3 - <<'PYREADY'
          from pathlib import Path
          p = Path("tests/e2e/my-nights-studio.spec.ts")
          source = p.read_text()
          anchor = '  await expect(nav.getByRole("button", { name: /^Past/ })).toHaveAttribute("aria-current", "page");'
          assert source.count(anchor) == 1
          p.write_text(source.replace(anchor, anchor + '\n  await expect(page.getByTestId("brand-arrival")).toBeHidden();', 1))
          PYREADY
      - name: Repeat only the failing mobile WebKit synthetic journey
        run: npx playwright test tests/e2e/my-nights-studio.spec.ts --grep 'plans filter, search' --project mobile-webkit --workers=1 --retries=0 --repeat-each=10 --trace=on
      - name: Preserve only synthetic test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-my-nights-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 1
          overwrite: false
