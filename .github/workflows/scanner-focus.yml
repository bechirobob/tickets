name: Focused scanner browser verification
on:
  push:
    branches: [ops/scanner-focus]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/prepare-operations-browser-fixture.mjs
      - run: npx playwright test --config playwright.operations.config.ts --grep 'gate camera survives' --workers=1 --retries=0
