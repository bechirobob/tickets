name: Prepare scoped VPS SQL return upload
on:
  push:
    branches: [ops/vps-standby-completion-20260929]
    paths: [.github/workflows/handover-return-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - run: node --test tests/handover-export.test.mjs tests/handover-envelope.test.mjs
      - name: Prepare one temporary database and encrypted upload capability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/handover/scoped-return.mjs prepare ops/handover/return-expected.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-return-${{ github.run_id }}
          path: scoped-return
          retention-days: 1
# Bounded SQL export verified on Hermes and on actual D1 with synthetic large blobs.
# Collect safe phase diagnostics for the remaining private-data difference.
# Handle immediate import rejection without a polling bookmark.
# Return only a fixed-vocabulary failure template; never private values or SQL.
# Preserve numeric provider error codes nested inside an error string.
# Decode string-valued provider codes and nested message templates safely.
