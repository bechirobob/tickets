name: Diagnose private runtime downloads read-only
on:
  push:
    branches: [verify/runtime-download-2026-10-03]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d51fecd2f29755210143120bc21814a59639a33d
          persist-credentials: false
      - name: Download and validate exact published runtime without host access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = d51fecd2f29755210143120bc21814a59639a33d
          python3 ops/vps/runtime_release.py download --source 9b3083b346367ec57f6d959c0e98461d333eac90 --run-id 37079781147 --attempt 1 --directory "$RUNNER_TEMP/verified-runtime"
          sha256sum "$RUNNER_TEMP/verified-runtime/tickets-vps-runtime.tar.gz"
          echo "Exact pinned producer receipt, private release, source, asset IDs and all downloaded hashes verified."
