      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit dependencies
        id: dependency_audit
        env:
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase preinstall
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify installed audited dependencies
        env:
          BECORE_PREINSTALL_RECEIPT_SHA256: ${{ steps.dependency_audit.outputs.audit_receipt_sha256 }}
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase postinstall

      - name: Install browsers for event-page verification
        run: npx playwright install --with-deps chromium webkit
      - name: Download exact producer artifact by immutable ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-build
          merge-multiple: true
      - name: Verify and restore the exact candidate build (desktop-chromium)
        id: restore_desktop_chromium
        run: python3 ops/vps/candidate_build.py restore --directory "$RUNNER_TEMP/candidate-build" --browser desktop-chromium
      - name: Prepare isolated event fixtures (desktop-chromium)
        id: fixtures_desktop_chromium
        if: ${{ !cancelled() && steps.restore_desktop_chromium.outcome == 'success' }}
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Capture natural Room entry before the full browser suite (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test tests/e2e/room-natural-entry.spec.ts --project desktop-chromium --workers=1 --retries=0 --output test-results/room-entry
      - name: Preserve natural Room entry evidence immediately (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: python3 ops/vps/candidate_evidence.py encode --root test-results/room-entry --stage room-entry --source-sha "$BECORE_RELEASE_SHA" --browser desktop-chromium
      - name: Verify every browser journey before release (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test --project desktop-chromium
      - name: Verify keyboard navigation focus without retries (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: npx playwright test tests/e2e/navigation-audit.spec.ts --project desktop-chromium --workers=1 --retries=0 --repeat-each=3 --output test-results/navigation-focus
      - name: Verify optional SeevPlus checkout on desktop and mobile (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: |
          node scripts/prepare-seev-browser-fixture.mjs
          npx playwright test --config playwright.seev.config.ts --project desktop-chromium --output test-results/seevplus
      - name: Verify opt-in USDC checkout without provider traffic (desktop-chromium)
        if: ${{ !cancelled() && steps.fixtures_desktop_chromium.outcome == 'success' }}
        run: |
          node scripts/prepare-seev-browser-fixture.mjs crypto
          npx playwright test --config playwright.seev-crypto.config.ts --project desktop-chromium --output test-results/seevplus-crypto
      - name: Verify RSVP and interest registration on desktop and mobile (desktop-chromium)
