        run: |
          node scripts/prepare-registration-browser-fixture.mjs
          npx playwright test --config playwright.registration.config.ts --project desktop-chromium --output test-results/registration
      - name: Verify owner Operations workflows on desktop and mobile (desktop-chromium)
