      BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      BUILD_ARCHIVE_DIGEST: ${{ needs.build.outputs.archive_digest }}
      BUILD_MANIFEST_DIGEST: ${{ needs.build.outputs.manifest_digest }}
    steps:
