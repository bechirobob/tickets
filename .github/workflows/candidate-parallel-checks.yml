      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Verify installed audited dependencies
        env:
          BECORE_PREINSTALL_RECEIPT_SHA256: ${{ steps.dependency_audit.outputs.audit_receipt_sha256 }}
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase postinstall

      - name: Install browsers for event-page verification
        run: npx playwright install --with-deps chromium webkit
      - name: Download exact producer artifact by immutable ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-build
          merge-multiple: true
      - name: Verify and restore the exact candidate build (mobile-webkit)
        id: restore_mobile_webkit
        run: python3 ops/vps/candidate_build.py restore --directory "$RUNNER_TEMP/candidate-build" --browser mobile-webkit
      - name: Prepare isolated event fixtures (mobile-webkit)
        id: fixtures_mobile_webkit
        if: ${{ !cancelled() && steps.restore_mobile_webkit.outcome == 'success' }}
        run: npx wrangler d1 migrations apply DB --local --persist-to .wrangler/state
      - name: Capture natural Room entry before the full browser suite (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: npx playwright test tests/e2e/room-natural-entry.spec.ts --project mobile-webkit --workers=1 --retries=0 --output test-results/room-entry
      - name: Preserve natural Room entry evidence immediately (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: python3 ops/vps/candidate_evidence.py encode --root test-results/room-entry --stage room-entry --source-sha "$BECORE_RELEASE_SHA" --browser mobile-webkit
      - name: Verify every browser journey before release (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: npx playwright test --project mobile-webkit
      - name: Verify keyboard navigation focus without retries (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: npx playwright test tests/e2e/navigation-audit.spec.ts --project mobile-webkit --workers=1 --retries=0 --repeat-each=3 --output test-results/navigation-focus
      - name: Verify optional SeevPlus checkout on desktop and mobile (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: |
          node scripts/prepare-seev-browser-fixture.mjs
          npx playwright test --config playwright.seev.config.ts --project mobile-webkit --output test-results/seevplus
      - name: Verify opt-in USDC checkout without provider traffic (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: |
          node scripts/prepare-seev-browser-fixture.mjs crypto
          npx playwright test --config playwright.seev-crypto.config.ts --project mobile-webkit --output test-results/seevplus-crypto
      - name: Verify RSVP and interest registration on desktop and mobile (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: |
          node scripts/prepare-registration-browser-fixture.mjs
          npx playwright test --config playwright.registration.config.ts --project mobile-webkit --output test-results/registration
      - name: Verify owner Operations workflows on desktop and mobile (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: |
          node scripts/prepare-operations-browser-fixture.mjs
          npx playwright test --config playwright.operations.config.ts --project mobile-webkit --workers=1 --retries=0 --output test-results/operations
      - name: Preserve required Operations visual evidence immediately (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: python3 ops/vps/candidate_evidence.py encode --root test-results/operations --stage operations --source-sha "$BECORE_RELEASE_SHA" --browser mobile-webkit
      - name: Verify host report fixture recovery without retries (mobile-webkit)
        if: ${{ !cancelled() && steps.fixtures_mobile_webkit.outcome == 'success' }}
        run: npx playwright test --config playwright.operations.config.ts --project mobile-webkit --grep 'host lands on their event' --workers=1 --retries=0 --repeat-each=3 --output test-results/host-overview

  verify:
    name: verify
    needs: [build, desktop_chromium, mobile_chromium, mobile_webkit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every exact browser lane and build to succeed
        env:
          BUILD: ${{ needs.build.result }}
          DESKTOP: ${{ needs.desktop_chromium.result }}
          MOBILE: ${{ needs.mobile_chromium.result }}
          WEBKIT: ${{ needs.mobile_webkit.result }}
        run: |
          test "$BUILD" = success
          test "$DESKTOP" = success
          test "$MOBILE" = success
          test "$WEBKIT" = success
          echo 'Advisory parallel benchmark only; production admission remains unchanged.'
