name: Verify isolated handover tools
on:
  push:
    branches: [ops/vps-standby-completion-20260929]
    paths: ['ops/handover/**', 'tests/handover-*.test.mjs', '.github/workflows/handover-tools.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: test -f ops/handover/writer-lock.mjs && test -f tests/handover-writer-lock.test.mjs
      - run: node --test tests/handover-export.test.mjs tests/handover-data.test.mjs tests/handover-writer-lock.test.mjs tests/handover-envelope.test.mjs
      - run: node --check ops/handover/verify-restored-state.mjs
