name: Bubble Wash Cloudflare Deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bubble-wash-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubble-wash-cloudflare-production
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Resolve the current Bubble Wash release
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git ls-remote https://github.com/bechirobob/bubble-wash.git refs/heads/main | awk '{print $1}')"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          phase="$(curl --fail --silent --show-error "https://raw.githubusercontent.com/bechirobob/bubble-wash/$target_sha/migration/cloudflare-phase.json" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => { const phase=JSON.parse(value).phase; if(!["idle","staging","cutover","production"].includes(phase)) process.exit(1); process.stdout.write(phase); })')"
          deployment_phase="staging"
          if [[ "$phase" == "production" ]]; then deployment_phase="production"; fi
          current="$(curl --silent --show-error --max-time 10 https://bubble-wash.becoreops.workers.dev/api/health || true)"
          current_sha="$(node -e 'try { const value=JSON.parse(process.argv[1]); process.stdout.write(typeof value.release === "string" ? value.release : ""); } catch {}' "$current")"
          current_phase="$(node -e 'try { const value=JSON.parse(process.argv[1]); process.stdout.write(typeof value.deploymentPhase === "string" ? value.deploymentPhase : ""); } catch {}' "$current")"
          needs_deploy=true
          if [[ "$current_sha" == "$target_sha" && "$current_phase" == "$deployment_phase" ]]; then needs_deploy=false; fi
          if [[ "$deployment_phase" == "staging" && "$needs_deploy" == "false" ]]; then
            staged="$(curl --silent --show-error --max-time 10 https://staging.bubblewash.co/api/health || true)"
            staged_sha="$(node -e 'try { const value=JSON.parse(process.argv[1]); process.stdout.write(typeof value.release === "string" ? value.release : ""); } catch {}' "$staged")"
            staged_phase="$(node -e 'try { const value=JSON.parse(process.argv[1]); process.stdout.write(typeof value.deploymentPhase === "string" ? value.deploymentPhase : ""); } catch {}' "$staged")"
            if [[ "$staged_sha" != "$target_sha" || "$staged_phase" != "staging" ]]; then needs_deploy=true; fi
          fi
          if [[ "$deployment_phase" == "production" && "$needs_deploy" == "false" ]]; then
            production="$(curl --silent --show-error --max-time 10 https://bubblewash.co/api/health || true)"
            production_sha="$(node -e 'try { const value=JSON.parse(process.argv[1]); process.stdout.write(typeof value.release === "string" ? value.release : ""); } catch {}' "$production")"
            production_phase="$(node -e 'try { const value=JSON.parse(process.argv[1]); process.stdout.write(typeof value.deploymentPhase === "string" ? value.deploymentPhase : ""); } catch {}' "$production")"
            if [[ "$production_sha" != "$target_sha" || "$production_phase" != "production" ]]; then needs_deploy=true; fi
          fi
          printf 'sha=%s\nphase=%s\ndeployment_phase=%s\nneeds_deploy=%s\n' "$target_sha" "$phase" "$deployment_phase" "$needs_deploy" >> "$GITHUB_OUTPUT"

      - name: Check out Bubble Wash
        if: steps.target.outputs.needs_deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bechirobob/bubble-wash
          ref: ${{ steps.target.outputs.sha }}
          path: bubble-wash
          persist-credentials: false

      - name: Set up Node.js
        if: steps.target.outputs.needs_deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Ensure Cloudflare resources and configure the release
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEPLOYMENT_PHASE: ${{ steps.target.outputs.deployment_phase }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, "Content-Type": "application/json" };
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const subdomainEndpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/subdomain`;
          const subdomain = await fetch(subdomainEndpoint, { headers });
          if (!subdomain.ok) {
            const created = await fetch(subdomainEndpoint, { method: "PUT", headers, body: JSON.stringify({ subdomain: "becoreops" }) });
            if (!created.ok) throw new Error(`Workers subdomain setup failed: ${await created.text()}`);
          }

          const databaseEndpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          let response = await fetch(`${databaseEndpoint}?name=bubble-wash-db`, { headers });
          let payload = await response.json();
          let database = payload.result?.find((candidate) => candidate.name === "bubble-wash-db");
          if (!database?.uuid) {
            response = await fetch(databaseEndpoint, { method: "POST", headers, body: JSON.stringify({ name: "bubble-wash-db", primary_location_hint: "weur" }) });
            payload = await response.json();
            database = payload.result;
          }
          if (!response.ok || !database?.uuid) throw new Error(`D1 database setup failed: ${JSON.stringify(payload.errors ?? payload)}`);

          const config = JSON.parse(await readFile("wrangler.jsonc", "utf8"));
          config.d1_databases[0].database_id = database.uuid;
          config.vars.BUBBLEWASH_RELEASE_SHA = process.env.TARGET_SHA;
          config.vars.BUBBLEWASH_DEPLOYMENT_PHASE = process.env.DEPLOYMENT_PHASE;
          config.vars.BUBBLEWASH_MIGRATION_ENABLED = process.env.DEPLOYMENT_PHASE === "production" ? "false" : "true";
          if (process.env.DEPLOYMENT_PHASE !== "production") {
            config.routes = [{ pattern: "staging.bubblewash.co", custom_domain: true }];
          }
          await writeFile("wrangler.jsonc", `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Cloudflare release configured for ${process.env.DEPLOYMENT_PHASE}.`);
          NODE

      - name: Install locked dependencies
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        run: npm ci

      - name: Verify the release gates
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        run: |
          npm run cf:types
          npm run verify:migrations
          npm run lint
          npm test
          npm run typecheck
          npm run audit:full
          npm run audit:prod
          npm run build
          npm run deploy:dry-run
          npm run verify:routes

      - name: Record D1 recovery bookmark
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        run: npx wrangler d1 time-travel info DB --json > d1-pre-deploy-bookmark.json

      - name: Preserve D1 recovery bookmark
        if: steps.target.outputs.needs_deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bubblewash-d1-pre-deploy-${{ steps.target.outputs.sha }}-${{ steps.target.outputs.deployment_phase }}
          path: bubble-wash/d1-pre-deploy-bookmark.json
          if-no-files-found: error
          retention-days: 35

      - name: Apply D1 migrations
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        shell: bash
        run: |
          set +e
          output="$(npm run deploy:built 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -ne 0 ]]; then
            summary="$(printf '%s\n' "$output" | tail -n 35 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
            printf '::error title=Cloudflare Worker deployment failed::%.4000s\n' "$summary"
            exit "$status"
          fi

      - name: Ensure persistent Worker secrets
        if: steps.target.outputs.needs_deploy == 'true'
        working-directory: bubble-wash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { spawnSync } from "node:child_process";

          const args = ["wrangler", "secret", "list", "--format", "json", "--config", "dist/server/wrangler.json"];
          const listed = spawnSync("npx", args, { encoding: "utf8", env: process.env });
          if (listed.status !== 0) throw new Error(listed.stderr || "Could not inspect Bubble Wash Worker secrets.");
          const names = new Set(JSON.parse(listed.stdout).map((item) => item.name));
          for (const name of ["BUBBLEWASH_SESSION_SECRET", "BUBBLEWASH_MAINTENANCE_TOKEN"]) {
            if (names.has(name)) continue;
            const value = randomBytes(48).toString("base64url");
            const written = spawnSync("npx", ["wrangler", "secret", "put", name, "--config", "dist/server/wrangler.json"], { input: `${value}\n`, encoding: "utf8", env: process.env });
            if (written.status !== 0) throw new Error(written.stderr || `Could not configure ${name}.`);
          }
          console.log("Persistent Bubble Wash Worker secrets are configured.");
          NODE

      - name: Verify the staged Worker
        if: steps.target.outputs.needs_deploy == 'true' && steps.target.outputs.deployment_phase == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://bubble-wash.becoreops.workers.dev https://staging.bubblewash.co; do
            response="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --max-time 15 "$origin/api/health")"
            node -e 'const value=JSON.parse(process.argv[1]); if(value.release!==process.argv[2] || value.deploymentPhase!=="staging") process.exit(1)' "$response" "${{ steps.target.outputs.sha }}"
          done

      - name: Verify production cutover
        if: steps.target.outputs.needs_deploy == 'true' && steps.target.outputs.deployment_phase == 'production'
        shell: bash
        run: |
          set -euo pipefail
          for path in / /services /book /track /manage /early-access /api/health /api/ready; do
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors --max-time 15 --output /dev/null "https://bubblewash.co$path"
          done
          response="$(curl --fail --silent --show-error --max-time 15 https://bubblewash.co/api/health)"
          node -e 'const value=JSON.parse(process.argv[1]); if(value.release!==process.argv[2] || value.deploymentPhase!=="production") process.exit(1)' "$response" "${{ steps.target.outputs.sha }}"

      - name: Report current release
        if: always()
        run: |
          {
            echo "## Bubble Wash Cloudflare reconciliation"
            echo
            echo "Target: \`${{ steps.target.outputs.sha }}\`"
            echo "Requested phase: \`${{ steps.target.outputs.phase }}\`"
            echo "Deployment phase: \`${{ steps.target.outputs.deployment_phase }}\`"
            echo "Deployment required: \`${{ steps.target.outputs.needs_deploy }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
