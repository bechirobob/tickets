name: Shared input modality regressions
on:
  push:
    branches: [fix/shared-input-focus-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: input-modality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/input-modality.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      # setContent + real components/styles only: no app server, accounts or API writes.
      - run: npx playwright test --config playwright.input-modality.config.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: input-modality-${{ github.sha }}
          path: test-results/input-modality
          retention-days: 14
