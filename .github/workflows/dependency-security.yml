name: Dependency security

on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, .github/dependabot.yml, .github/workflows/dependency-security.yml]
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on moderate or higher production advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Include build and development dependencies in the security gate
        run: npm audit --audit-level=moderate
