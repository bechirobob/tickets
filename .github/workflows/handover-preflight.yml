name: Tickets durable-work reconciliation evidence
on:
  push:
    branches: [ops/vps-reconciliation-evidence]
    paths: ['.github/workflows/handover-preflight.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Read all durable-work counters without changing source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { cloudflare, account } from './ops/handover/control-client.mjs';
          import { durableWorkChecks } from './worker/handover-reconciliation.ts';
          const root='/accounts/'+account;
          const s=await cloudflare(root+'/workers/scripts/becore-tickets/settings');
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          const sql=Object.entries(durableWorkChecks).map(([name,query])=>"SELECT '"+name+"' AS category,n FROM ("+query+")").join(' UNION ALL ');
          const rows=(await cloudflare(root+'/d1/database/'+db+'/query','POST',{sql}))[0].results;
          console.log(JSON.stringify({readOnly:true,durableWork:rows}));
          NODE
