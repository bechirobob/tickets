name: Inspect live Tickets handover prerequisites
on:
  push:
    branches: [feat/vps-live-handover-20260929]
    paths: ['.github/workflows/handover-preflight.yml', 'ops/handover/live-preflight.mjs']
permissions:
  contents: read
concurrency:
  group: tickets-live-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Read source queues, record counts and routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { cloudflare, account, withControl } from './ops/handover/control-client.mjs';
          const root='/accounts/'+account, worker=root+'/workers/scripts/becore-tickets';
          const revision='1acd916c7414b30665c4f903dd2ce3ccf10609a0';
          const s=await cloudflare(worker+'/settings');
          assert.equal(s.bindings.find(b=>b.name==='RELEASE_SHA')?.text,revision);
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          const query=async sql=>(await cloudflare(root+'/d1/database/'+db+'/query','POST',{sql}))[0].results;
          const admission=(await query('SELECT phase,transfer_id FROM _bct_handover_admission WHERE id=1'))[0];
          assert.equal(admission.phase,'active');
          assert.equal(admission.transfer_id,'034c4f23-82b8-402c-91a6-aaba1f6625f0');
          const queue=await cloudflare(root+'/queues/4bcab6ba4d2447efa852e83c9091906c');
          assert.equal(Boolean(queue.settings.delivery_paused),false);
          const domains=await cloudflare(root+'/workers/domains');
          assert.ok(domains.some(d=>d.hostname==='tickets.becoreops.com'&&d.service==='becore-tickets'));
          await cloudflare(worker+'/secrets','PUT',{name:'HANDOVER_TRACKING',text:'0',type:'secret_text'});
          await withControl(revision,async rpc=>{
            const state=await rpc('sourceStatus');
            assert.equal(state.tracking,false);
            assert.equal(state.admission.phase,'active');
            console.log(JSON.stringify({normalSourceRestored:true,sourceWriter:'cloudflare',tracking:false,queuePaused:false,unresolvedOperationsPreserved:state.operations}));
          });
          NODE
