name: Inspect live Tickets handover prerequisites
on:
  push:
    branches: [feat/vps-live-handover-20260929]
    paths: ['.github/workflows/handover-preflight.yml', 'ops/handover/live-preflight.mjs']
permissions:
  contents: read
concurrency:
  group: tickets-live-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Read source queues, record counts and routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/handover/live-preflight.mjs
