name: Monitor prepared Tickets source drain
on:
  push:
    branches: [ops/vps-reconciliation-evidence]
    paths: ['.github/workflows/handover-preflight.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Check new lifecycle records during the existing drain window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { cloudflare, account } from './ops/handover/control-client.mjs';
          const root='/accounts/'+account;
          const s=await cloudflare(root+'/workers/scripts/becore-tickets/settings');
          assert.equal(s.bindings.find(b=>b.name==='RELEASE_SHA').text,'18d1a08e0e77f862870aecd6b9fbcec4705c3bb8');
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          const q=async sql=>(await cloudflare(root+'/d1/database/'+db+'/query','POST',{sql}))[0].results;
          for(let i=0;i<3;i++){
            const newer=await q("SELECT kind,COUNT(*) AS count,MIN(started_at) AS oldest,MAX(started_at) AS newest FROM _bct_handover_operations WHERE started_at>'2026-09-29T10:14:07.037Z' GROUP BY kind");
            const admission=await q("SELECT phase,transfer_id FROM _bct_handover_admission WHERE id=1");
            console.log(JSON.stringify({readOnly:true,observedAt:new Date().toISOString(),newerOperations:newer,admission}));
            if(i<2)await new Promise(resolve=>setTimeout(resolve,60000));
          }
          NODE
