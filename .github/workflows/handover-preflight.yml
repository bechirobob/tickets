name: Inspect live Tickets handover prerequisites
on:
  push:
    branches: [feat/vps-live-handover-20260929]
    paths: ['.github/workflows/handover-preflight.yml', 'ops/handover/live-preflight.mjs']
permissions:
  contents: read
concurrency:
  group: tickets-live-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Read source queues, record counts and routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { cloudflare, account } from './ops/handover/control-client.mjs';
          const root='/accounts/'+account;
          const s=await cloudflare(root+'/workers/scripts/becore-tickets/settings');
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          const query=async sql=>(await cloudflare(root+'/d1/database/'+db+'/query','POST',{sql}))[0].results;
          console.log(JSON.stringify({readOnly:true,admission:await query('SELECT phase,transfer_id,paused_at FROM _bct_handover_admission'),operations:await query('SELECT kind,COUNT(*) AS count,MIN(started_at) AS oldest,MAX(started_at) AS newest FROM _bct_handover_operations GROUP BY kind')}));
          const telemetry=await cloudflare(root+'/workers/observability/telemetry/query','POST',{queryId:'tickets-handover-diagnose',timeframe:{from:Date.parse('2026-09-29T10:11:00Z'),to:Date.parse('2026-09-29T10:15:00Z')},view:'events',limit:1000,parameters:{filters:[{key:'$metadata.service',operation:'eq',type:'string',value:'becore-tickets'}]}});
          console.log(JSON.stringify({telemetryKeys:Object.keys(telemetry),eventsKeys:telemetry.events&&Object.keys(telemetry.events),sampleKeys:telemetry.events?.events?.[0]&&Object.keys(telemetry.events.events[0])}));
          const serialized=JSON.stringify(telemetry);
          console.log(JSON.stringify({categories:Object.fromEntries(['waitUntil','cancelled','Illegal invocation','Cannot perform','Response Stream Disconnected','exceeded','error'].map(s=>[s,serialized.split(s).length-1]))}));
          NODE
