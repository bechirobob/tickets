name: Tickets durable-work reconciliation evidence
on:
  push:
    branches: [ops/vps-reconciliation-evidence]
    paths: ['.github/workflows/handover-preflight.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Identify the exact schema counter requiring correction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { cloudflare, account } from './ops/handover/control-client.mjs';
          import { durableWorkChecks } from './worker/handover-reconciliation.ts';
          const root='/accounts/'+account;
          const s=await cloudflare(root+'/workers/scripts/becore-tickets/settings');
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          for(const [category,sql] of Object.entries(durableWorkChecks)){
            const response=await fetch('https://api.cloudflare.com/client/v4'+root+'/d1/database/'+db+'/query',{method:'POST',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql})});
            const data=await response.json();
            console.log(JSON.stringify({readOnly:true,category,status:response.status,success:data.success,counts:data.result?.[0]?.results,errors:data.errors?.map(e=>({code:e.code,message:e.message}))}));
          }
          NODE
