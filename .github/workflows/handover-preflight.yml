name: Inspect live Tickets handover prerequisites
on:
  push:
    branches: [feat/vps-live-handover-20260929]
    paths: ['.github/workflows/handover-preflight.yml', 'ops/handover/live-preflight.mjs']
permissions:
  contents: read
concurrency:
  group: tickets-live-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Read source queues, record counts and routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { cloudflare, account } from './ops/handover/control-client.mjs';
          const root='/accounts/'+account;
          const s=await cloudflare(root+'/workers/scripts/becore-tickets/settings');
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          const query=async sql=>(await cloudflare(root+'/d1/database/'+db+'/query','POST',{sql}))[0].results;
          console.log(JSON.stringify({readOnly:true,admission:await query('SELECT phase,transfer_id,paused_at FROM _bct_handover_admission'),operations:await query('SELECT kind,COUNT(*) AS count,MIN(started_at) AS oldest,MAX(started_at) AS newest FROM _bct_handover_operations GROUP BY kind')}));
          const telemetry=await cloudflare(root+'/workers/observability/telemetry/query','POST',{queryId:'tickets-handover-completion',timeframe:{from:Date.parse('2026-09-29T10:11:00Z'),to:Date.parse('2026-09-29T10:15:00Z')},view:'events',limit:2000,parameters:{filters:[{key:'$metadata.service',operation:'eq',type:'string',value:'becore-tickets'},{key:'$metadata.type',operation:'eq',type:'string',value:'cf-worker-event'}]}});
          const events=telemetry.events.events;
          const canceled=events.filter(e=>e.$workers?.outcome==='canceled'&&e.$workers?.event?.request?.method==='GET').sort((a,b)=>a.timestamp-b.timestamp);
          const ops=await query('SELECT id,kind,started_at FROM _bct_handover_operations ORDER BY started_at');
          console.log(JSON.stringify({returned:events.length,total:telemetry.events.count,canceledCount:canceled.length,operationCount:ops.length,canceledSamples:canceled.slice(0,6).map(e=>({timestamp:e.timestamp,wallTimeMs:e.$workers.wallTimeMs,pathCategory:e.$workers.event.path?.split('/').slice(0,3).join('/')})),operationSamples:ops.slice(0,6).map(o=>({started_at:o.started_at,epoch:Date.parse(o.started_at)})),nearestDeltas:ops.slice(0,12).map(o=>Math.min(...canceled.map(e=>Math.abs(e.timestamp-Date.parse(o.started_at)))))}));
          NODE
