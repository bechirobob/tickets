name: Inspect live Tickets handover prerequisites
on:
  push:
    branches: [feat/vps-live-handover-20260929]
    paths: ['.github/workflows/handover-preflight.yml', 'ops/handover/live-preflight.mjs']
permissions:
  contents: read
concurrency:
  group: tickets-live-handover
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Read source queues, record counts and routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { cloudflare, account } from './ops/handover/control-client.mjs';
          const root='/accounts/'+account;
          const s=await cloudflare(root+'/workers/scripts/becore-tickets/settings');
          const db=s.bindings.find(b=>b.type==='d1'&&b.name==='DB').id;
          const query=async sql=>(await cloudflare(root+'/d1/database/'+db+'/query','POST',{sql}))[0].results;
          console.log(JSON.stringify({readOnly:true,admission:await query('SELECT phase,transfer_id,paused_at FROM _bct_handover_admission'),operations:await query('SELECT id,kind,started_at FROM _bct_handover_operations ORDER BY started_at')}));
          NODE
