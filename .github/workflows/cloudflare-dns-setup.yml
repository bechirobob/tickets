name: Prepare Cloudflare DNS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-dns-setup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-dns-setup
  cancel-in-progress: false

jobs:
  prepare-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
      CLOUDFLARE_ZONE_NAME: becoreops.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Safe to rerun: this reconciles the pending zone without changing nameservers.
      - name: Synchronize pending DNS zone
        id: dns
        continue-on-error: true
        run: |
          mkdir -p infra
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const api = "https://api.cloudflare.com/client/v4";
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const zoneName = process.env.CLOUDFLARE_ZONE_NAME;
          const status = {
            checked_at: new Date().toISOString(),
            zone: zoneName,
            success: false,
            zone_status: null,
            actions: [],
            error: null,
          };

          const request = async (path, options = {}) => {
            const response = await fetch(`${api}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              const detail = (payload.errors || []).map(({ code, message }) => ({ code, message }));
              throw new Error(JSON.stringify({ http_status: response.status, errors: detail }));
            }
            return payload;
          };

          const persist = async () => {
            await writeFile(
              "infra/cloudflare-dns-status.json",
              `${JSON.stringify(status, null, 2)}\n`,
            );
          };

          try {
            const zones = await request(
              `/zones?name=${encodeURIComponent(zoneName)}&account.id=${accountId}`,
            );
            const zone = zones.result?.find((item) => item.name === zoneName);
            if (!zone?.id) throw new Error("Cloudflare zone not found or token lacks Zone Read.");

            status.zone_status = zone.status;
            const listed = await request(`/zones/${zone.id}/dns_records?per_page=500`);
            let records = listed.result || [];

            const desired = [
              {
                type: "CNAME",
                name: `address.${zoneName}`,
                content: "custom-domains.chatgpt.site",
                proxied: false,
                ttl: 1,
              },
              {
                type: "TXT",
                name: `_openai-site-verification.address.${zoneName}`,
                content: "openai-site-verification=CcDzsWfRDuYgbhM3vMK2kpWDWro_3qXod8QOvu11TNI",
                ttl: 1,
              },
              {
                type: "TXT",
                name: `_cf-custom-hostname.address.${zoneName}`,
                content: "bd95e2ad-0517-427d-bfdf-26d506d1100e",
                ttl: 1,
              },
            ];

            for (const record of desired) {
              const current = records.find(
                (item) => item.type === record.type && item.name === record.name,
              );
              if (current) {
                const updated = await request(
                  `/zones/${zone.id}/dns_records/${current.id}`,
                  { method: "PUT", body: JSON.stringify(record) },
                );
                records = records.map((item) =>
                  item.id === current.id ? updated.result : item,
                );
                status.actions.push({ record: record.name, action: "updated" });
              } else {
                const created = await request(`/zones/${zone.id}/dns_records`, {
                  method: "POST",
                  body: JSON.stringify(record),
                });
                records.push(created.result);
                status.actions.push({ record: record.name, action: "created" });
              }
            }

            const proxyTargets = records.filter(
              (record) =>
                (record.type === "A" && record.name === zoneName) ||
                (record.type === "CNAME" && record.name === `www.${zoneName}`),
            );
            for (const record of proxyTargets) {
              if (record.proxied !== true) {
                status.actions.push({ record: record.name, action: "already_dns_only" });
                continue;
              }
              await request(`/zones/${zone.id}/dns_records/${record.id}`, {
                method: "PATCH",
                body: JSON.stringify({ proxied: false }),
              });
              status.actions.push({ record: record.name, action: "set_dns_only" });
            }

            status.success = true;
          } catch (error) {
            status.error = String(error.message || error);
          }

          await persist();
          if (!status.success) process.exitCode = 1;
          NODE

      - name: Commit sanitized DNS status
        if: always()
        run: |
          if [ ! -f infra/cloudflare-dns-status.json ]; then
            mkdir -p infra
            printf '%s\n' '{"success":false,"error":"DNS setup ended before a status file was produced."}' > infra/cloudflare-dns-status.json
          fi
          git config user.name "BeCoreOps Deploy"
          git config user.email "deploy@becoreops.com"
          git add infra/cloudflare-dns-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Cloudflare DNS setup status"
          git push

      - name: Enforce DNS setup result
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import status from "./infra/cloudflare-dns-status.json" with { type: "json" };
          if (!status.success) {
            console.error(status.error || "Cloudflare DNS setup failed.");
            process.exit(1);
          }
          console.log("Cloudflare DNS preparation completed.");
          NODE
