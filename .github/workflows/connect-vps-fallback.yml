name: Connect Tickets fallback monitor
on:
  push:
    branches: [feat/vps-maintenance-fallback]
    paths: [.github/workflows/connect-vps-fallback.yml]
permissions:
  contents: read
concurrency:
  group: tickets-fallback-activation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare an ephemeral activation key
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/tickets-activation-public"
          ssh-keygen -q -t ed25519 -N '' -C "tickets-fallback-$GITHUB_RUN_ID" -f "$RUNNER_TEMP/tickets-activation-key"
          python3 - <<'PY'
          import os, pathlib, urllib.request, ipaddress, json
          trace=urllib.request.urlopen('https://www.cloudflare.com/cdn-cgi/trace',timeout=15).read().decode()
          ip=next(line[3:] for line in trace.splitlines() if line.startswith('ip='))
          assert ipaddress.ip_address(ip).version == 4
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          value={'public_key':(p/'tickets-activation-key.pub').read_text().strip(),'runner_ip':ip,'run_id':os.environ['GITHUB_RUN_ID'],'revision':os.environ['GITHUB_SHA']}
          (p/'tickets-activation-public/request.json').write_text(json.dumps(value))
          (p/'tickets-activation-known-hosts').write_text('51.195.20.137 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAalegFjLD/4zTqsuuPil9dABCrYDfLOkT1nsFkRiO8C\n')
          PY
      - name: Publish public activation metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tickets-activation-public
          path: ${{ runner.temp }}/tickets-activation-public/request.json
          retention-days: 1
          if-no-files-found: error
      - name: Wait for restricted host authorization and connect privately
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess, time, json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          ssh=['ssh','-T','-i',str(p/'tickets-activation-key'),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ConnectTimeout=8','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(p/'tickets-activation-known-hosts'),'root@51.195.20.137']
          for attempt in range(90):
              probe=subprocess.run(ssh+['probe'],stdin=subprocess.DEVNULL,capture_output=True,timeout=15)
              if probe.returncode == 0 and probe.stdout.strip() == b'tickets-activation-ready':
                  break
              time.sleep(10)
          else:
              raise SystemExit('Restricted activation authorization did not become ready.')
          payload=json.dumps({
              'CLOUDFLARE_API_TOKEN':os.environ['CLOUDFLARE_API_TOKEN'].strip(),
              'CLOUDFLARE_ZONE_ID':'bbf0174f839a0d22dbf6d9f4bd3cf53d',
              'CLOUDFLARE_FALLBACK_RULESET_ID':'c2e81ba1a73248c0a2974c1fc6889e28',
              'CLOUDFLARE_FALLBACK_RULE_ID':'33ad93cad5f1407bb22bd3cca2686db5'
          }).encode()
          result=subprocess.run(ssh+['activate'],input=payload,capture_output=True,timeout=150)
          if result.returncode != 0:
              raise SystemExit('Private activation failed; inspect sanitized service status through the existing VPS connection.')
          if b'One-minute fallback monitor is active; first check completed.' not in result.stdout:
              raise SystemExit('Activation did not return the expected confirmation.')
          print('Private VPS connection installed; one-minute monitor active; first check completed.')
          denied=subprocess.run(ssh+['probe'],stdin=subprocess.DEVNULL,capture_output=True,timeout=15)
          assert denied.returncode != 0, 'Temporary activation key was not removed.'
          print('Temporary SSH activation key has been revoked.')
          PY
      - name: Destroy the runner activation key
        if: always()
        run: rm -f "$RUNNER_TEMP/tickets-activation-key" "$RUNNER_TEMP/tickets-activation-key.pub" "$RUNNER_TEMP/tickets-activation-known-hosts"
