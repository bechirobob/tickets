name: Verify Tickets fallback API payload without changing routing
on:
  push:
    branches: [ops/tickets-terminal-observer]
    paths: ['.github/workflows/tickets-rule-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify exact managed-rule PATCH while preserving its enabled state
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://api.cloudflare.com/client/v4/zones/bbf0174f839a0d22dbf6d9f4bd3cf53d/rulesets';
          async function api(path,method='GET',body){
           const response=await fetch(base+path,{method,headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
           const value=await response.json(); assert.ok(response.ok&&value.success, 'Managed rule request failed: HTTP '+response.status); return value.result;
          }
          const ruleset=await api('/phases/http_request_dynamic_redirect/entrypoint');
          const matches=ruleset.rules.filter(r=>r.ref==='becore_tickets_vps_maintenance');assert.equal(matches.length,1);
          const rule=matches[0]; assert.equal(rule.action,'redirect');
          assert.equal(rule.action_parameters.from_value.target_url.value,'https://tickets-status.becoreops.com/');
          const {ref,action,expression,description,action_parameters,enabled}=rule;
          assert.ok(expression.includes('http.host eq "tickets.becoreops.com"'));
          await api('/'+ruleset.id+'/rules/'+rule.id,'PATCH',{ref,action,expression,description,action_parameters,enabled});
          const verified=await api('/'+ruleset.id);
          const found=verified.rules.find(r=>r.id===rule.id);
          for(const field of ['ref','action','expression','description','action_parameters','enabled']) assert.deepEqual(found[field],rule[field]);
          console.log(JSON.stringify({managedRulePayloadAccepted:true,routingStateUnchanged:true,enabled,ruleId:rule.id,rulesetId:ruleset.id}));
          NODE
