name: Inspect Tickets offline shell routes
on:
  push:
    branches: [ops/tickets-terminal-observer]
    paths: ['.github/workflows/tickets-rule-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public service-worker cache prerequisites
        run: |
          node --input-type=module <<'NODE'
          for(const path of ['/healthz','/sw.js','/offline-ticket','/offline-ticket.html','/manifest.webmanifest','/favicon.svg','/apple-touch-icon.png','/brand/becore-ticket.webp']){
            const r=await fetch('https://tickets.becoreops.com'+path,{headers:{'user-agent':'Mozilla/5.0 (compatible; BeCoreTicketsHealth/1.0)','accept':'*/*'},redirect:'manual'});
            await r.arrayBuffer();
            console.log(JSON.stringify({path,status:r.status,type:r.headers.get('content-type'),location:r.headers.get('location')}));
          }
          NODE
