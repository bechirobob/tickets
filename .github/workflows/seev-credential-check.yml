name: Inspect Tickets credential bridge metadata
on:
  push:
    branches: [ops/seev-checkout-release]
    paths: [.github/workflows/seev-credential-check.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read only non-secret service metadata
        run: |
          tailscale ssh root@hermes 'python3 -' <<'PY'
          import pathlib,subprocess,json,stat,hashlib,os
          service='becore-tickets.service'
          def prop(name):return subprocess.check_output(['systemctl','show',service,'--property='+name,'--value'],text=True).strip()
          report={'service':{k:prop(k) for k in ['WorkingDirectory','MainPID','User','ActiveState','FragmentPath','DropInPaths']},'loadCredentialProperty':prop('LoadCredential')}
          base=pathlib.Path('/etc/systemd/system')
          files=[base/service,base/(service+'.d/private-configuration.conf'),base/(service+'.d/scanner-release.conf')]
          report['unitFiles']=[]
          for file in files:
              meta=file.lstat();text=file.read_text()
              report['unitFiles'].append({'path':str(file),'regular':stat.S_ISREG(meta.st_mode),'mode':oct(stat.S_IMODE(meta.st_mode)),'sha256':hashlib.sha256(text.encode()).hexdigest(),'credentialSourceDeclared':'LoadCredential=runtime.json:/etc/becore-tickets/runtime.json' in text,'runtimeConfigPathDeclared':'TICKETS_CONFIG=/run/becore-tickets-runtime/runtime.json' in text,'credentialCopyDeclared':'$CREDENTIALS_DIRECTORY/runtime.json' in text or '%d/runtime.json' in text})
          report['configFiles']=[]
          raw=[]
          for file in [pathlib.Path('/etc/becore-tickets/runtime.json'),pathlib.Path('/run/becore-tickets-runtime/runtime.json')]:
              meta=file.lstat();raw.append(file.read_bytes());values=json.loads(raw[-1])
              report['configFiles'].append({'path':str(file),'regular':stat.S_ISREG(meta.st_mode),'mode':oct(stat.S_IMODE(meta.st_mode)),'uid':meta.st_uid,'nlink':meta.st_nlink,'allValuesStrings':all(isinstance(v,str) for v in values.values()),'cryptoEnabled':values.get('SEEV_CRYPTO_ENABLED')=='true'})
          report['canonicalAndEffectiveMatch']=raw[0]==raw[1]
          for name in ['current','previous']:report[name]=os.readlink('/srv/becore-tickets/'+name)
          report['candidateDirectoryExists']=pathlib.Path('/srv/becore-tickets/releases/8a25812f1a0fc81e4ff4f956542097b4465e050f').exists()
          report['failedReleaseEvidenceExists']=pathlib.Path('/var/lib/becore-tickets-handover/code-release-36730822498-1').exists()
          print(json.dumps(report))
          PY
