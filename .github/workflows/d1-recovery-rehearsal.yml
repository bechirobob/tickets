name: Legacy D1 recovery applicability

on:
  push:
    branches:
      - main
    paths:
      - "scripts/check-d1-recovery-runtime.mjs"
      - "scripts/rehearse-d1-recovery.sh"
      - "tests/d1-recovery-privacy.test.mjs"
      - ".github/workflows/d1-recovery-rehearsal.yml"
  schedule:
    - cron: "15 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Verify active runtime and classify legacy D1
        run: node scripts/check-d1-recovery-runtime.mjs
      - name: Preserve applicability report (not recovery proof)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-d1-applicability-${{ github.run_id }}
          path: d1-recovery-rehearsal-report.json
          if-no-files-found: error
          retention-days: 30
