name: Diagnose SQL return using synthetic data only
on:
  push:
    branches: [ops/vps-standby-completion-20260929]
    paths: [.github/workflows/handover-return-diagnose.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/handover/diagnose-d1-return.mjs
# Include a representative large binary poster in the synthetic export.
# Verify bounded binary assembly fixes SQLITE_TOOBIG.
# Exercise the full application schema with synthetic data and a large poster.
