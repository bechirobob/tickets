name: Inspect four historical bounce codes read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/tickets-bounce-codes-readonly-20261024.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == '48f40f80941210d4663c8470012c42c53f146b05' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact predecessor and four-path diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^1)" = '48f40f80941210d4663c8470012c42c53f146b05'
          printf '%s\n' '.github/workflows/tickets-bounce-codes-readonly-20261024.yml' 'docs/operations/historical-bounce-code-inspection.md' 'ops/vps/inspect-bounce-codes-readonly.py' 'ops/vps/test_bounce_codes_readonly.py' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          python3 -B -m unittest discover -s ops/vps -p test_bounce_codes_readonly.py
          python3 -B -m unittest discover -s ops/vps -p test_mail_service_readonly.py
      - name: Connect existing Tickets identity
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Read only exact-cohort numeric SMTP evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYBUILD' | tailscale ssh root@hermes 'python3 -B -'
          import json
          from pathlib import Path
          metadata=Path('ops/vps/inspect-mail-service-readonly.py').read_text()
          diagnostic=Path('ops/vps/inspect-bounce-codes-readonly.py').read_text()
          print('import sys,types')
          print("m=types.ModuleType('tickets_mail_metadata')")
          print("sys.modules['tickets_mail_metadata']=m")
          print('exec(compile('+repr(metadata)+",'<reviewed-metadata>','exec'),m.__dict__)")
          print('exec(compile('+repr(diagnostic)+",'<reviewed-bounce-diagnostic>','exec'),{'__name__':'__main__'})")
          PYBUILD
