# Dedicated Tickets main-only OIDC connection configured separately.
name: Verify Tickets VPS runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-runtime.yml'
      - 'runtime/**'
      - 'ops/vps/**'
      - 'ops/handover/**'
      - 'scripts/**'
      - 'worker/**'
      - 'lib/**'
      - 'app/**'
      - 'db/**'
      - 'drizzle/**'
      - 'public/**'
      - 'styles/**'
      - 'tests/**'
      - 'package*.json'
      - '*config*'
permissions:
  contents: read
concurrency:
  group: tickets-vps-runtime
  cancel-in-progress: true
jobs:
  verify:
    # Publishing a runtime needs contents:write; no other job receives it.
    # Never run a privileged package publisher against a PR or feature branch.
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BECORE_RELEASE_SHA: ${{ github.sha }}
      BECORE_TRUSTED_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source ancestry before executing checkout code
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          [[ "$BECORE_TRUSTED_BASE" =~ ^[a-f0-9]{40}$ && "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$BECORE_TRUSTED_BASE" != "$BECORE_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          git merge-base --is-ancestor "$BECORE_RELEASE_SHA" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" "$BECORE_RELEASE_SHA"
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Stage trusted audit verifier
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          umask 077
          for entry in 'verify-audit-release-source.py:tickets-audit-source.py' 'audit-release-dependencies.py:tickets-approved-audit.py'; do
            source="scripts/${entry%%:*}"
            target="$RUNNER_TEMP/${entry#*:}"
            test "$(git ls-tree "$BECORE_TRUSTED_BASE" -- "$source" | cut -d ' ' -f 1)" = 100644
            git show "$BECORE_TRUSTED_BASE:$source" > "$target"
            test "$(git hash-object "$target")" = "$(git rev-parse "$BECORE_TRUSTED_BASE:$source")"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Verify approved dependency audit
        id: dependency_audit
        env:
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase preinstall
      - run: npm ci --no-audit
      - name: Verify installed audited dependencies
        env:
          BECORE_PREINSTALL_RECEIPT_SHA256: ${{ steps.dependency_audit.outputs.audit_receipt_sha256 }}
          BECORE_AUDIT_DIRECTORY: ${{ runner.temp }}/tickets-private-audit-${{ github.job }}
        run: python3 -I "$RUNNER_TEMP/tickets-approved-audit.py" --phase postinstall

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:vps
      - run: python -m unittest discover -s ops/vps -p 'test_*.py'
      - run: npm run build:vps
      - run: node scripts/verify-vps-runtime.mjs
      - name: Prepare verified runtime without development dependencies
        run: |
          git diff --exit-code --stat HEAD --
          # Keep the npm-ci lockfile as input without saving normalized metadata.
          npm prune --omit=dev --ignore-scripts --no-save
          git diff --exit-code --stat HEAD --
          node scripts/verify-vps-runtime.mjs
          cp -a node_modules dist-vps/node_modules
          cp -a drizzle dist-vps/migrations
          # Copy reviewed tracked operator source only; test caches never ship.
          mkdir -p dist-vps/operations
          git ls-files -z ops/vps | while IFS= read -r -d '' source; do
            target="dist-vps/operations/${source#ops/vps/}"
            mkdir -p "$(dirname "$target")"
            cp -- "$source" "$target"
          done
          tar -C dist-vps -czf tickets-vps-runtime.tar.gz .
          sha256sum tickets-vps-runtime.tar.gz > tickets-vps-runtime.tar.gz.sha256
      - name: Publish verified public runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/vps/runtime_release.py publish --directory .
  handoff:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BECORE_RELEASE_SHA: ${{ github.sha }}
      BECORE_TRUSTED_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source ancestry before executing checkout code
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          [[ "$BECORE_TRUSTED_BASE" =~ ^[a-f0-9]{40}$ && "$BECORE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$BECORE_TRUSTED_BASE" != "$BECORE_RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$BECORE_RELEASE_SHA"
          git merge-base --is-ancestor "$BECORE_RELEASE_SHA" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" origin/main
          git merge-base --is-ancestor "$BECORE_TRUSTED_BASE" "$BECORE_RELEASE_SHA"
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Stage trusted audit verifier
        shell: bash
        run: |
          set -euo pipefail
          unset "${!GIT_@}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_NO_LAZY_FETCH=1 GIT_TERMINAL_PROMPT=0
          umask 077
          for entry in 'verify-audit-release-source.py:tickets-audit-source.py' 'audit-release-dependencies.py:tickets-approved-audit.py'; do
            source="scripts/${entry%%:*}"
            target="$RUNNER_TEMP/${entry#*:}"
            test "$(git ls-tree "$BECORE_TRUSTED_BASE" -- "$source" | cut -d ' ' -f 1)" = 100644
            git show "$BECORE_TRUSTED_BASE:$source" > "$target"
            test "$(git hash-object "$target")" = "$(git rev-parse "$BECORE_TRUSTED_BASE:$source")"
          done
      - name: Inspect current data and private connection readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAFF_LOGIN_DECOY_SECRET: ${{ secrets.STAFF_LOGIN_DECOY_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          SEEV_CHECKOUT_API_KEY: ${{ secrets.SEEV_CHECKOUT_API_KEY }}
          SEEV_WEBHOOK_SECRET: ${{ secrets.SEEV_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_WALLET_PRIVATE_KEY: ${{ secrets.GOOGLE_WALLET_PRIVATE_KEY }}
          APPLE_WALLET_SIGNER_TOKEN: ${{ secrets.APPLE_WALLET_SIGNER_TOKEN }}
          APPLE_WALLET_AUTH_SECRET: ${{ secrets.APPLE_WALLET_AUTH_SECRET }}
        run: node scripts/inspect-vps-handoff.mjs

