# Non-release scheduler experiment. Dummy files only; never release evidence.
name: Isolated dummy artifact retry mechanics
on:
  push:
    branches: [experiment/dummy-retry-mechanics-20261028]
    paths: [.github/workflows/retry-mechanics-experiment.yml]
permissions:
  contents: read
jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      producer_attempt: ${{ steps.identity.outputs.attempt }}
      payload_digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Create inert payload and original identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p "$RUNNER_TEMP/dummy-producer"
          printf 'dummy-only:%s:%s:%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/dummy-producer/payload.txt"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$RUNNER_TEMP/dummy-producer/payload.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload immutable dummy artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dummy-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dummy-producer/payload.txt
          if-no-files-found: error
          retention-days: 1
  retained_a:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PRODUCER_ATTEMPT: ${{ needs.producer.outputs.producer_attempt }}
      ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
      PAYLOAD_DIGEST: ${{ needs.producer.outputs.payload_digest }}
    steps:
      - name: Verify inherited producer outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCER_ATTEMPT" = 1
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PAYLOAD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" = 1 || "$GITHUB_RUN_ATTEMPT" = 2 ]]
      - name: Download original immutable dummy artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/dummy-consumer
          merge-multiple: true
      - name: Verify full dummy payload and print non-authorizing receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PAYLOAD_DIGEST" "$RUNNER_TEMP/dummy-consumer/payload.txt" | sha256sum --check --strict
          expected="dummy-only:$GITHUB_SHA:$GITHUB_RUN_ID:$PRODUCER_ATTEMPT"
          test "$(cat "$RUNNER_TEMP/dummy-consumer/payload.txt")" = "$expected"
          python3 - <<'PYTHON'
          import json, os
          keys = ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','PRODUCER_ATTEMPT','ARTIFACT_ID','ARTIFACT_DIGEST','PAYLOAD_DIGEST')
          print(json.dumps({'release_authorized': False, **{k:os.environ[k] for k in keys}}, sort_keys=True))
          PYTHON
  retained_b:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PRODUCER_ATTEMPT: ${{ needs.producer.outputs.producer_attempt }}
      ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
      PAYLOAD_DIGEST: ${{ needs.producer.outputs.payload_digest }}
    steps:
      - name: Verify inherited producer outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCER_ATTEMPT" = 1
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PAYLOAD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" = 1 || "$GITHUB_RUN_ATTEMPT" = 2 ]]
      - name: Download original immutable dummy artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/dummy-consumer
          merge-multiple: true
      - name: Verify full dummy payload and print non-authorizing receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PAYLOAD_DIGEST" "$RUNNER_TEMP/dummy-consumer/payload.txt" | sha256sum --check --strict
          expected="dummy-only:$GITHUB_SHA:$GITHUB_RUN_ID:$PRODUCER_ATTEMPT"
          test "$(cat "$RUNNER_TEMP/dummy-consumer/payload.txt")" = "$expected"
          python3 - <<'PYTHON'
          import json, os
          keys = ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','PRODUCER_ATTEMPT','ARTIFACT_ID','ARTIFACT_DIGEST','PAYLOAD_DIGEST')
          print(json.dumps({'release_authorized': False, **{k:os.environ[k] for k in keys}}, sort_keys=True))
          PYTHON
  retry_target:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PRODUCER_ATTEMPT: ${{ needs.producer.outputs.producer_attempt }}
      ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
      PAYLOAD_DIGEST: ${{ needs.producer.outputs.payload_digest }}
    steps:
      - name: Verify inherited producer outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCER_ATTEMPT" = 1
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PAYLOAD_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" = 1 || "$GITHUB_RUN_ATTEMPT" = 2 ]]
      - name: Deliberate pre-download surrogate failure on original attempt
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" = 1 ]]; then
            echo 'Intentional scheduler experiment; not an actual network failure.'
            exit 42
          fi
      - name: Download original immutable dummy artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/dummy-consumer
          merge-multiple: true
      - name: Verify full dummy payload and print non-authorizing receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PAYLOAD_DIGEST" "$RUNNER_TEMP/dummy-consumer/payload.txt" | sha256sum --check --strict
          expected="dummy-only:$GITHUB_SHA:$GITHUB_RUN_ID:$PRODUCER_ATTEMPT"
          test "$(cat "$RUNNER_TEMP/dummy-consumer/payload.txt")" = "$expected"
          python3 - <<'PYTHON'
          import json, os
          keys = ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','PRODUCER_ATTEMPT','ARTIFACT_ID','ARTIFACT_DIGEST','PAYLOAD_DIGEST')
          print(json.dumps({'release_authorized': False, **{k:os.environ[k] for k in keys}}, sort_keys=True))
          PYTHON
  aggregate:
    if: always()
    needs: [producer, retained_a, retained_b, retry_target]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Inspect complete dummy job result graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os
          results=json.loads(os.environ['RESULTS'])
          print(json.dumps({'release_authorized': False, 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'needs': results},sort_keys=True))
          assert set(results)=={'producer','retained_a','retained_b','retry_target'}
          assert all(v['result']=='success' for v in results.values()), 'Expected first-attempt synthetic failure'
          PYTHON
