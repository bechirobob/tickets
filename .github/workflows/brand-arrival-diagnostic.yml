name: Isolated WebKit arrival timing diagnostic
on:
  push:
    branches: [diagnostic/brand-arrival-webkit-20261024]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps webkit
      - run: test -z "${E2E_BASE_URL:-}" && npx playwright test --config playwright.brand-arrival-diagnostic.config.ts --repeat-each=10 --output test-results/brand-arrival
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-brand-arrival-${{ github.sha }}
          path: test-results/brand-arrival
          retention-days: 7
