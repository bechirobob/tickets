name: Inspect installed Tickets mail service read-only
on:
  push:
    branches: [main]
    paths: [.github/workflows/tickets-mail-service-readonly-20261024.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickets-vps-handover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == '885bd1b2d97ff687fe884c86314ae9b368d4abff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact predecessor and four-path diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^1)" = '885bd1b2d97ff687fe884c86314ae9b368d4abff'
          printf '%s\n' '.github/workflows/tickets-mail-service-readonly-20261024.yml' 'docs/operations/mail-service-readonly-inspection.md' 'ops/vps/inspect-mail-service-readonly.py' 'ops/vps/test_mail_service_readonly.py' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          python3 -m unittest discover -s ops/vps -p test_mail_service_readonly.py
      - name: Connect existing Tickets identity
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          audience: api.tailscale.com/TQyYk1uNME11CNTRL-kCerQyAvJU11CNTRL
          tags: tag:tickets-ci
          ping: hermes
      - name: Inspect installed metadata without sends or configuration changes
        shell: bash
        run: |
          set -euo pipefail
          tailscale ssh root@hermes 'python3 -B -' < ops/vps/inspect-mail-service-readonly.py
