name: Remove Weekend Braai
on:
  push:
    branches: [ops/remove-weekend-braai]
    paths: [scripts/remove-weekend-braai.mjs, .github/workflows/remove-weekend-braai.yml]
permissions:
  contents: read
concurrency:
  group: remove-weekend-braai
  cancel-in-progress: false
jobs:
  remove:
    if: github.repository == 'bechirobob/tickets' && github.ref == 'refs/heads/ops/remove-weekend-braai'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify syntax
        run: node --check scripts/remove-weekend-braai.mjs
      - name: Remove exact owner-authorized listing and verify cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af75a230de2eea882606db8d9acce473
        run: node scripts/remove-weekend-braai.mjs
